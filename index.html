<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="referrer" content="no-referrer">
<meta name="theme-color" content="#e8edf5">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="私调记录">
<meta name="format-detection" content="telephone=no">
<link rel="apple-touch-icon" href="icon-180.png">
<link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Cdefs%3E%3ClinearGradient id='g' x1='0' y1='0' x2='1' y2='1'%3E%3Cstop offset='0' stop-color='%2387b4ff'/%3E%3Cstop offset='.55' stop-color='%23a98bff'/%3E%3Cstop offset='1' stop-color='%23ff9cc2'/%3E%3C/linearGradient%3E%3C/defs%3E%3Crect width='100' height='100' rx='24' fill='url(%23g)'/%3E%3Crect x='26' y='30' width='48' height='40' rx='8' fill='none' stroke='%23fff' stroke-width='6'/%3E%3Ccircle cx='42' cy='46' r='5' fill='%23fff'/%3E%3Cpath d='M32 68l10-10 7 7 6-6 13 13v4H32z' fill='%23fff'/%3E%3C/svg%3E">
<title>私调记录</title>
<style>
*{box-sizing:border-box;margin:0;padding:0}
:root{
  --bg1:#f0f1f3;
  --bg2:#e4e6ea;
  --glass:rgba(255,255,255,0.32);
  --glass-border:rgba(255,255,255,0.58);
  --glass-strong:rgba(255,255,255,0.45);
  --text:#3a3f47;
  --muted:#8b919a;
  --btn:rgba(255,255,255,0.42);
  --btn-text:#4a5160;
  --accent:rgba(130,136,148,0.4);
  --shadow:0 12px 40px rgba(70,75,85,0.12), inset 0 1px 0 rgba(255,255,255,0.55);
  --blur:16px;
  --radius:22px;
  --float-shadow:0 18px 50px rgba(60,65,75,0.14), 0 4px 12px rgba(60,65,75,0.07), inset 0 1px 0 rgba(255,255,255,0.65);
}
html,body{
  width:100%;min-height:100%;
  overscroll-behavior:none;
  background:
    radial-gradient(ellipse 80% 50% at 10% -10%, rgba(255,255,255,0.95) 0%, transparent 55%),
    radial-gradient(ellipse 70% 45% at 95% 5%, rgba(210,214,220,0.55) 0%, transparent 50%),
    radial-gradient(ellipse 60% 40% at 50% 100%, rgba(190,194,200,0.35) 0%, transparent 45%),
    linear-gradient(165deg, var(--bg1) 0%, var(--bg2) 55%, #d8dbe0 100%);
  color:var(--text);
  font-family:-apple-system,BlinkMacSystemFont,"PingFang SC","Microsoft YaHei",sans-serif;
  overflow-x:hidden;
}
body.modal-lock{overflow:hidden;touch-action:none}
button,input,textarea{font:inherit;color:inherit}
button{cursor:pointer;border:none;background:none}
input,textarea{outline:none}
.app{min-height:100vh;display:flex;align-items:stretch;justify-content:center;padding:0}
.shell-wrap{
  width:100%;
  max-width:480px;
  min-height:100vh;
  display:flex;
  flex-direction:column;
}
.glass{
  background:linear-gradient(145deg, rgba(255,255,255,0.45) 0%, rgba(255,255,255,0.18) 45%, rgba(255,255,255,0.28) 100%);
  border:1px solid rgba(255,255,255,0.55);
  backdrop-filter:blur(var(--blur)) saturate(1.35);
  -webkit-backdrop-filter:blur(var(--blur)) saturate(1.35);
  box-shadow:var(--float-shadow);
  border-radius:0;
  flex:1;
  display:flex;
  flex-direction:column;
  min-height:100vh;
  position:relative;
}
.glass::before{
  content:"";
  pointer-events:none;
  position:absolute;inset:0;
  border-radius:inherit;
  background:linear-gradient(180deg, rgba(255,255,255,0.35) 0%, transparent 28%);
  opacity:.7;
}
@media (min-width:500px){
  .app{padding:18px 14px}
  .shell-wrap{min-height:calc(100vh - 36px);border-radius:28px;overflow:hidden}
  .glass{min-height:calc(100vh - 36px);border-radius:28px}
}
.name-screen{
  padding:36px 28px;
  text-align:center;
  flex:1;
  display:flex;
  flex-direction:column;
  align-items:center;
  justify-content:center;
  min-height:100vh;
}
@media (min-width:500px){
  .name-screen{min-height:calc(100vh - 32px)}
}
.name-screen h1{font-size:20px;font-weight:600;margin-bottom:8px}
.name-screen p{color:var(--muted);font-size:13px;margin-bottom:20px}
.name-screen input{
  width:100%;border:1px solid var(--glass-border);
  background:var(--glass-strong);border-radius:14px;
  padding:13px 14px;font-size:15px;margin-bottom:14px;
}
.primary-btn{
  width:100%;
  background:linear-gradient(160deg, rgba(255,255,255,0.55), rgba(255,255,255,0.22));
  border:1px solid rgba(255,255,255,0.6);
  color:var(--btn-text);
  font-weight:600;padding:12px;border-radius:16px;
  backdrop-filter:blur(16px) saturate(1.2);-webkit-backdrop-filter:blur(16px) saturate(1.2);
  box-shadow:0 8px 24px rgba(60,80,120,0.12), inset 0 1px 0 rgba(255,255,255,0.7);
}
.primary-btn:active{opacity:.85}
.primary-btn:disabled{opacity:.45;cursor:not-allowed}
.shell{display:none;overflow:hidden;flex:1;min-height:100vh;min-height:100dvh;flex-direction:column}
.shell.show{display:flex;flex-direction:column}
.topbar{
  display:flex;align-items:center;gap:12px;
  padding:14px 14px 12px;
  border-bottom:1px solid rgba(255,255,255,0.28);
  background:linear-gradient(180deg, rgba(255,255,255,0.22), transparent);
}
.avatar-wrap{
  width:46px;height:46px;border-radius:50%;overflow:hidden;
  background:rgba(255,255,255,0.5);border:1.5px solid var(--glass-border);
  flex-shrink:0;cursor:pointer;
}
.avatar-wrap img{width:100%;height:100%;object-fit:cover;display:block}
.avatar-placeholder{
  width:100%;height:100%;display:flex;align-items:center;justify-content:center;
  font-size:18px;color:var(--muted);
}
.upload-input{display:none}
.title-area{flex:1;min-width:0}
.main-title{font-size:15px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.subtitle{font-size:11px;color:var(--muted);margin-top:2px}
.icon-btn{
  width:36px;height:36px;border-radius:14px;
  background:linear-gradient(160deg, rgba(255,255,255,0.5), rgba(255,255,255,0.2));
  border:1px solid rgba(255,255,255,0.55);
  display:flex;align-items:center;justify-content:center;
  font-size:16px;color:var(--btn-text);flex-shrink:0;
  backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);
  box-shadow:0 6px 16px rgba(60,80,120,0.1), inset 0 1px 0 rgba(255,255,255,0.65);
  position:relative;overflow:hidden;
}
.toolbar{
  display:flex;align-items:center;gap:8px;
  padding:12px 14px 8px;
}
.tool-btn{
  flex:1;
  background:linear-gradient(160deg, rgba(255,255,255,0.48), rgba(255,255,255,0.18));
  border:1px solid rgba(255,255,255,0.55);
  color:var(--btn-text);
  font-size:12px;font-weight:600;
  padding:10px 8px;border-radius:14px;
  backdrop-filter:blur(16px) saturate(1.2);-webkit-backdrop-filter:blur(16px) saturate(1.2);
  box-shadow:0 6px 18px rgba(60,80,120,0.1), inset 0 1px 0 rgba(255,255,255,0.65);
}
.tool-btn.compact{
  flex:0 0 auto;
  min-width:56px;
  max-width:72px;
  padding:10px 8px;
  font-size:12px;
}
.tool-btn.strong{
  background:linear-gradient(160deg, rgba(255,255,255,0.65), rgba(255,255,255,0.3));
}
.import-btn{
  flex-shrink:0;
  background:linear-gradient(160deg, rgba(255,255,255,0.48), rgba(255,255,255,0.18));
  border:1px solid rgba(255,255,255,0.55);
  color:var(--btn-text);
  font-size:12px;font-weight:600;
  padding:10px 12px;border-radius:14px;
  backdrop-filter:blur(16px) saturate(1.2);-webkit-backdrop-filter:blur(16px) saturate(1.2);
  box-shadow:0 6px 18px rgba(60,80,120,0.1), inset 0 1px 0 rgba(255,255,255,0.65);
}
.page{display:none;padding:4px 14px 18px;flex:1;overflow-y:auto;-webkit-overflow-scrolling:touch}
.page.active{display:block}
.folder-grid{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.folder-card{
  position:relative;
  background:linear-gradient(160deg, rgba(255,255,255,0.5), rgba(255,255,255,0.18));
  border:1px solid rgba(255,255,255,0.58);
  border-radius:20px;overflow:hidden;cursor:pointer;
  box-shadow:0 14px 36px rgba(50,70,110,0.14), 0 2px 8px rgba(50,70,110,0.06), inset 0 1px 0 rgba(255,255,255,0.7);
  backdrop-filter:blur(20px) saturate(1.3);-webkit-backdrop-filter:blur(20px) saturate(1.3);
  transform:translateZ(0);
}
.folder-card:active{opacity:.92}
.folder-grid.moving .folder-card{cursor:grab;opacity:.85}
.folder-grid.moving .folder-card.dragging{opacity:.4;cursor:grabbing}
.folder-grid.moving .folder-card.drag-over{outline:2px solid var(--accent,#8892a0);outline-offset:2px}
.move-hint{display:none;text-align:center;font-size:12px;color:var(--muted);padding:6px 0 10px}
.move-hint.show{display:block}
.folder-cover{width:100%;aspect-ratio:1;object-fit:cover;display:block;background:rgba(230,234,240,0.6)}
.folder-cover-empty{
  width:100%;aspect-ratio:1;background:rgba(230,234,240,0.5);
  display:flex;align-items:center;justify-content:center;color:var(--muted);font-size:26px;
}
.folder-name-tag{
  position:absolute;left:8px;bottom:8px;z-index:2;
  max-width:calc(100% - 16px);
  padding:6px 10px;border-radius:12px;
  background:linear-gradient(160deg, rgba(255,255,255,0.65), rgba(255,255,255,0.32));
  border:1px solid rgba(255,255,255,0.7);
  backdrop-filter:blur(14px) saturate(1.2);-webkit-backdrop-filter:blur(14px) saturate(1.2);
  box-shadow:0 4px 12px rgba(50,70,110,0.1), inset 0 1px 0 rgba(255,255,255,0.75);
  font-size:14px;font-weight:800;letter-spacing:.04em;
  color:var(--text);line-height:1.2;
  white-space:nowrap;overflow:hidden;text-overflow:ellipsis;
}
.empty-tip{text-align:center;color:var(--muted);font-size:13px;padding:48px 10px;grid-column:1/-1}
.page-head{display:flex;align-items:center;gap:10px;padding:6px 0 14px}
.back-btn{
  width:34px;height:34px;border-radius:12px;
  background:var(--btn);border:1px solid var(--glass-border);
  display:flex;align-items:center;justify-content:center;font-size:18px;
}
.page-head h2{font-size:15px;font-weight:600}
.page-head h2:empty{display:none}
.form-card{
  background:linear-gradient(160deg, rgba(255,255,255,0.48), rgba(255,255,255,0.2));
  border:1px solid rgba(255,255,255,0.55);
  border-radius:20px;padding:14px;
  backdrop-filter:blur(18px) saturate(1.2);-webkit-backdrop-filter:blur(18px) saturate(1.2);
  box-shadow:0 12px 32px rgba(50,70,110,0.1), inset 0 1px 0 rgba(255,255,255,0.65);
}
.form-row{margin-bottom:12px}
.form-row:last-child{margin-bottom:0}
.form-row label{display:block;font-size:13px;color:var(--text);margin-bottom:8px;font-weight:700;letter-spacing:.03em}
.form-row input{
  width:100%;
  border:1px solid rgba(255,255,255,0.6);
  border-radius:14px;
  background:linear-gradient(160deg, rgba(255,255,255,0.55), rgba(255,255,255,0.22));
  backdrop-filter:blur(16px) saturate(1.2);
  -webkit-backdrop-filter:blur(16px) saturate(1.2);
  box-shadow:0 6px 18px rgba(60,65,75,0.08), inset 0 1px 0 rgba(255,255,255,0.7);
  padding:12px 14px;
  font-size:14px;
  color:var(--text);
}
.form-row input:focus{
  border-color:rgba(255,255,255,0.85);
  background:linear-gradient(160deg, rgba(255,255,255,0.7), rgba(255,255,255,0.32));
  outline:none;
}
.preview-box{
  width:100%;aspect-ratio:1.35;border-radius:14px;
  background:rgba(230,234,240,0.5);border:1px dashed rgba(180,188,200,0.5);
  overflow:hidden;display:flex;align-items:center;justify-content:center;
  color:var(--muted);font-size:13px;cursor:pointer;
}
.preview-box img{width:100%;height:100%;object-fit:cover;display:block}
.preview-box.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:6px;padding:6px;align-content:start;overflow-y:auto}
.preview-box.grid img{width:100%;aspect-ratio:1;object-fit:cover;border-radius:8px}
.hint{font-size:11px;color:var(--muted);margin-top:10px;line-height:1.5}
.detail-info{
  background:var(--glass-strong);border:1px solid var(--glass-border);
  border-radius:16px;padding:14px;margin-bottom:12px;font-size:13px;line-height:1.75;
}
.detail-info .big-name{font-size:20px;font-weight:700;margin-bottom:10px;letter-spacing:.03em}
.detail-info b{color:var(--muted);font-weight:500;margin-right:6px}
.detail-card-title{
  font-size:28px;font-weight:800;letter-spacing:.06em;
  color:var(--text);line-height:1.25;margin:4px 0 12px;padding:0 2px;
}
.detail-meta{
  background:var(--glass-strong);border:1px solid var(--glass-border);
  border-radius:14px;padding:12px 14px;margin-bottom:12px;
  font-size:12px;font-weight:700;line-height:1.7;color:var(--text);
}
.detail-meta span{color:var(--muted);font-weight:700;margin-right:4px}
.edit-btn,.save-btn{
  font-size:11px;padding:6px 10px;border-radius:999px;
  background:var(--btn);border:1px solid var(--glass-border);color:var(--btn-text);
  margin-right:4px;
}
.settings-icon-img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;display:block;border-radius:inherit}
.total-bar{
  background:rgba(255,255,255,0.7);border:1px solid var(--glass-border);
  border-radius:14px;padding:12px 14px;margin-bottom:14px;
  display:flex;align-items:center;justify-content:space-between;
}
.total-bar .label{font-size:13px;color:var(--muted)}
.total-bar .value{font-size:18px;font-weight:700}
.section-label{font-size:12px;color:var(--muted);margin-bottom:8px}
.record-list{display:flex;flex-direction:column;gap:10px}
.record-item{
  display:flex;gap:10px;align-items:center;
  background:linear-gradient(160deg, rgba(255,255,255,0.48), rgba(255,255,255,0.2));
  border:1px solid rgba(255,255,255,0.55);
  border-radius:16px;padding:10px;
  backdrop-filter:blur(16px);-webkit-backdrop-filter:blur(16px);
  box-shadow:0 8px 22px rgba(50,70,110,0.08), inset 0 1px 0 rgba(255,255,255,0.6);
}
.record-thumb{width:56px;height:56px;border-radius:12px;object-fit:cover;background:rgba(230,234,240,0.6);flex-shrink:0;cursor:zoom-in}
.record-body{flex:1;min-width:0}
.record-wrap{position:relative;margin-bottom:8px}
.record-checkbox{position:absolute;top:10px;left:10px;width:20px;height:20px;z-index:2;accent-color:#8892a0;display:none}
.record-checkbox.show{display:block}
.multi-bar{display:none;gap:8px;margin-bottom:10px}
.multi-bar.show{display:flex}
.multi-bar button{flex:1;padding:9px 4px;font-size:12px;border-radius:12px;border:1px solid var(--glass-border);background:var(--glass);color:var(--btn-text)}
.multi-bar button.danger{color:#c0392b}
.multi-bar button.primary{background:var(--btn)}
.record-body .n{font-size:13px;font-weight:600;margin-bottom:2px}
.record-body .m{font-size:11px;color:var(--muted)}
.del-btn{
  font-size:11px;padding:6px 10px;border-radius:999px;
  background:var(--btn);border:1px solid var(--glass-border);color:var(--muted);
}
.folder-status-tag{
  position:absolute;top:50%;left:50%;transform:translate(-50%,-50%);z-index:3;
  padding:6px 14px;border-radius:999px;
  background:linear-gradient(160deg, rgba(255,255,255,0.62), rgba(255,255,255,0.3));
  border:1px solid rgba(255,255,255,0.72);
  backdrop-filter:blur(12px) saturate(1.2);-webkit-backdrop-filter:blur(12px) saturate(1.2);
  box-shadow:0 4px 10px rgba(50,70,110,0.14), inset 0 1px 0 rgba(255,255,255,0.7);
  font-size:12px;font-weight:700;color:var(--text);
  letter-spacing:.05em;cursor:pointer;
}
.folder-edit-btn{
  position:absolute;top:8px;right:8px;z-index:3;
  width:26px;height:26px;border-radius:50%;
  background:linear-gradient(160deg, rgba(255,255,255,0.65), rgba(255,255,255,0.32));
  border:1px solid rgba(255,255,255,0.72);
  backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);
  box-shadow:0 4px 10px rgba(50,70,110,0.14);
  display:flex;align-items:center;justify-content:center;
  font-size:13px;color:var(--text);cursor:pointer;
}
.folder-action-chip{
  width:100%;padding:13px;border-radius:999px;
  background:rgba(255,255,255,0.7);border:1px solid var(--glass-border);
  font-size:14px;font-weight:600;color:var(--text);
  backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);
}
.folder-action-chip.danger{color:#c0392b}
.card-price-row{
  display:flex;align-items:center;justify-content:space-between;
  background:var(--glass-strong);border:1px solid var(--glass-border);
  border-radius:14px;padding:10px 14px;margin-bottom:12px;
}
.card-price-row .label{font-size:12px;font-weight:700;color:var(--muted)}
.card-price-row .value{font-size:14px;font-weight:700;color:var(--text)}
.topbar-total{text-align:right;margin-right:2px;flex-shrink:0}
.topbar-total .t-label{font-size:10px;color:var(--muted);line-height:1.2}
.topbar-total .t-value{font-size:13px;font-weight:700;line-height:1.2}
.modal-mask{
  display:none;position:fixed;inset:0;z-index:40;
  background:rgba(40,48,60,0.28);
  backdrop-filter:blur(6px);-webkit-backdrop-filter:blur(6px);
  align-items:center;justify-content:center;padding:16px;
}
.modal-mask.show{display:flex}
.modal{
  width:100%;max-width:420px;max-height:78vh;overflow:auto;
  background:linear-gradient(160deg, rgba(255,255,255,0.72), rgba(255,255,255,0.38));
  border:1px solid rgba(255,255,255,0.6);
  backdrop-filter:blur(28px) saturate(1.35);-webkit-backdrop-filter:blur(28px) saturate(1.35);
  border-radius:24px;padding:16px;
  box-shadow:0 20px 50px rgba(40,60,100,0.2), inset 0 1px 0 rgba(255,255,255,0.7);
}
.modal h3{font-size:15px;font-weight:600;margin-bottom:12px}
.modal-section{margin-bottom:14px}
.modal-section .label{font-size:13px;color:var(--text);margin-bottom:8px;font-weight:700;letter-spacing:.04em}
.chip-wrap{display:flex;flex-wrap:wrap;gap:8px}
.chip{
  font-size:12px;padding:7px 12px;border-radius:999px;
  background:rgba(255,255,255,0.7);border:1px solid var(--glass-border);
  color:var(--text);cursor:pointer;
}
.chip.on{
  background:rgba(120,130,145,0.22);
  border-color:rgba(120,130,145,0.35);
  font-weight:600;
}
.modal-actions{display:flex;gap:8px;margin-top:8px}
.modal-actions button{flex:1;padding:11px;border-radius:12px;font-weight:600;font-size:13px}
.modal-actions .cancel{background:rgba(255,255,255,0.7);border:1px solid var(--glass-border);color:var(--muted)}
.modal-actions .ok{background:rgba(255,255,255,0.9);border:1px solid var(--glass-border);color:var(--text)}
.setting-row{margin-bottom:12px}
.setting-row label{display:block;font-size:12px;color:var(--muted);margin-bottom:6px}
.setting-row input[type="color"]{
  width:100%;height:40px;border:1px solid var(--glass-border);
  border-radius:10px;background:transparent;padding:2px;
}
.setting-actions{display:flex;flex-direction:column;gap:8px;margin-top:8px}
.setting-actions button{
  width:100%;padding:11px;border-radius:12px;font-weight:600;font-size:13px;
  background:var(--btn);border:1px solid var(--glass-border);color:var(--btn-text);
}
.lightbox{
  display:none;position:fixed;inset:0;z-index:50;
  background:rgba(12,14,20,0.78);
  backdrop-filter:blur(18px) saturate(1.2);
  -webkit-backdrop-filter:blur(18px) saturate(1.2);
  align-items:center;justify-content:center;padding:20px;
  touch-action:none;
  -webkit-user-select:none;user-select:none;
}
.lightbox.show{display:flex}
.lightbox .lb-stage{
  position:relative;
  max-width:min(100%,520px);
  max-height:86vh;
  width:100%;
  display:flex;align-items:center;justify-content:center;
}
.lightbox img{
  max-width:100%;max-height:86vh;
  border-radius:18px;

/* ============================================================
   iOS 26 Liquid Glass 精修层
   更透明 / 更饱和 / 彩色边缘辉光 / 全屏安全区
   ============================================================ */
:root{
  --liquid-edge:inset 0 1px 0 rgba(255,255,255,.9), inset 1px 0 0 rgba(255,255,255,.3), inset 0 -1px 0 rgba(255,255,255,.18), inset -1px 0 0 rgba(255,255,255,.16);
}
/* 背景：半透明白色（无彩色环境光） */
html,body{
  background:
    radial-gradient(120% 85% at 50% -8%, rgba(255,255,255,.95) 0%, rgba(255,255,255,0) 62%),
    radial-gradient(100% 70% at 8% 108%, rgba(255,255,255,.7) 0%, rgba(255,255,255,0) 60%),
    linear-gradient(180deg, rgba(252,253,255,.96) 0%, rgba(244,246,250,.94) 55%, rgba(238,241,246,.92) 100%);
}
/* 主玻璃：白色半透明 */
.glass{
  background:linear-gradient(180deg, rgba(255,255,255,.38) 0%, rgba(255,255,255,.14) 100%);
  border:1px solid rgba(255,255,255,.55);
  backdrop-filter:blur(38px) saturate(2.2);
  -webkit-backdrop-filter:blur(38px) saturate(2.2);
  box-shadow:0 24px 60px -36px rgba(90,105,135,.35), var(--liquid-edge);
}
/* 顶栏：白色半透明玻璃 */
.topbar{
  background:linear-gradient(180deg, rgba(255,255,255,.42), rgba(255,255,255,.16));
  border-bottom:1px solid rgba(255,255,255,.5);
  backdrop-filter:blur(36px) saturate(2.2);
  -webkit-backdrop-filter:blur(36px) saturate(2.2);
}
/* 统一玻璃组件：白色半透明、中性阴影 */
:where(.form-card,.record-item,.stat-chip,.card-price-row,.total-bar,.detail-meta,.detail-info,.toast-card,.loading-box,.move-tip-bar,.folder-action-chip,.back-btn,.icon-btn,.chip,.type-chip,.cover-change-btn,.multi-bar button,.modal-actions button,.setting-actions button,.amount-filter-btn,.lb-close,.lb-actions button,.edit-btn,.save-btn,.del-btn,.primary-btn,.tool-btn,.import-btn){
  background:
    radial-gradient(130% 110% at 12% 0%, rgba(255,255,255,.5) 0%, rgba(255,255,255,0) 55%),
    linear-gradient(145deg, rgba(255,255,255,.42) 0%, rgba(255,255,255,.18) 48%, rgba(255,255,255,.3) 100%);
  border:1px solid rgba(255,255,255,.55);
  box-shadow:
    0 20px 44px -32px rgba(90,105,135,.35),
    0 2px 10px rgba(80,95,120,.04),
    inset 0 1px 0 rgba(255,255,255,.9),
    inset 1px 0 0 rgba(255,255,255,.34),
    inset 0 -1px 0 rgba(255,255,255,.22),
    inset -1px 0 0 rgba(255,255,255,.2);
  backdrop-filter:blur(44px) saturate(2.4);
  -webkit-backdrop-filter:blur(44px) saturate(2.4);
}
/* 色卡卡片：白色半透明 */
.folder-card{
  background:rgba(255,255,255,.36);
  border:1px solid rgba(255,255,255,.55);
  box-shadow:
    0 24px 48px -34px rgba(90,105,135,.4),
    0 2px 10px rgba(80,95,120,.04),
    inset 0 1px 0 rgba(255,255,255,.92),
    inset 1px 0 0 rgba(255,255,255,.34),
    inset 0 -1px 0 rgba(255,255,255,.22),
    inset 0 -18px 28px -26px rgba(120,140,170,.3);
  backdrop-filter:blur(34px) saturate(2.3);
  -webkit-backdrop-filter:blur(34px) saturate(2.3);
}
/* 卡片文字标签：保持可读的浅玻璃 */
.folder-name-tag{

/* 弹窗：白色半透明玻璃 */
.modal{
  background:
    radial-gradient(130% 100% at 12% 0%, rgba(255,255,255,.55) 0%, rgba(255,255,255,0) 55%),
    linear-gradient(180deg, rgba(255,255,255,.42), rgba(255,255,255,.2));

  box-shadow:0 -28px 80px -36px rgba(70,85,115,.4), inset 0 1px 0 rgba(255,255,255,.92), inset 0 -1px 0 rgba(255,255,255,.24);

.toast-card,.loading-box{

  -webkit-backdrop-filter:blur(60px) saturate(2.4);

/* 输入框：白色半透明 */
.name-screen input,.form-row input{

@media (max-width:500px){
  .glass,.folder-card,.tool-btn,.import-btn,.record-item,.form-card,.modal,.stat-chip,.move-tip-bar{

      linear-gradient(180deg, rgba(255,255,255,.42), rgba(255,255,255,.16));
  }
}

<script>
const DB_NAME = "privateRecordDB_v5";
const DB_VERSION = 2;
const STORE_FOLDERS = "folders";
const STORE_RECORDS = "records";
const STORE_PROFILE = "profile";
let db = null;
let currentName = "";
let pendingImages = [];
let multiSelect = false;
let selectedRecordIds = new Set();
let moveMode = false;
let movePickStep = 0;
let moveSrcId = null;
let moveDstId = null;
let batchEditMode = false;
let filterState = { cards: new Set(), meets: new Set(), helpers: new Set(), statuses: new Set() };
let appMode = "private";
let amountFilterMode = "all";
let pendingMeetType = "";
let coverPickMode = false;

function isThreshold() { return appMode === "threshold"; }

function modeLabels() {
  if (isThreshold()) {
    return {
      titleSuffix: "の门槛记录",
      screenTitle: "门槛记录",
      importBtn: "入会记录",
      importPageTitle: "入会记录",
      cardNameLabel: "会名",
      meetLabel: "类别",
      helperLabel: "备注",
      helperPlaceholder: "",
      importHint: "支持一次选多张图片，全部归入同一会名文件夹；封面固定为首张。类别请点选。",
      statusSold: "已完结",
      statusPending: "待退款",
      statusRefunded: "已退款",
      statusNone: "在更",
      moveTip: "移动模式：长按拖拽卡片调整顺序，完成后再点「取消移动」退出",
      emptyFolders: "暂无入会记录<br>点击「入会记录」开始",
      switchModeText: "切换为私调模式",
      stats: "threshold",
      folderMode: "threshold"
    };
  }
  return {
    titleSuffix: "の私调记录",
    screenTitle: "私调记录",
    importBtn: "导入私调",
    importPageTitle: "导入私调",
    cardNameLabel: "色卡名",
    meetLabel: "会名",
    helperLabel: "助手",
    helperPlaceholder: "",
    importHint: "支持一次选多张图片，全部归入同个色卡文件夹；封面固定为首张图片。",
    statusSold: "已出",
    statusPending: "待出",
    statusRefunded: "",
    statusNone: "未出",
    moveTip: "移动模式：长按拖拽色卡卡片调整顺序，完成后再点「取消移动」退出",
    emptyFolders: "暂无色卡<br>点击「导入私调」开始",
    switchModeText: "切换门槛状态",
    stats: "private",
    folderMode: "private"
  };
}

function applyModeUI() {
  const L = modeLabels();
  const btnImport = document.getElementById("btnImport");
  if (btnImport) btnImport.textContent = L.importBtn;
  const ipt = document.getElementById("importPageTitle");
  if (ipt) ipt.textContent = L.importPageTitle;
  const lcn = document.getElementById("labelCardName");
  if (lcn) lcn.textContent = L.cardNameLabel;
  const lmn = document.getElementById("labelMeetName");
  if (lmn) lmn.textContent = L.meetLabel;
  const lh = document.getElementById("labelHelper");
  if (lh) lh.textContent = L.helperLabel;
  const fh = document.getElementById("fHelper");
  if (fh) fh.placeholder = L.helperPlaceholder;
  const hint = document.getElementById("importHint");
  if (hint) hint.textContent = L.importHint;
  const actSold = document.getElementById("actSold");
  if (actSold) actSold.textContent = L.statusSold;
  const actPending = document.getElementById("actPending");
  if (actPending) actPending.textContent = L.statusPending;
  const actRefunded = document.getElementById("actRefunded");
  if (actRefunded) {
    actRefunded.style.display = isThreshold() ? "" : "none";
    actRefunded.textContent = L.statusRefunded || "已退款";
  }
  const rowMeet = document.getElementById("rowMeetName");
  const rowType = document.getElementById("rowMeetType");
  const rowHP = document.getElementById("rowHelperPrivate");
  const importImage = document.getElementById("importImage");
  if (importImage) importImage.setAttribute("multiple", "");
  if (isThreshold()) {
    if (rowMeet) rowMeet.style.display = "none";
    if (rowType) rowType.style.display = "";
    if (rowHP) rowHP.style.display = "";
  } else {
    if (rowMeet) rowMeet.style.display = "";
    if (rowType) rowType.style.display = "none";
    if (rowHP) rowHP.style.display = "";
  }
  const btnSw = document.getElementById("btnSwitchMode");
  if (btnSw) btnSw.textContent = L.switchModeText;
  if (currentName) {
    mainTitle.textContent = isThreshold() ? (currentName + "の门槛记录") : (currentName + L.titleSuffix);
    const st = document.getElementById("screenTitle");
    if (st && nameInput && nameInput.style.display === "none") {
      st.textContent = isThreshold() ? "门槛记录" : (currentName + L.titleSuffix);
    }
  } else {
    const st = document.getElementById("screenTitle");
    if (st) st.textContent = isThreshold() ? "门槛记录" : L.screenTitle;
  }
  document.title = isThreshold() ? "门槛记录" : "私调记录";
  const btnMove = document.getElementById("btnMove");
  if (btnMove) {
    btnMove.textContent = movePickStep > 0 ? "取消移动" : "移动";
    btnMove.classList.toggle("on-move", movePickStep > 0);
  }
  const af = document.getElementById("btnAmountFilter");
  if (af) {
    af.style.display = isThreshold() ? "" : "none";
    af.textContent = amountFilterMode === "yearForever" ? "年永" : "全部";
  }
  const lab = document.getElementById("totalAllLabel");
  if (lab) lab.textContent = (isThreshold() && amountFilterMode === "yearForever") ? "年永金额" : "总金额";
  recalcTotalAll();
}

function statusOptionsForMode() {
  const L = modeLabels();
  if (isThreshold()) {
    return [
      { key: "在更", match: s => !s || (s !== "已完结" && s !== "待退款" && s !== "已退款") },
      { key: "已完结", match: s => s === "已完结" || s === "已出" },
      { key: "待退款", match: s => s === "待退款" || s === "待出" },
      { key: "已退款", match: s => s === "已退款" }
    ];
  }
  return [
    { key: "未出", match: s => !s || (s !== "已出" && s !== "待出" && s !== "已完结" && s !== "待退款" && s !== "已退款") },
    { key: "已出", match: s => s === "已出" || s === "已完结" },
    { key: "待出", match: s => s === "待出" || s === "待退款" }
  ];
}

    card.classList.add("toast-only");

    const done = () => {

  });
}

function openDB() {
  return new Promise((resolve, reject) => {
    if (db) return resolve(db);
    const req = indexedDB.open(DB_NAME, DB_VERSION);
    req.onupgradeneeded = e => {
      const d = e.target.result;
      const tx = e.target.transaction;
      if (!d.objectStoreNames.contains(STORE_FOLDERS)) {
        const fs = d.createObjectStore(STORE_FOLDERS, { keyPath: "id", autoIncrement: true });
        fs.createIndex("cardName", "cardName", { unique: false });
      } else if (e.oldVersion < 2) {
        try {
          const fs = tx.objectStore(STORE_FOLDERS);
          if (fs.indexNames.contains("cardName")) fs.deleteIndex("cardName");
          fs.createIndex("cardName", "cardName", { unique: false });
        } catch (err) { console.warn(err); }
      }
      if (!d.objectStoreNames.contains(STORE_RECORDS)) {
        const rs = d.createObjectStore(STORE_RECORDS, { keyPath: "id", autoIncrement: true });
        rs.createIndex("folderId", "folderId", { unique: false });
      }
      if (!d.objectStoreNames.contains(STORE_PROFILE)) {
        d.createObjectStore(STORE_PROFILE, { keyPath: "key" });
      }
    };
    req.onsuccess = e => { db = e.target.result; resolve(db); };
    req.onerror = () => reject(req.error || new Error("DB open fail"));
  });
}

function idbReq(request) {
  return new Promise((resolve, reject) => {
    request.onsuccess = () => resolve(request.result);
    request.onerror = () => reject(request.error);
  });
}

function txDone(tx) {
  return new Promise((resolve, reject) => {
    tx.oncomplete = () => resolve();
    tx.onerror = () => reject(tx.error);
    tx.onabort = () => reject(tx.error || new Error("aborted"));
  });
}

function compressImage(file, maxSize, quality) {
  maxSize = maxSize || 1200;
  quality = quality || 0.82;
  return new Promise((resolve, reject) => {
    const reader = new FileReader();
    reader.onload = () => {
      const img = new Image();
      img.onload = () => {
        let w = img.width, h = img.height;
        if (w > maxSize || h > maxSize) {
          const ratio = Math.min(maxSize / w, maxSize / h);
          w = Math.round(w * ratio);
          h = Math.round(h * ratio);
        }
        const canvas = document.createElement("canvas");
        canvas.width = w; canvas.height = h;
        const ctx = canvas.getContext("2d");
        ctx.drawImage(img, 0, 0, w, h);
        resolve(canvas.toDataURL("image/jpeg", quality));
      };
      img.onerror = reject;
      img.src = reader.result;
    };
    reader.onerror = reject;
    reader.readAsDataURL(file);
  });
}

function makeThumb(dataUrl, maxSize) {
  maxSize = maxSize || 120;
  return new Promise((resolve, reject) => {
    const img = new Image();
    img.onload = () => {
      let w = img.width, h = img.height;
      const ratio = Math.min(maxSize / w, maxSize / h, 1);
      w = Math.round(w * ratio); h = Math.round(h * ratio);
      const canvas = document.createElement("canvas");
      canvas.width = w; canvas.height = h;
      const ctx = canvas.getContext("2d");
      ctx.drawImage(img, 0, 0, w, h);
      resolve(canvas.toDataURL("image/jpeg", 0.5));
    };
    img.onerror = reject;
    img.src = dataUrl;
  });
}

async function saveImageToDevice(dataUrl, filename) {
  filename = filename || "私调图.png";
  const res = await fetch(dataUrl);
  const blob = await res.blob();
  if (navigator.canShare) {
    try {
      const file = new File([blob], filename, { type: blob.type || "image/png" });
      if (navigator.canShare({ files: [file] })) {
        await navigator.share({ files: [file], title: filename });
        return;
      }
    } catch (e) {
      if (e && e.name === "AbortError") return;
    }
  }
  const url = URL.createObjectURL(blob);
  const a = document.createElement("a");
  a.href = url;
  a.download = filename;
  a.rel = "noopener";
  document.body.appendChild(a);
  a.click();
  a.remove();
  setTimeout(() => URL.revokeObjectURL(url), 2000);
}

const _lazyIO = ("IntersectionObserver" in window)
  ? new IntersectionObserver((entries) => {
      for (const en of entries) {
        if (!en.isIntersecting) continue;
        const img = en.target;
        const src = img.getAttribute("data-src");
        if (src) {
          img.src = src;
          img.removeAttribute("data-src");
        }
        _lazyIO.unobserve(img);
      }
    }, { root: null, rootMargin: "120px 0px", threshold: 0.01 })
  : null;

function lazyImg(src, className, attrs) {
  if (!src) return '<div class="' + (className || "") + '"></div>';
  const extra = attrs || "";
  if (!_lazyIO) {
    return '<img class="' + className + '" loading="lazy" decoding="async" src="' + src + '" ' + extra + '>';
  }
  return '<img class="' + className + ' lazy-pending" loading="lazy" decoding="async" data-src="' + src + '" src="data:image/gif;base64,R0lGODlhAQABAIAAAAAAAP///yH5BAEAAAAALAAAAAABAAEAAAIBRAA7" ' + extra + '>';
}

function observeLazy(root) {
  if (!_lazyIO || !root) return;
  root.querySelectorAll("img[data-src]").forEach(img => {
    try { _lazyIO.observe(img); } catch (e) {}
  });
}

function escapeHtml(s) {
  return String(s || "")
    .replace(/&/g, "&amp;").replace(/</g, "&lt;")
    .replace(/>/g, "&gt;").replace(/"/g, "&quot;");
}

function parsePrice(v) {
  const n = parseFloat(String(v || "").replace(/[^\d.]/g, ""));
  if (isNaN(n)) return 0;
  return Math.round(n * 100) / 100;
}

function limitPriceInput(inputEl) {
  if (!inputEl) return;
  inputEl.addEventListener("input", () => {
    let val = inputEl.value.replace(/[^\d.]/g, "");
    const dotIdx = val.indexOf(".");
    if (dotIdx >= 0) {
      val = val.slice(0, dotIdx + 1) + val.slice(dotIdx + 1).replace(/\./g, "").slice(0, 2);
    }
    inputEl.value = val;
  });
  inputEl.addEventListener("blur", () => {
    const n = parsePrice(inputEl.value);
    inputEl.value = n > 0 ? String(n) : "";
  });
}

async function saveProfile(data) {
  const database = await openDB();
  const tx = database.transaction(STORE_PROFILE, "readwrite");
  const prev = (await idbReq(tx.objectStore(STORE_PROFILE).get("user"))) || {};
  tx.objectStore(STORE_PROFILE).put({ key: "user", ...prev, ...data });
  await txDone(tx);
}

}

async function getAllFolders(opts) {
  opts = opts || {};
  const database = await openDB();
  const tx = database.transaction(STORE_FOLDERS, "readonly");
  let all = (await idbReq(tx.objectStore(STORE_FOLDERS).getAll())) || [];
  if (!opts.allModes) {
    const want = opts.mode || (isThreshold() ? "threshold" : "private");
    all = all.filter(f => {
      const m = f.mode || "private";
      return m === want;
    });
  }
  return all.sort((a, b) => {
    const oa = a.sortOrder != null ? a.sortOrder : (a.createdAt || a.id || 0);
    const ob = b.sortOrder != null ? b.sortOrder : (b.createdAt || b.id || 0);
    return oa - ob;
  });
}

async function getAllFoldersRaw() {
  return getAllFolders({ allModes: true });
}

async function getFolderByCardName(cardName) {
  const folders = await getAllFolders();
  return folders.find(f => f.cardName === cardName) || null;
}

async function addFolder(folder) {
  const database = await openDB();
  if (!folder.mode) folder.mode = isThreshold() ? "threshold" : "private";
  if (folder.sortOrder == null) {
    const existing = await getAllFolders();
    const maxOrder = existing.reduce((m, f) => Math.max(m, f.sortOrder != null ? f.sortOrder : 0), 0);
    folder.sortOrder = maxOrder + 1;
  }
  const tx = database.transaction(STORE_FOLDERS, "readwrite");
  const id = await idbReq(tx.objectStore(STORE_FOLDERS).add(folder));
  await txDone(tx);
  return id;
}

async function moveFolder(folderId, direction) {
  const folders = await getAllFolders();
  const idx = folders.findIndex(f => f.id === folderId);
  if (idx < 0) return false;
  const newIdx = idx + direction;
  if (newIdx < 0 || newIdx >= folders.length) return false;
  const arr = folders.slice();
  const tmp = arr[idx];
  arr[idx] = arr[newIdx];
  arr[newIdx] = tmp;
  const database = await openDB();
  const tx = database.transaction(STORE_FOLDERS, "readwrite");
  const store = tx.objectStore(STORE_FOLDERS);
  for (let i = 0; i < arr.length; i++) {
    const f = arr[i];
    f.sortOrder = i;
    f.updatedAt = Date.now();
    store.put(f);
  }
  await txDone(tx);
  return true;
}

async function touchFolder(id) {
  const database = await openDB();
  const tx = database.transaction(STORE_FOLDERS, "readwrite");
  const store = tx.objectStore(STORE_FOLDERS);
  const f = await idbReq(store.get(id));
  if (f) { f.updatedAt = Date.now(); store.put(f); }
  await txDone(tx);
}

function applyTheme(theme) {
  theme = theme || {};
  const bg1 = theme.bg1 || "#f0f1f3";
  const bg2 = theme.bg2 || "#e4e6ea";
  const text = theme.text || "#3a3f47";
  const btn = theme.btn || "#ffffff";
  const btnText = theme.btnText || "#4a5160";
  const useGradient = theme.gradient !== false;
  const subtitle = theme.subtitle || "本机保存 · 可备份";
  document.documentElement.style.setProperty("--bg1", bg1);
  document.documentElement.style.setProperty("--bg2", bg2);
  document.documentElement.style.setProperty("--text", text);
  document.documentElement.style.setProperty("--btn", btn.length === 7 ? hexToRgba(btn, 0.78) : btn);
  document.documentElement.style.setProperty("--btn-text", btnText);
  if (useGradient) {
    document.body.style.background =
      "radial-gradient(120% 85% at 50% -8%, rgba(255,255,255,.95) 0%, transparent 62%)," +
      "radial-gradient(100% 70% at 8% 108%, rgba(255,255,255,.7) 0%, transparent 60%)," +
      "linear-gradient(180deg, " + bg1 + " 0%, " + bg2 + " 55%, " + bg2 + " 100%)";
  } else {
    document.body.style.background = bg1;
  }
  const el = id => document.getElementById(id);
  if (el("colorBg1")) el("colorBg1").value = bg1;
  if (el("colorBg2")) el("colorBg2").value = bg2;
  if (el("colorText")) el("colorText").value = text;
  if (el("colorBtn")) el("colorBtn").value = (btn && btn[0] === "#") ? btn : "#ffffff";
  if (el("colorBtnText")) el("colorBtnText").value = btnText;
  if (el("colorGradient")) el("colorGradient").checked = useGradient;
  if (el("colorBg1Hex")) el("colorBg1Hex").value = bg1;
  if (el("colorBg2Hex")) el("colorBg2Hex").value = bg2;
  if (el("colorTextHex")) el("colorTextHex").value = text;
  if (el("colorBtnHex")) el("colorBtnHex").value = (btn && btn[0] === "#") ? btn : "#ffffff";
  if (el("colorBtnTextHex")) el("colorBtnTextHex").value = btnText;
  if (el("subtitleInput")) el("subtitleInput").value = subtitle;
  const subEl = document.querySelector(".subtitle");
  if (subEl) subEl.textContent = subtitle;
}

function hexToRgba(hex, a) {
  const h = String(hex || "#ffffff").replace("#", "");
  if (h.length !== 6) return "rgba(255,255,255," + a + ")";
  const r = parseInt(h.slice(0,2), 16);
  const g = parseInt(h.slice(2,4), 16);
  const b = parseInt(h.slice(4,6), 16);
  return "rgba(" + r + "," + g + "," + b + "," + a + ")";
}

async function updateStatsBar(foldersOpt) {
  const el = document.getElementById("statsBar");
  if (!el) return;
  try {
    const folders = foldersOpt || await getAllFolders();
    if (isThreshold()) {
      const total = folders.length;
      const done = folders.filter(f => f.status === "已完结" || f.status === "已出").length;
      const refund = folders.filter(f => f.status === "待退款" || f.status === "已退款" || f.status === "待出").length;
      el.innerHTML =
        '<div class="stat-chip"><div class="sv">' + total + '</div><div class="sl">入会总数</div></div>' +
        '<div class="stat-chip"><div class="sv red">' + refund + '</div><div class="sl">退款数</div></div>' +
        '<div class="stat-chip"><div class="sv yellow">' + done + '</div><div class="sl">完结数</div></div>';
    } else {
      const idSet = new Set(folders.map(f => f.id));
      const records = await getAllRecords();
      const cnt = records.filter(r => idSet.has(r.folderId)).length;
      const sold = folders.filter(f => f.status === "已出" || f.status === "已完结").length;
      const pending = folders.filter(f => f.status === "待出" || f.status === "待退款").length;
      el.innerHTML =
        '<div class="stat-chip"><div class="sv">' + folders.length + '</div><div class="sl">色卡数</div></div>' +
        '<div class="stat-chip"><div class="sv">' + cnt + '</div><div class="sl">私调图片</div></div>' +
        '<div class="stat-chip"><div class="sv red">' + sold + '</div><div class="sl">已出数</div></div>' +
        '<div class="stat-chip"><div class="sv yellow">' + pending + '</div><div class="sl">待出数</div></div>';
    }
  } catch (e) {
    el.innerHTML = "";
  }
}

let _renderLock = false;
let _renderQueued = false;

async function renderFolders() {
  if (_renderLock) { _renderQueued = true; return; }
  _renderLock = true;
  try {
  let folders = [];
  try { folders = await getAllFolders(); } catch (e) { console.error(e); }
  const hasMeet = filterState.meets.size > 0;
  const hasHelper = !isThreshold() && filterState.helpers.size > 0;
  const hasStatus = filterState.statuses && filterState.statuses.size > 0;
  const filtering = hasMeet || hasHelper;

  if (hasStatus) {
    const opts = statusOptionsForMode();
    folders = folders.filter(f => {
      const st = f.status || "";
      for (const key of filterState.statuses) {
        const opt = opts.find(o => o.key === key);
        if (opt && opt.match(st)) return true;
      }
      return false;
    });
  }

  folderGrid.innerHTML = "";
  updateStatsBar();

  if (filtering) {
    const records = await getAllRecords();
    const folderMap = {};
    folders.forEach(f => folderMap[f.id] = f);
    const matched = records.filter(r => {
      const f = folderMap[r.folderId] || {};
      const m = r.meetName != null ? r.meetName : (f.meetName || "");
      const h = r.helper != null ? r.helper : (f.helper || "");
      const okMeet = !hasMeet || filterState.meets.has(m);
      const okHelper = !hasHelper || filterState.helpers.has(h);
      return okMeet && okHelper;
    });
    if (!matched.length) {
      folderGrid.innerHTML = '<div class="empty-tip">暂无匹配的私调条目<br>点「重置」查看全部</div>';
      recalcTotalAll();
      return;
    }
    folderGrid.classList.remove("folder-grid");
    const list = document.createElement("div");
    list.className = "record-list";
    matched.forEach(r => {
      const f = folderMap[r.folderId] || {};
      const meet = r.meetName != null ? r.meetName : (f.meetName || "—");
      const helper = r.helper != null ? r.helper : (f.helper || "—");
      const row = document.createElement("div");
      row.className = "record-item";
      row.dataset.id = r.id;
      row.innerHTML =
        (r.imgBase64 ? lazyImg(r.thumbBase64 || r.imgBase64, "record-thumb", 'data-id="' + r.id + '"') : '<div class="record-thumb"></div>') +
        '<div class="record-body">' +
          '<div class="n">' + (r.price ? '¥' + escapeHtml(String(r.price)) : '私调图') + '</div>' +

        e.stopPropagation();

      };
    });
    list.querySelectorAll(".save-btn").forEach(btn => {
      btn.onclick = async (e) => {
        e.stopPropagation();
        const id = Number(btn.getAttribute("data-id"));
        const database = await openDB();
        const tx = database.transaction(STORE_RECORDS, "readonly");
        const rec = await idbReq(tx.objectStore(STORE_RECORDS).get(id));
        if (!rec || !rec.imgBase64) { await appAlert("没有可保存的图片"); return; }
        try { await saveImageToDevice(rec.imgBase64, (rec.note || "私调图") + ".png"); }

      };
    });
    list.querySelectorAll(".del-btn").forEach(btn => {
      btn.onclick = async (e) => {
        e.stopPropagation();
        if (!await appConfirm("删除这张私调图？")) return;
        await delRecord(Number(btn.getAttribute("data-id")));
        renderFolders();
      };
    });
    recalcTotalAll();
    return;
  }

  folderGrid.classList.add("folder-grid");
  folderGrid.classList.remove("moving");
  if (!folders.length) {
    folderGrid.innerHTML = '<div class="empty-tip">' + modeLabels().emptyFolders + '</div>';
    recalcTotalAll();
    return;
  }
  const picking = movePickStep > 0;
  folders.forEach(f => {
    const card = document.createElement("div");
    card.className = "folder-card";
    card.dataset.folderId = f.id;
    if (picking) card.classList.add("move-pick");
    if (moveSrcId === f.id) card.classList.add("move-src");
    if (moveDstId === f.id) card.classList.add("move-dst");
    const cover = f.coverBase64
      ? lazyImg(f.coverBase64, "folder-cover", 'alt=""')
      : '<div class="folder-cover-empty"><svg viewBox="0 0 24 24" width="26" height="26" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3 8.5A2.5 2.5 0 0 1 5.5 6h2L9 4h6l1.5 2h2A2.5 2.5 0 0 1 21 8.5v8A2.5 2.5 0 0 1 18.5 19h-13A2.5 2.5 0 0 1 3 16.5z"/></svg></div>';
    let statusHtml = "";
    const marked = ["已出","待出","已完结","待退款","已退款"];
    if (f.status && marked.indexOf(f.status) >= 0) {
      statusHtml = '<div class="folder-status-tag" data-folder="' + f.id + '" data-status="' + escapeHtml(f.status) + '">' + escapeHtml(f.status) + '</div>';
    }
    card.innerHTML = cover + statusHtml +
      '<button type="button" class="folder-edit-btn" data-folder="' + f.id + '" title="编辑">⋯</button>' +
      '<div class="folder-name-tag">' + escapeHtml(f.cardName) + '</div>';
    if (!picking) {
      card.onclick = () => openFolder(f.id);
    } else {
      card.onclick = async (e) => {
        e.stopPropagation();
        if (movePickStep === 1) {
          moveSrcId = f.id;
          moveDstId = null;
          movePickStep = 2;
          setMoveUI();
          folderGrid.querySelectorAll(".folder-card").forEach(c => {
            const id = Number(c.dataset.folderId);
            c.classList.toggle("move-src", id === moveSrcId);
            c.classList.remove("move-dst");
          });
        } else if (movePickStep === 2) {
          if (f.id === moveSrcId) {
            await appAlert("请选择与源卡片不同的目标位置");
            return;
          }
          moveDstId = f.id;
          setMoveUI();
          folderGrid.querySelectorAll(".folder-card").forEach(c => {
            c.classList.toggle("move-dst", Number(c.dataset.folderId) === moveDstId);
            c.classList.toggle("move-src", Number(c.dataset.folderId) === moveSrcId);
          });
        }
      };
    }
    card.querySelector(".folder-edit-btn").onclick = async (e) => {
      e.stopPropagation();
      if (!picking) openFolderActionModal(f.id);
    };
    card.querySelectorAll(".folder-status-tag").forEach(tag => {
      tag.onclick = async (e) => {
        e.stopPropagation();
        const st = tag.getAttribute("data-status");
        if (!picking) openStatusCancelModal(f.id, st);
      };
    });
    folderGrid.appendChild(card);
  });
  setMoveUI();
  recalcTotalAll();
  observeLazy(folderGrid);
  } finally {
    _renderLock = false;
    if (_renderQueued) { _renderQueued = false; requestAnimationFrame(() => renderFolders()); }
  }
}

function openFolderMeetFilter(folderId, allMeets) {
  const modal = document.getElementById("folderMeetModal");
  const wrap = document.getElementById("folderMeetChips");
  if (!modal || !wrap) return;
  const set = window._folderMeetFilter || new Set();
  wrap.innerHTML = "";
  if (!allMeets.length) {
    wrap.innerHTML = '<span style="font-size:12px;color:#8b919a">暂无可筛选会名</span>';
  } else {
    allMeets.forEach(v => {
      const chip = document.createElement("button");
      chip.type = "button";
      chip.className = "chip" + (set.has(v) ? " on" : "");
      chip.textContent = v;
      chip.onclick = async () => {
        if (set.has(v)) set.delete(v); else set.add(v);
        chip.classList.toggle("on");
      };
      wrap.appendChild(chip);
    });
  }
  window._folderMeetFilter = set;
  modal.classList.add("show");
  document.getElementById("folderMeetApply").onclick = async () => {
    modal.classList.remove("show");
    openFolder(folderId, window._folderMeetFilter);
  };
  document.getElementById("folderMeetReset").onclick = async () => {
    window._folderMeetFilter = new Set();
    modal.classList.remove("show");
    openFolder(folderId, new Set());
  };
}

async function setFolderStatus(folderId, status) {
  const database = await openDB();
  const tx = database.transaction(STORE_FOLDERS, "readwrite");
  const store = tx.objectStore(STORE_FOLDERS);
  const f = await idbReq(store.get(folderId));
  if (!f) return;
  f.status = status;
  f.updatedAt = Date.now();
  store.put(f);
  await txDone(tx);
  await renderFolders();
}

async function deleteFolder(folderId) {
  const database = await openDB();
  const tx = database.transaction([STORE_FOLDERS, STORE_RECORDS], "readwrite");
  tx.objectStore(STORE_FOLDERS).delete(folderId);
  const idx = tx.objectStore(STORE_RECORDS).index("folderId");
  const req = idx.openCursor(IDBKeyRange.only(folderId));
  req.onsuccess = (e) => {
    const cur = e.target.result;
    if (cur) { cur.delete(); cur.continue(); }
  };
  await txDone(tx);
  await renderFolders();
  showPage(pageFolders);
}

async function recalcTotalAll() {
  try {
    const folders = await getAllFolders();
    const idSet = new Set(folders.map(f => f.id));
    const records = (await getAllRecords()).filter(r => idSet.has(r.folderId));
    let useFolders = folders;
    let useRecords = records;
    if (isThreshold() && amountFilterMode === "yearForever") {
      useFolders = folders.filter(f => f.meetName === "年会" || f.meetName === "永会");
      const yfIds = new Set(useFolders.map(f => f.id));
      useRecords = records.filter(r => yfIds.has(r.folderId));
    }
    let total;
    if (isThreshold()) {
      total = useFolders.reduce((s, f) => {
        const p = parsePrice(f.price);
        if (p) return s + p;
        const sub = useRecords.filter(r => r.folderId === f.id).reduce((a, r) => a + parsePrice(r.price), 0);
        return s + sub;
      }, 0);
    } else {
      const rSum = useRecords.reduce((s, r) => s + parsePrice(r.price), 0);
      const fSum = useFolders.reduce((s, f) => s + parsePrice(f.cardPrice), 0);
      total = rSum + fSum;
    }
    total = Math.round(total * 100) / 100;
    const el = document.getElementById("totalAllAmount");
    const lab = document.getElementById("totalAllLabel");
    if (el) el.textContent = "¥" + total;
    if (lab) {
      if (isThreshold() && amountFilterMode === "yearForever") lab.textContent = "年永金额";
      else lab.textContent = "总金额";
    }
    const af = document.getElementById("btnAmountFilter");
    if (af) {
      af.style.display = isThreshold() ? "" : "none";
      af.textContent = amountFilterMode === "yearForever" ? "年永" : "全部";
    }
  } catch (e) { console.error(e); }
}

async function updateRecord(id, patch) {
  const database = await openDB();
  const tx = database.transaction(STORE_RECORDS, "readwrite");
  const store = tx.objectStore(STORE_RECORDS);
  const rec = await idbReq(store.get(id));
  if (!rec) return;
  Object.assign(rec, patch);
  if (patch.price != null) {
    const p = String(patch.price).trim();
    rec.price = p === "" ? "" : String(parsePrice(p));
  }
  store.put(rec);
  await txDone(tx);
}

async function openFilterModal() {
  const folders = await getAllFolders();
  const records = await getAllRecords();
  const folderMap = {};
  folders.forEach(f => folderMap[f.id] = f);
  const meetSet = new Set();
  const helperSet = new Set();
  records.forEach(r => {
    const f = folderMap[r.folderId] || {};
    const m = r.meetName != null ? r.meetName : (f.meetName || "");
    const h = r.helper != null ? r.helper : (f.helper || "");
    if (m) meetSet.add(m);
    if (h) helperSet.add(h);
  });
  folders.forEach(f => {
    if (f.meetName) meetSet.add(f.meetName);
    if (f.helper) helperSet.add(f.helper);
  });
  const meets = [...meetSet];
  const helpers = [...helperSet];

  function fillChips(el, list, set) {
    el.innerHTML = "";
    if (!list.length) {
      el.innerHTML = '<span style="font-size:12px;color:#8b919a">暂无</span>';
      return;
    }
    list.forEach(v => {
      const chip = document.createElement("button");
      chip.type = "button";
      chip.className = "chip" + (set.has(v) ? " on" : "");
      chip.textContent = v;
      chip.onclick = async () => {
        if (set.has(v)) set.delete(v); else set.add(v);
        chip.classList.toggle("on");
      };
      el.appendChild(chip);
    });
  }

  const chipStatuses = document.getElementById("chipStatuses");
  const statusOpts = statusOptionsForMode();
  if (chipStatuses) {
    chipStatuses.innerHTML = "";
    statusOpts.forEach(opt => {
      const chip = document.createElement("button");
      chip.type = "button";
      chip.className = "chip" + (filterState.statuses.has(opt.key) ? " on" : "");
      chip.textContent = opt.key;
      chip.onclick = async () => {
        if (filterState.statuses.has(opt.key)) filterState.statuses.delete(opt.key);
        else filterState.statuses.add(opt.key);
        chip.classList.toggle("on");
      };
      chipStatuses.appendChild(chip);
    });
  }

  const L = modeLabels();
  const fml = document.getElementById("filterMeetLabel");
  if (fml) fml.textContent = isThreshold() ? "类别" : "会名";
  const helperSection = document.getElementById("filterHelperSection");
  if (helperSection) helperSection.style.display = isThreshold() ? "none" : "";
  const fhl = document.getElementById("filterHelperLabel");
  if (fhl) fhl.textContent = L.helperLabel;

  if (isThreshold()) {
    const fixedTypes = ["永会", "年会", "套会", "免费会"];
    chipMeets.innerHTML = "";
    fixedTypes.forEach(v => {
      const chip = document.createElement("button");
      chip.type = "button";
      chip.className = "chip" + (filterState.meets.has(v) ? " on" : "");
      chip.textContent = v;
      chip.onclick = async () => {
        if (filterState.meets.has(v)) filterState.meets.delete(v);
        else filterState.meets.add(v);
        chip.classList.toggle("on");
      };
      chipMeets.appendChild(chip);
    });
  } else {
    fillChips(chipMeets, meets, filterState.meets);
  }
  if (!isThreshold()) {
    fillChips(chipHelpers, helpers, filterState.helpers);
  } else {
    chipHelpers.innerHTML = "";
  }
  filterModal.classList.add("show");
}

async function applyMovePick() {
  if (moveSrcId == null || moveDstId == null || moveSrcId === moveDstId) {
    await appAlert("请选择两张不同的卡片");
    return;
  }
  const label = isThreshold() ? "入会卡片" : "色卡";
  const ok = await appConfirm("确定互换这两张" + label + "的位置？");
  if (!ok) return;
  showLoading("正在互换位置…", "请稍候");
  try {
    const folders = await getAllFolders();
    const arr = folders.slice();
    const from = arr.findIndex(f => f.id === moveSrcId);
    const to = arr.findIndex(f => f.id === moveDstId);
    if (from < 0 || to < 0) {
      await appAlert("未找到对应卡片");
      return;
    }
    const tmp = arr[from];
    arr[from] = arr[to];
    arr[to] = tmp;
    const database = await openDB();
    const tx = database.transaction(STORE_FOLDERS, "readwrite");
    const store = tx.objectStore(STORE_FOLDERS);
    for (let i = 0; i < arr.length; i++) {
      const f = arr[i];
      f.sortOrder = i;
      f.updatedAt = Date.now();
      store.put(f);
    }
    await txDone(tx);
    exitMovePick();
    await renderFolders();
  } catch (e) {
    console.error(e);
    await appAlert("移动失败，请重试");
  } finally {
    hideLoading();
  }
}

function normalizeHex(v) {
  v = String(v || "").trim();
  if (!v) return null;
  if (v[0] !== "#") v = "#" + v;
  if (/^#[0-9a-fA-F]{6}$/.test(v)) return v.toLowerCase();
  if (/^#[0-9a-fA-F]{3}$/.test(v)) {
    return ("#" + v[1]+v[1]+v[2]+v[2]+v[3]+v[3]).toLowerCase();
  }
  return null;
}

      row.innerHTML =
        '<input type="checkbox" class="export-folder-cb" data-id="' + f.id + '" checked style="width:18px;height:18px;flex-shrink:0;accent-color:#8892a0">' +
        '<span style="flex:1;font-size:13px;font-weight:600;overflow:hidden;text-overflow:ellipsis;white-space:nowrap">' + escapeHtml(f.cardName) + '</span>' +
        '<span style="font-size:11px;color:var(--muted);flex-shrink:0">' + prefix + '</span>';
      list.appendChild(row);
    });
  }
  section("色卡", privateFolders, "色卡");
  section("门槛", thresholdFolders, "门槛");
  const total = privateFolders.length + thresholdFolders.length;
  if (!total) {
    selectAll.checked = false;
    selectAll.disabled = true;
    countEl.textContent = "0 个";
  } else {
    selectAll.disabled = false;
    selectAll.checked = true;
    const updateCount = () => {
      const n = list.querySelectorAll(".export-folder-cb:checked").length;
      countEl.textContent = "已选 " + n + " / " + total;
      selectAll.checked = n === total && total > 0;
    };
    list.querySelectorAll(".export-folder-cb").forEach(cb => { cb.onchange = updateCount; });
    selectAll.onchange = async () => {
      list.querySelectorAll(".export-folder-cb").forEach(cb => { cb.checked = selectAll.checked; });
      updateCount();
    };
    updateCount();
  }
  document.getElementById("exportSelectModal").classList.add("show");
}

async function doExportBackup(selectedIds) {
  const btn = document.getElementById("btnExportJson");
  const originalText = btn.textContent;
  btn.disabled = true;
  await new Promise(r => setTimeout(r, 30));
  showLoading("正在打包备份…", "数据较多时请耐心等待，勿关闭页面");
  try {
    const allFolders = await getAllFoldersRaw();
    const idSet = new Set(selectedIds.map(Number));
    const folders = allFolders.filter(f => idSet.has(f.id));
    const allRecords = await getAllRecordsFull();
    const records = allRecords.filter(r => idSet.has(r.folderId));
    const profile = await loadProfile();
    const totalPics = records.length;
    const totalFolders = folders.length;
    if (totalPics > 60) {
      hideLoading();
      const ok = await appConfirm(
        "本次将导出 " + totalFolders + " 个色卡、" + totalPics + " 张图片。\n\n" +
        "数据量较大，手机上可能仍会因内存不足失败。\n\n" +
        "建议：\n" +
        "1. 少选几个色卡再导出\n" +
        "2. 或在电脑浏览器打开此页面导出\n\n" +
        "是否继续？"
      );
      if (!ok) {
        btn.disabled = false;
        btn.textContent = originalText;
        return;
      }
      showLoading("正在打包备份…", "共 " + totalPics + " 张图片，请耐心等待");
      await new Promise(r => setTimeout(r, 40));
    }
    showLoading("正在生成备份文件…", "共 " + totalFolders + " 个色卡 · " + totalPics + " 张图片");
    const payload = {
      version: 1,
      exportedAt: new Date().toISOString(),
      profile: {
        name: profile.name || currentName,
        theme: profile.theme || null,
        avatar: profile.avatar || "",
        settingsIcon: profile.settingsIcon || ""
      },
      folders: folders,
      records: records
    };
    await new Promise(r => setTimeout(r, 20));
    const jsonStr = JSON.stringify(payload);
    payload.folders = null;
    payload.records = null;
    payload.profile = null;
    const blob = new Blob([jsonStr], { type: "application/json;charset=utf-8" });
    const filename = "私调记录备份_" + (profile.name || currentName || "backup") + ".json";
    hideLoading();
    showLoading("准备保存…", "即将唤起系统分享或下载");
    let shared = false;
    if (navigator.canShare) {
      try {
        const file = new File([blob], filename, { type: "application/json" });
        if (navigator.canShare({ files: [file] })) {
          await navigator.share({ files: [file], title: filename });
          shared = true;
        }
      } catch (e) {
        if (e && e.name === "AbortError") {
          hideLoading();
          btn.disabled = false;
          btn.textContent = originalText;
          return;
        }
      }
    }
    if (!shared) {
      const url = URL.createObjectURL(blob);
      const a = document.createElement("a");
      a.href = url;
      a.download = filename;
      a.style.display = "none";
      document.body.appendChild(a);
      a.click();
      setTimeout(() => {
        a.remove();
        URL.revokeObjectURL(url);
      }, 5000);
      await appAlert("已触发下载。\n如果没有弹出文件，请到浏览器「下载」或系统「文件」App 中查找。");
    }
  } catch (err) {
    console.error(err);
    if (err && err.name === "AbortError") return;
    let tip = "导出失败。";
    const msg = String((err && err.message) || err || "");
    if (/out of memory|内存|allocation|Maximum call stack|QuotaExceeded/i.test(msg)) {
      tip = "内存不足，无法一次导出这么多图片。";
    }
    await appAlert(
      tip + "\n\n建议：\n" +
      "1. 少选几个色卡再导出\n" +
      "2. 用电脑浏览器打开此页面导出\n" +
      "3. 平时分批备份\n\n" +
      (msg ? "错误信息：" + msg.slice(0, 120) : "")
    );
  } finally {
    hideLoading();
    btn.disabled = false;
    btn.textContent = originalText;
  }
}

    hideLoading();
    if (!data || !Array.isArray(data.folders) || !Array.isArray(data.records)) {
      await appAlert("备份文件格式不正确");
      return;
    }
    if (!await appConfirm("导入将覆盖当前全部色卡与记录，确定继续？\n\n色卡：" + data.folders.length + " 个\n图片：" + data.records.length + " 张")) return;
    showLoading("正在导入数据…", "共 " + data.records.length + " 张图片，请勿关闭");
    await clearAllData();
    const database = await openDB();
    const tx = database.transaction([STORE_FOLDERS, STORE_RECORDS], "readwrite");
    const fs = tx.objectStore(STORE_FOLDERS);
    const rs = tx.objectStore(STORE_RECORDS);
    const idMap = {};
    for (const f of data.folders) {
      const oldId = f.id;
      const copy = { ...f };
      delete copy.id;
      const newId = await idbReq(fs.add(copy));
      idMap[oldId] = newId;
    }
    for (const r of data.records) {
      const copy = { ...r };
      delete copy.id;
      if (copy.folderId != null && idMap[copy.folderId] != null) {
        copy.folderId = idMap[copy.folderId];
      }
      await idbReq(rs.add(copy));
    }
    await txDone(tx);
    if (data.profile) {
      await saveProfile({
        name: data.profile.name || currentName,
        avatar: data.profile.avatar || "",
        theme: data.profile.theme || null,
        settingsIcon: data.profile.settingsIcon || ""
      });
      if (data.profile.name) {
        currentName = data.profile.name;
        mainTitle.textContent = currentName + "の私调记录";
      }
      if (data.profile.avatar) renderAvatar(data.profile.avatar);
      if (data.profile.theme) applyTheme(data.profile.theme);
      if (data.profile.settingsIcon) renderSettingsIcon(data.profile.settingsIcon);
    }
    settingsModal.classList.remove("show");
    showPage(pageFolders);
    await renderFolders();
    hideLoading();
    await appAlert("导入成功");
  } catch (err) {
    console.error(err);
    hideLoading();
    await appAlert("导入失败，请检查文件");
  }
};

previewBox.onclick = () => importImage.click();
importImage.onchange = async e => {
  const files = Array.from(e.target.files || []);
  if (!files.length) return;
  pendingImages = [];
  if (files.length > 3) showLoading("正在处理图片…", "共 " + files.length + " 张，请稍候");
  try {
    for (let i = 0; i < files.length; i++) {
      const f = files[i];
      const orig = await compressImage(f, 1280, 0.78);
      const thumb = await makeThumb(orig, 100);
      const cover = await makeThumb(orig, 360);
      pendingImages.push({ orig, thumb, cover });
      if (i % 2 === 1) await new Promise(r => setTimeout(r, 0));
    }
    if (pendingImages.length === 1) {
      previewBox.classList.remove("grid");
      previewBox.innerHTML = '<img src="' + pendingImages[0].thumb + '" alt="">';
    } else {
      previewBox.classList.add("grid");
      previewBox.innerHTML = pendingImages.map(p => '<img src="' + p.thumb + '" alt="">').join("");
    }
  } finally {
    hideLoading();
  }
};

btnSaveImport.onclick = async () => {
  const cardName = fCardName.value.trim();
  let meetName = fMeetName.value.trim();
  const priceRaw = fPrice.value.trim();
  let helper = fHelper.value.trim();
  const price = parsePrice(priceRaw);

  if (isThreshold()) {
    meetName = (document.getElementById("fMeetType") && document.getElementById("fMeetType").value) || pendingMeetType || "";
    if (!cardName) { await appAlert("请填写会名"); return; }
    if (!meetName) { await appAlert("请选择类别（永会/年会/套会/免费会）"); return; }
    if (!pendingImages.length) { await appAlert("请选择图片"); return; }
  } else {
    if (!cardName) { await appAlert("请填写色卡名"); return; }
    if (!pendingImages.length) { await appAlert("请选择图片"); return; }
  }
  btnSaveImport.disabled = true;
  showLoading(isThreshold() ? "正在保存入会记录…" : "正在保存私调…", "共 " + pendingImages.length + " 张，请稍候");
  try {
    let folder = await getFolderByCardName(cardName);
    let folderId;
    if (folder) {
      folderId = folder.id;
      await touchFolder(folderId);
      if (isThreshold() || meetName || helper || price) {
        const database = await openDB();
        const tx = database.transaction(STORE_FOLDERS, "readwrite");
        const f = await idbReq(tx.objectStore(STORE_FOLDERS).get(folderId));
        if (f) {
          if (meetName) f.meetName = meetName;
          if (helper) f.helper = helper;
          if (price) f.price = String(price);
          if (pendingImages[0]) f.coverBase64 = pendingImages[0].cover;
          f.updatedAt = Date.now();
          tx.objectStore(STORE_FOLDERS).put(f);
          await txDone(tx);
        }
      }
    } else {
      folderId = await addFolder({
        cardName, meetName, price: String(price), helper,
        coverBase64: pendingImages[0].cover,
        createdAt: Date.now(),
        updatedAt: Date.now()
      });
    }
    for (let i = 0; i < pendingImages.length; i++) {
      const p = pendingImages[i];
      await addRecord({
        folderId, imgBase64: p.orig, thumbBase64: p.thumb, note: cardName, price: String(price),
        meetName, helper, time: Date.now()
      });
      if (i % 2 === 1) await new Promise(r => setTimeout(r, 0));
    }
    resetImportForm();
    showPage(pageFolders);
    await renderFolders();
  } catch (err) {
    console.error(err);
    await appAlert("导入失败，请重试");
  } finally {
    hideLoading();
    btnSaveImport.disabled = false;
  }
};

document.getElementById("editSave").onclick = async () => {
  const folderId = Number(document.getElementById("editFolderId").value);
  const priceVal = document.getElementById("editPrice").value.trim();
  const meetVal = document.getElementById("editMeet").value.trim();
  const helperVal = document.getElementById("editHelper").value.trim();
  const noteVal = document.getElementById("editNote").value.trim();
  if (batchEditMode) {
    for (const rid of selectedRecordIds) {
      const patch = {};
      if (priceVal !== "") patch.price = String(parsePrice(priceVal));
      if (meetVal !== "") patch.meetName = meetVal;
      if (helperVal !== "") patch.helper = helperVal;
      if (noteVal !== "") patch.note = noteVal;
      if (Object.keys(patch).length) await updateRecord(rid, patch);
    }
    document.getElementById("editModal").classList.remove("show");
    batchEditMode = false;
    selectedRecordIds.clear();
    multiSelect = false;
    document.querySelector("#editModal h3").textContent = "编辑私调";
    document.getElementById("editSetCover").style.display = "";
    openFolder(folderId);
    renderFolders();
    return;
  }
  const id = Number(document.getElementById("editRecId").value);
  await updateRecord(id, { price: priceVal, meetName: meetVal, helper: helperVal, note: noteVal });
  document.getElementById("editModal").classList.remove("show");
  openFolder(folderId);
  renderFolders();
};

(async function init() {
  try {
    await openDB();
    const profile = await loadProfile();
    if (profile.theme) applyTheme(profile.theme);
    if (profile.settingsIcon) renderSettingsIcon(profile.settingsIcon);
    if (profile.appMode === "threshold" || profile.appMode === "private") {
      appMode = profile.appMode;
    }
    if (profile.name) {
      currentName = profile.name;
      nameInput.value = currentName;
      nameInput.style.display = "none";
      const L = modeLabels();
      if (isThreshold()) {
        screenTitle.textContent = "门槛记录";
        mainTitle.textContent = currentName + "の门槛记录";
      } else {
        screenTitle.textContent = currentName + L.titleSuffix;
        mainTitle.textContent = currentName + L.titleSuffix;
      }
      screenTip.textContent = "欢迎回来";
      confirmName.textContent = "登陆";
      if (profile.avatar) renderAvatar(profile.avatar);
    } else if (isThreshold()) {
      screenTitle.textContent = "门槛记录";
    }
    applyModeUI();
    requestAnimationFrame(() => { try { recalcTotalAll(); } catch(e) {} });
  } catch (e) {
    console.error(e);
    screenTip.textContent = "本地存储初始化失败";
  }
})();

/* iOS 全屏 / PWA 接入 */
(function injectPWA() {
  if (/^https?:$/.test(location.protocol)) {
    try {
      const link = document.createElement("link");
      link.rel = "manifest";
      link.href = "manifest.webmanifest";
      document.head.appendChild(link);
    } catch (e) { console.warn(e); }
    if ("serviceWorker" in navigator) {
      window.addEventListener("load", () => {
        navigator.serviceWorker.register("sw.js").catch(err => console.warn("SW 注册失败", err));
      });
    }
  }
  try {
    if (window.matchMedia && matchMedia("(display-mode: standalone)").matches) {
      document.documentElement.classList.add("standalone");
    }
  } catch (e) {}
})();
