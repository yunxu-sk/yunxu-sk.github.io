<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, maximum-scale=1, user-scalable=no">
<meta name="theme-color" content="#f4f7fb">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="私调记录">
<title>私调记录</title>
<style>
/* ============================================================
   私调记录 v5 —— 浅白液态玻璃设计系统
   透明渐变浅白 · 克制中性色 · 专业工作室质感
   ============================================================ */
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
:root{
  --bg1:#eef3fb;
  --bg2:#e6ecf7;
  --ink:#242a35;
  --ink-soft:#3f4756;
  --muted:#8b93a1;
  --faint:#b6bdc9;
  --line:rgba(255,255,255,.6);
  --glass:rgba(255,255,255,.10);
  --glass-2:rgba(255,255,255,.16);
  --glass-strong:rgba(255,255,255,.30);
  --ink-glass:rgba(42,47,56,.12);
  --solid:#2f3644;
  --solid-ink:#ffffff;
  --danger:#d9534f;
  --ok:#3f8f63;
  --warn:#b07c1f;
  --r-lg:22px;
  --r-md:16px;
  --r-sm:12px;
  --shadow:0 16px 40px -20px rgba(70,100,160,.35), inset 0 1px 0 rgba(255,255,255,.8);
  --shadow-soft:0 10px 24px -14px rgba(70,100,160,.3), inset 0 1px 0 rgba(255,255,255,.7);
  --ease:cubic-bezier(.22,.9,.32,1);
}
html,body{
  width:100%;min-height:100%;
  overscroll-behavior:none;
  color:var(--ink);
  font-family:-apple-system,BlinkMacSystemFont,"PingFang SC","HarmonyOS Sans SC","Microsoft YaHei",sans-serif;
  background:
    radial-gradient(60% 45% at 12% 8%, rgba(120,170,255,.28) 0%, rgba(120,170,255,0) 60%),
    radial-gradient(55% 45% at 92% 18%, rgba(190,150,255,.26) 0%, rgba(190,150,255,0) 60%),
    radial-gradient(60% 55% at 85% 92%, rgba(120,220,200,.26) 0%, rgba(120,220,200,0) 60%),
    radial-gradient(55% 50% at 10% 88%, rgba(255,180,190,.24) 0%, rgba(255,180,190,0) 60%),
    linear-gradient(180deg, var(--bg1) 0%, var(--bg2) 100%);
  background-attachment:fixed;
  -webkit-text-size-adjust:100%;
  touch-action:manipulation;
}
body{overflow-x:hidden}
body.lock{overflow:hidden;touch-action:none}
button,input,textarea,select{font:inherit;color:inherit}
button{cursor:pointer;border:none;background:none}
input,textarea,select{outline:none;border:none;background:none}
img{display:block;-webkit-touch-callout:none;-webkit-user-select:none;user-select:none}

.app{min-height:100vh;min-height:100dvh;display:flex;justify-content:center;padding:env(safe-area-inset-top) 0 env(safe-area-inset-bottom)}
.shell-wrap{width:100%;max-width:480px;display:flex;flex-direction:column}

/* ---------- 玻璃基础件（液态玻璃分层架构） ---------- */
/* ::before = 扭曲+磨砂背景层（只折背景不糊字）；内容自然上浮；::after = 高光描边 */
.glass,.surface,.chip,.btn{
  position:relative;isolation:isolate;
  border:1px solid var(--line);
}
.glass::before,.surface::before,.chip::before,.btn::before{
  content:"";position:absolute;inset:0;z-index:-1;border-radius:inherit;pointer-events:none;
  backdrop-filter:blur(18px) saturate(1.6);
  -webkit-backdrop-filter:blur(18px) saturate(1.6);
  filter:url(#lgv);
}
.glass::after,.surface::after,.btn::after{
  content:"";position:absolute;inset:0;border-radius:inherit;pointer-events:none;z-index:3;
  background:linear-gradient(180deg, rgba(255,255,255,.6) 0%, rgba(255,255,255,0) 26%);
  box-shadow:inset 0 0 0 1px rgba(255,255,255,.5), inset 0 1px 0 rgba(255,255,255,.8);
}
.glass::after{background:linear-gradient(180deg, rgba(255,255,255,.45) 0%, rgba(255,255,255,0) 30%)}

.glass{
  background:linear-gradient(165deg, rgba(255,255,255,.42) 0%, rgba(255,255,255,.18) 100%);
  box-shadow:var(--shadow);
}
.surface{
  background:linear-gradient(165deg, rgba(255,255,255,.36), rgba(255,255,255,.14));
  border-radius:var(--r-md);
  box-shadow:var(--shadow-soft);
}
.chip{
  font-size:12.5px;padding:8px 14px;border-radius:999px;
  background:rgba(255,255,255,.26);color:var(--ink-soft);
  transition:all .18s var(--ease);white-space:nowrap;
}
.chip.on{background:rgba(36,42,53,.5);border-color:transparent;color:#fff;font-weight:600;box-shadow:0 8px 18px -8px rgba(36,42,53,.5)}
.chip.on::before{backdrop-filter:blur(4px) saturate(1.3);-webkit-backdrop-filter:blur(4px) saturate(1.3);filter:none}
.btn{
  display:inline-flex;align-items:center;justify-content:center;gap:6px;
  padding:11px 14px;border-radius:14px;font-size:13.5px;font-weight:600;
  background:rgba(255,255,255,.30);color:var(--ink-soft);
  box-shadow:inset 0 1px 0 rgba(255,255,255,.6), 0 8px 18px -12px rgba(70,100,160,.28);
  transition:transform .12s var(--ease), opacity .15s, background .18s;
}
.btn:active{transform:scale(.97)}
.btn.primary{
  background:rgba(255,255,255,.52);color:var(--ink);border-color:rgba(255,255,255,.65);
  font-weight:700;
  box-shadow:inset 0 1px 0 rgba(255,255,255,.7), 0 10px 22px -12px rgba(47,54,68,.3);
}
.btn.ghost{background:rgba(255,255,255,.16)}
.btn.danger{color:var(--danger)}
.btn:disabled{opacity:.45;cursor:not-allowed}

/* 液态玻璃面板：设置弹窗（强模糊 + 高透，已挂 ::before 折射） */
.modal.sheet{
  position:relative;isolation:isolate;overflow:hidden;
  background:transparent;padding:0;backdrop-filter:none;-webkit-backdrop-filter:none;
  height:82vh;max-height:82vh;
}
.modal.sheet::before{
  content:"";position:absolute;inset:0;z-index:0;border-radius:inherit;
  background:linear-gradient(165deg, rgba(255,255,255,.62) 0%, rgba(255,255,255,.38) 100%);
  backdrop-filter:blur(26px) saturate(1.6);
  -webkit-backdrop-filter:blur(26px) saturate(1.6);
  filter:url(#lgv);
}
.modal.sheet::after{
  content:"";position:absolute;inset:0;z-index:4;border-radius:inherit;pointer-events:none;
  background:linear-gradient(180deg, rgba(255,255,255,.6) 0%, rgba(255,255,255,0) 24%);
  box-shadow:inset 0 0 0 1px rgba(255,255,255,.6), inset 0 1px 0 rgba(255,255,255,.9);
}
.sheet-scroll{position:absolute;inset:0;z-index:1;overflow-y:auto;overflow-x:hidden;padding:24px 22px 28px}
.modal.sheet .modal-x{z-index:5}

/* ---------- 欢迎 / 命名屏 ---------- */
.name-screen{
  flex:1;min-height:100vh;min-height:100dvh;
  display:flex;flex-direction:column;align-items:center;justify-content:center;
  padding:32px 26px;text-align:center;
}
.brand-mark{
  width:64px;height:64px;border-radius:20px;margin-bottom:18px;
  display:flex;align-items:center;justify-content:center;
  background:linear-gradient(160deg, rgba(255,255,255,.85), rgba(255,255,255,.45));
  border:1px solid var(--line);box-shadow:var(--shadow);
  color:var(--ink-soft);
}
.name-screen h1{font-size:22px;font-weight:700;letter-spacing:.02em;margin-bottom:6px}
.name-screen .sub{color:var(--muted);font-size:13px;margin-bottom:26px}
.name-screen input{
  width:100%;max-width:320px;font-size:16px;text-align:center;
  padding:13px 14px;border-radius:16px;margin-bottom:14px;
  background:rgba(255,255,255,.18);border:1px solid var(--line);
  backdrop-filter:blur(16px);-webkit-backdrop-filter:blur(16px);
}
.name-screen .btn{width:100%;max-width:320px;min-height:48px}
.name-screen .foot{margin-top:22px;font-size:11px;color:var(--faint)}

/* ---------- 主壳 ---------- */
.shell{display:none;flex:1;min-height:100vh;min-height:100dvh;flex-direction:column}
.shell.show{display:flex}
.topbar{
  display:flex;align-items:center;gap:12px;
  padding:calc(12px + env(safe-area-inset-top)) 14px 10px;
}
.avatar{
  width:44px;height:44px;border-radius:50%;overflow:hidden;flex-shrink:0;
  background:rgba(255,255,255,.16);border:1.5px solid var(--line);
  display:flex;align-items:center;justify-content:center;color:var(--muted);cursor:pointer;
  backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px);
}
.avatar img{width:100%;height:100%;object-fit:cover}
.title-area{flex:1;min-width:0}
.title-area .t1{font-size:15.5px;font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.title-area .t2{font-size:11px;color:var(--muted);margin-top:1px}
.amount-box{text-align:right;flex-shrink:0}
.amount-box .al{font-size:10px;color:var(--muted);line-height:1.2}
.amount-box .av{font-size:14px;font-weight:700;line-height:1.2}
.icon-btn{
  width:40px;height:40px;border-radius:14px;flex-shrink:0;position:relative;overflow:hidden;
  display:flex;align-items:center;justify-content:center;color:var(--ink-soft);
  background:rgba(255,255,255,.16);border:1px solid var(--line);box-shadow:var(--shadow-soft);
  backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px);
}
.icon-btn img{width:100%;height:100%;object-fit:cover}

/* ---------- 工具条 ---------- */
.toolbar{padding:2px 14px 10px;display:flex;flex-direction:column;gap:8px}
.search-row{display:flex;gap:8px;align-items:center}
.search-box{
  flex:1;display:flex;align-items:center;gap:8px;padding:9px 12px;border-radius:14px;
  background:rgba(255,255,255,.16);border:1px solid var(--line);
  backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);
}
.search-box svg{flex-shrink:0;color:var(--muted)}
.search-box input{flex:1;font-size:13.5px;background:transparent;min-width:0}
.sort-select{
  flex-shrink:0;font-size:12px;color:var(--ink-soft);
  background:rgba(255,255,255,.16);border:1px solid var(--line);border-radius:12px;
  padding:9px 8px;backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);
}
.action-row{display:flex;gap:8px}
.action-row .btn{flex:1;padding:10px 6px;font-size:12.5px}
.action-row .btn.primary{flex:1.5}

.stats-bar{display:flex;gap:7px;padding:0 14px 10px}
.stat{
  flex:1;min-width:0;text-align:center;padding:9px 4px;border-radius:14px;
  background:rgba(255,255,255,.16);border:1px solid var(--line);
  backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);
}
.stat .v{font-size:15px;font-weight:700;line-height:1.1}
.stat .l{font-size:10px;color:var(--muted);margin-top:3px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.stat .v.ok{color:var(--ok)}
.stat .v.warn{color:var(--warn)}

.move-bar{
  display:none;margin:0 14px 10px;padding:10px 12px;border-radius:14px;align-items:center;gap:8px;
  background:rgba(255,255,255,.18);border:1px solid var(--line);font-size:12px;
  backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);
}
.move-bar.show{display:flex}
.move-bar .mt{flex:1;min-width:0;color:var(--ink-soft)}
.move-bar button{flex-shrink:0;font-size:11.5px;font-weight:700;padding:7px 12px;border-radius:999px;background:rgba(255,255,255,.16);border:1px solid var(--line)}
.move-bar button.ok{background:var(--ink-glass);color:var(--ink);border-color:rgba(255,255,255,.45)}

/* ---------- 页面 ---------- */
.page{display:none;padding:4px 14px 28px;flex:1;overflow-y:auto;-webkit-overflow-scrolling:touch}
.page.active{display:block}
.page-head{display:flex;align-items:center;gap:10px;padding:6px 0 14px}
.page-head h2{font-size:16px;font-weight:700;flex:1;min-width:0}
.back-btn{
  width:38px;height:38px;border-radius:13px;flex-shrink:0;
  background:rgba(255,255,255,.16);border:1px solid var(--line);font-size:20px;
  display:flex;align-items:center;justify-content:center;color:var(--ink-soft);
  backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px);
}

/* 色卡网格 */
.grid{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.folder-card{
  position:relative;border-radius:var(--r-md);overflow:hidden;cursor:pointer;
  background:rgba(255,255,255,.12);border:1px solid var(--line);
  box-shadow:0 16px 32px -20px rgba(60,80,120,.38), inset 0 1px 0 rgba(255,255,255,.6);
  transition:transform .15s var(--ease);
}
.folder-card:active{transform:scale(.97)}
.folder-card .cover{width:100%;aspect-ratio:1;object-fit:cover;background:rgba(228,233,241,.6)}
.folder-card .cover-empty{
  width:100%;aspect-ratio:1;display:flex;align-items:center;justify-content:center;color:var(--faint);
  background:rgba(228,233,241,.55);
}
.folder-card .name{
  position:absolute;left:7px;bottom:7px;max-width:calc(100% - 14px);z-index:2;
  padding:5px 10px;border-radius:11px;font-size:12.5px;font-weight:700;
  background:linear-gradient(160deg, rgba(255,255,255,.82), rgba(255,255,255,.55));
  border:1px solid rgba(255,255,255,.8);
  backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);
  white-space:nowrap;overflow:hidden;text-overflow:ellipsis;
}
.folder-card .count{
  position:absolute;right:7px;bottom:7px;z-index:2;
  font-size:10.5px;font-weight:700;padding:3px 8px;border-radius:999px;
  background:rgba(47,54,68,.78);color:#fff;backdrop-filter:blur(6px);
}
.folder-card .fstatus{
  position:absolute;top:50%;left:50%;transform:translate(-50%,-50%);z-index:3;
  padding:7px 16px;border-radius:999px;font-size:13px;font-weight:700;letter-spacing:.04em;
  background:rgba(255,255,255,.82);border:1px solid rgba(255,255,255,.85);
  backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px);cursor:pointer;
  box-shadow:0 8px 20px -8px rgba(60,80,120,.4);
}
.folder-card .dot{
  position:absolute;top:7px;right:7px;z-index:3;width:26px;height:26px;border-radius:50%;
  background:rgba(255,255,255,.82);border:1px solid rgba(255,255,255,.85);
  display:flex;align-items:center;justify-content:center;font-size:15px;color:var(--ink-soft);
  backdrop-filter:blur(8px);
}
.folder-card.pick-src{opacity:.7}
.folder-card.pick-dst{outline:2px solid rgba(47,54,68,.6);outline-offset:2px}
.empty{
  grid-column:1/-1;text-align:center;color:var(--muted);font-size:13px;padding:54px 12px;line-height:1.8;
}
.empty .big{font-size:34px;margin-bottom:10px;color:var(--faint)}

/* 记录列表 */
.rec-list{display:flex;flex-direction:column;gap:10px}
.rec{
  display:flex;gap:10px;align-items:center;padding:10px;border-radius:15px;
  background:rgba(255,255,255,.16);border:1px solid var(--line);
  backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);
}
.rec .thumb{width:52px;height:52px;border-radius:11px;object-fit:cover;background:rgba(228,233,241,.4);flex-shrink:0;cursor:zoom-in}
.rec .body{flex:1;min-width:0}
.rec .body .n{font-size:13.5px;font-weight:700}
.rec .body .m{font-size:11px;color:var(--muted);margin-top:2px}
.rec .ops{display:flex;gap:5px;flex-shrink:0}
.rec .ops button{
  font-size:11px;padding:6px 10px;border-radius:999px;
  background:rgba(255,255,255,.18);border:1px solid var(--line);color:var(--ink-soft);
}
.rec .ops button.del{color:var(--danger)}

/* 详情页 */
.dt-title{font-size:26px;font-weight:800;letter-spacing:.02em;margin:2px 2px 12px}
.meta-card{padding:12px 14px;border-radius:15px;font-size:12.5px;line-height:1.9;margin-bottom:10px;background:rgba(255,255,255,.16);border:1px solid var(--line);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px)}
.meta-card.row{display:flex;justify-content:space-between;align-items:center}
.meta-card span.k{color:var(--muted);margin-right:6px}
.meta-card .val{font-weight:700}
.muted-action{
  display:inline-block;font-size:11.5px;padding:5px 12px;border-radius:999px;margin:0 6px 8px 0;
  background:rgba(255,255,255,.16);border:1px solid var(--line);color:var(--ink-soft);
  backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);
}
.sec-label{font-size:12px;color:var(--muted);margin:14px 0 8px;font-weight:600}
.multi-bar{display:none;gap:8px;margin-bottom:10px}
.multi-bar.show{display:flex}
.multi-bar button{flex:1;padding:9px 4px;font-size:12px;border-radius:12px;border:1px solid var(--line);background:rgba(255,255,255,.16);color:var(--ink-soft);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px)}
.multi-bar button.danger{color:var(--danger)}
.rec-wrap{position:relative;margin-bottom:8px}
.rec-wrap .cb{position:absolute;top:12px;left:12px;width:20px;height:20px;z-index:2;accent-color:#2f3644;display:none}
.rec-wrap .cb.show{display:block}

/* 导入表单 */
.dropzone{
  width:100%;aspect-ratio:1.25;border-radius:16px;min-height:150px;
  border:1.5px dashed rgba(150,160,175,.4);background:rgba(255,255,255,.12);
  display:flex;align-items:center;justify-content:center;text-align:center;
  color:var(--muted);font-size:13px;cursor:pointer;overflow:hidden;position:relative;
  transition:all .18s var(--ease);
}
.dropzone.drag{border-color:rgba(42,47,56,.45);background:rgba(255,255,255,.3)}
.dropzone .dz-inner{padding:16px}
.dropzone .dz-inner .ic{font-size:30px;margin-bottom:8px;color:var(--faint)}
.dropzone.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:6px;padding:6px;align-content:start;overflow-y:auto}
.dropzone.grid img{width:100%;aspect-ratio:1;object-fit:cover;border-radius:9px}
.form-row{margin-bottom:12px}
.form-row label{display:block;font-size:12.5px;font-weight:700;color:var(--ink-soft);margin-bottom:7px}
.form-row input,.form-row select{
  width:100%;font-size:15px;padding:12px 13px;border-radius:13px;min-height:46px;
  background:rgba(255,255,255,.18);border:1px solid var(--line);
  backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);
}
.hint{font-size:11px;color:var(--muted);margin-top:10px;line-height:1.6}
.type-chip-wrap{display:flex;flex-wrap:wrap;gap:8px}

/* ---------- 弹窗 ---------- */
.mask{
  display:none;position:fixed;inset:0;z-index:40;padding:14px;
  background:rgba(40,50,66,.28);backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px);
  align-items:center;justify-content:center;
}
.mask.show{display:flex}
.modal{
  width:100%;max-width:420px;max-height:82vh;overflow-y:auto;
  border-radius:24px;padding:20px 18px;
  background:linear-gradient(170deg, rgba(255,255,255,.5), rgba(255,255,255,.26));
  border:1px solid rgba(255,255,255,.65);
  backdrop-filter:blur(40px) saturate(1.7);-webkit-backdrop-filter:blur(40px) saturate(1.7);
  box-shadow:0 30px 70px -20px rgba(50,70,110,.42), inset 0 1px 0 rgba(255,255,255,.75);
}
.modal h3{font-size:16px;font-weight:700;margin-bottom:14px;text-align:center;position:relative}
.modal-x{
  position:absolute;top:14px;right:14px;width:30px;height:30px;border-radius:10px;
  display:flex;align-items:center;justify-content:center;font-size:18px;color:var(--muted);
  background:rgba(255,255,255,.18);border:1px solid var(--line);line-height:1;
}
.modal .sec{margin-bottom:14px}
.modal .sec-label{font-size:11px;color:var(--muted);margin:14px 0 8px;font-weight:700;letter-spacing:.08em;text-transform:uppercase}
.modal .sec-label:first-child{margin-top:0}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.modal-actions{display:flex;gap:9px;margin-top:6px}
.modal-actions button{flex:1;padding:12px;border-radius:13px;font-size:14px;font-weight:600}
.modal-actions .cancel{background:rgba(255,255,255,.18);border:1px solid var(--line);color:var(--muted)}
.modal-actions .ok{background:var(--ink-glass);color:var(--ink);border-color:rgba(255,255,255,.45);font-weight:700}
.set-row{display:flex;align-items:center;gap:10px;margin-bottom:10px}
.set-row>span{flex:1;font-size:13px;color:var(--ink-soft)}
.set-row input[type=text],.set-row input:not([type]){
  flex:1;font-size:13px;padding:9px 11px;border-radius:10px;background:rgba(255,255,255,.2);border:1px solid var(--line);min-width:0;
}
.set-row input[type=color]{width:38px;height:32px;border:none;border-radius:9px;background:none;padding:0;flex-shrink:0}
.set-actions{display:flex;flex-direction:column;gap:8px}
.set-actions button{padding:11px;border-radius:12px;font-size:13.5px;font-weight:600;background:rgba(255,255,255,.4);border:1px solid var(--line);text-align:left;padding-left:14px}
.set-actions button:active{transform:scale(.98)}
.set-actions button.danger{color:var(--danger)}
.danger-zone{margin-top:14px;padding-top:14px;border-top:1px solid var(--line)}
.danger-zone button{width:100%;padding:11px;border-radius:12px;font-size:13.5px;font-weight:600;background:rgba(217,83,79,.1);border:1px solid rgba(217,83,79,.3);color:var(--danger);text-align:center}
/* 分组列表卡片（统一等高行） */
.set-list{
  border-radius:14px;margin-bottom:4px;overflow:hidden;
  background:rgba(255,255,255,.42);border:1px solid var(--line);
  backdrop-filter:blur(16px);-webkit-backdrop-filter:blur(16px);
}
.set-list .set-row{display:flex;align-items:center;gap:10px;padding:11px 14px;border-bottom:1px solid var(--line);margin-bottom:0}
.set-list .set-row:last-child{border-bottom:none}
.set-list .set-row>span{flex:0 0 56px;font-size:13px;color:var(--ink-soft)}
.set-list .set-row input[type=text],.set-list .set-row input:not([type]){
  flex:1;font-size:13px;padding:6px 10px;border-radius:9px;
  background:rgba(255,255,255,.45);border:1px solid var(--line);min-width:0;
}
.set-list .set-row input[type=color]{width:34px;height:30px;border:none;border-radius:8px;background:none;padding:0;flex-shrink:0}
.set-list .row-btn{
  display:flex;width:100%;align-items:center;justify-content:center;
  padding:13px 14px;font-size:13.5px;font-weight:600;color:var(--ink-soft);
  background:transparent;border:none;border-bottom:1px solid var(--line);text-align:center;
}
.set-list .row-btn:last-child{border-bottom:none}
.set-list .row-btn:active{background:rgba(255,255,255,.18)}
.set-list .row-btn.danger{color:var(--danger)}
.set-list .row-2{display:flex;border-bottom:1px solid var(--line)}
.set-list .row-2:last-child{border-bottom:none}
.set-list .row-2 button{flex:1;padding:13px 8px;font-size:13px;font-weight:600;background:transparent;color:var(--ink-soft)}
.set-list .row-2 button+button{border-left:1px solid var(--line)}
.set-list .row-2 button:active{background:rgba(255,255,255,.18)}
.set-list.danger{background:rgba(217,83,79,.09);border-color:rgba(217,83,79,.25)}

/* 设置页：高级磨砂胶囊风（单块玻璃卡 + 浮动标签 + 饱满白胶囊） */
.modal.sheet h3{text-align:left;font-size:19px;margin-bottom:6px;padding-right:34px}
.set-label{display:block;font-size:12px;font-weight:600;color:var(--muted);margin:16px 2px 8px;letter-spacing:.02em}
.set-label:first-of-type{margin-top:4px}
.set-field{
  width:100%;font-size:14px;padding:13px 16px;border-radius:16px;min-height:48px;
  background:rgba(255,255,255,.45);border:1px solid rgba(255,255,255,.6);
  backdrop-filter:blur(16px) saturate(1.6);-webkit-backdrop-filter:blur(16px) saturate(1.6);
  box-shadow:0 6px 18px -10px rgba(60,80,120,.18), inset 0 1px 0 rgba(255,255,255,.6);
  color:var(--ink);
}
.set-field::placeholder{color:var(--faint)}
.set-color-row{display:flex;align-items:center;gap:10px}
.set-swatch{
  width:48px;height:48px;border-radius:15px;flex-shrink:0;padding:0;cursor:pointer;
  border:2px solid rgba(255,255,255,.7);
  box-shadow:0 0 0 1px rgba(150,160,175,.22), 0 6px 14px -6px rgba(60,80,120,.2);
}
.set-pill{
  width:100%;display:flex;align-items:center;justify-content:center;
  min-height:48px;padding:13px 16px;border-radius:16px;font-size:14px;font-weight:600;
  background:rgba(255,255,255,.09);border:1px solid rgba(255,255,255,.45);color:var(--ink-soft);
  backdrop-filter:blur(8px) saturate(1.3);-webkit-backdrop-filter:blur(8px) saturate(1.3);
  box-shadow:0 4px 14px -10px rgba(60,80,120,.2), inset 0 1px 0 rgba(255,255,255,.4);
  transition:transform .12s var(--ease), background .18s;
}
.set-pill:active{transform:scale(.98)}
.set-pill.danger{color:var(--danger)}
.set-grid2{display:flex;gap:10px}
.set-grid2 .set-pill{flex:1}
.set-stack{display:flex;flex-direction:column;gap:11px;margin-top:16px}
.color-row{display:flex;align-items:center;gap:8px;margin-bottom:10px}
.color-row input[type=color]{width:38px;height:32px;border:none;border-radius:9px;background:none;padding:0}
.color-row input[type=text]{flex:1;font-size:12.5px;padding:8px 10px;border-radius:9px;background:rgba(255,255,255,.2);border:1px solid var(--line)}

/* 灯箱 */
.lightbox{
  display:none;position:fixed;inset:0;z-index:60;
  background:rgba(15,18,26,.9);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);
  align-items:center;justify-content:center;touch-action:none;
}
.lightbox.show{display:flex}
.lightbox img{max-width:94%;max-height:84vh;border-radius:14px;object-fit:contain}
.lb-close{
  position:absolute;top:max(14px, env(safe-area-inset-top));right:14px;width:42px;height:42px;border-radius:14px;
  background:rgba(255,255,255,.18);color:#fff;font-size:22px;border:1px solid rgba(255,255,255,.25);
}
.lb-save{
  position:absolute;left:50%;bottom:max(22px, env(safe-area-inset-bottom));transform:translateX(-50%);
  padding:11px 22px;border-radius:999px;color:#fff;font-size:13.5px;font-weight:600;
  background:rgba(255,255,255,.2);border:1px solid rgba(255,255,255,.3);
}

/* Toast / Loading */
.toast-mask{display:none;position:fixed;inset:0;z-index:120;align-items:center;justify-content:center;padding:24px;background:rgba(40,50,66,.25);backdrop-filter:blur(8px)}
.toast-mask.show{display:flex}
.toast-card{
  width:100%;max-width:300px;padding:22px 18px 16px;border-radius:22px;text-align:center;
  background:linear-gradient(170deg, rgba(255,255,255,.72), rgba(255,255,255,.45));
  border:1px solid rgba(255,255,255,.7);
  backdrop-filter:blur(28px) saturate(1.6);-webkit-backdrop-filter:blur(28px) saturate(1.6);
  box-shadow:0 24px 60px -20px rgba(50,70,110,.42);
}
.toast-card .msg{font-size:14.5px;font-weight:600;line-height:1.6;white-space:pre-wrap;margin-bottom:16px}
.toast-card .acts{display:flex;gap:10px}
.toast-card .acts button{flex:1;min-height:44px;border-radius:13px;font-size:14px;font-weight:600;border:1px solid var(--line)}
.toast-card .ok{background:var(--ink-glass);color:var(--ink);border-color:rgba(255,255,255,.45);font-weight:700}
.toast-card .cancel{background:rgba(255,255,255,.22);color:var(--muted)}
.toast-card.only .acts{justify-content:center}
.toast-card.only .ok{max-width:140px}
#loading{
  display:none;position:fixed;inset:0;z-index:130;align-items:center;justify-content:center;
  background:rgba(40,50,66,.3);backdrop-filter:blur(8px);
}
#loading.show{display:flex}
.loading-box{
  padding:22px 28px;border-radius:20px;text-align:center;max-width:280px;
  background:linear-gradient(170deg, rgba(255,255,255,.78), rgba(255,255,255,.5));
  border:1px solid rgba(255,255,255,.75);
  backdrop-filter:blur(28px) saturate(1.6);-webkit-backdrop-filter:blur(28px) saturate(1.6);
  box-shadow:0 24px 60px -20px rgba(50,70,110,.42);
}
.loading-box .lt{font-size:14.5px;font-weight:700;margin-bottom:6px}
.loading-box .ls{font-size:11.5px;color:var(--muted);line-height:1.5}
.spinner{width:26px;height:26px;margin:0 auto 12px;border-radius:50%;border:2.5px solid rgba(47,54,68,.15);border-top-color:var(--solid);animation:spin .8s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}

input.lazy{background:rgba(228,233,241,.5)}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>
</head>
<body>
<div class="app">
  <div class="shell-wrap">

    <!-- 命名屏 -->
    <div class="glass name-screen" id="nameScreen">
      <div class="brand-mark">
        <svg viewBox="0 0 24 24" width="30" height="30" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="3" width="18" height="18" rx="4"/><circle cx="9" cy="9" r="2"/><path d="M21 15l-5-5L5 21"/></svg>
      </div>
      <h1 id="screenTitle">私调记录</h1>
      <p class="sub" id="screenTip">请输入您的圈名</p>
      <input type="text" id="nameInput" maxlength="20" autocomplete="off">
      <button class="btn primary" id="confirmName">确定</button>
      <p class="foot">数据仅保存在本机浏览器 · 支持导出备份</p>
    </div>

    <!-- 主壳 -->
    <div class="shell" id="shell">
      <!-- 顶栏 -->
      <div class="topbar">
        <div class="avatar" id="avatarBox">
          <svg viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><path d="M3 8.5A2.5 2.5 0 0 1 5.5 6h2L9 4h6l1.5 2h2A2.5 2.5 0 0 1 21 8.5v8A2.5 2.5 0 0 1 18.5 19h-13A2.5 2.5 0 0 1 3 16.5z"/><circle cx="12" cy="12.5" r="3.5"/></svg>
          <img id="avatarImg" style="display:none" alt="">
        </div>
        <div class="title-area">
          <div class="t1" id="mainTitle">圈名の私调记录</div>
          <div class="t2 subtitle" id="subtitle">本机保存 · 可备份</div>
        </div>
        <div class="amount-box">
          <div class="al" id="totalLabel">总金额</div>
          <div class="av" id="totalValue">¥0</div>
        </div>
        <button class="icon-btn" id="btnSettings" title="设置">
          <svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="3.2"/><path d="M19.4 15a1.7 1.7 0 0 0 .34 1.87l.06.06a2 2 0 1 1-2.83 2.83l-.06-.06a1.7 1.7 0 0 0-1.87-.34 1.7 1.7 0 0 0-1.03 1.56V21a2 2 0 1 1-4 0v-.09a1.7 1.7 0 0 0-1.11-1.56 1.7 1.7 0 0 0-1.87.34l-.06.06a2 2 0 1 1-2.83-2.83l.06-.06a1.7 1.7 0 0 0 .34-1.87 1.7 1.7 0 0 0-1.56-1.03H3a2 2 0 1 1 0-4h.09a1.7 1.7 0 0 0 1.56-1.11 1.7 1.7 0 0 0-.34-1.87l-.06-.06a2 2 0 1 1 2.83-2.83l.06.06a1.7 1.7 0 0 0 1.87.34h.08a1.7 1.7 0 0 0 1.03-1.56V3a2 2 0 1 1 4 0v.09a1.7 1.7 0 0 0 1.03 1.56 1.7 1.7 0 0 0 1.87-.34l.06-.06a2 2 0 1 1 2.83 2.83l-.06.06a1.7 1.7 0 0 0-.34 1.87v.08a1.7 1.7 0 0 0 1.56 1.03H21a2 2 0 1 1 0 4h-.09a1.7 1.7 0 0 0-1.51 1.03z"/></svg>
          <img id="settingsIconImg" style="display:none" alt="">
        </button>
      </div>

      <!-- 主页 -->
      <div class="page active" id="pageHome">
        <div class="toolbar">
          <div class="search-row">
            <div class="search-box">
              <svg viewBox="0 0 24 24" width="15" height="15" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="11" cy="11" r="7"/><path d="M21 21l-4-4"/></svg>
              <input type="text" id="searchInput" placeholder="搜索色卡 / 会名 / 助手…" autocomplete="off">
            </div>
            <select class="sort-select" id="sortSelect" title="排序">
              <option value="recent">最近</option>
              <option value="name">名称</option>
              <option value="price">价格</option>
              <option value="status">状态</option>
            </select>
          </div>
          <div class="action-row">
            <button class="btn ghost" id="btnMove">排序移动</button>
            <button class="btn ghost" id="btnFilter">筛选</button>
            <button class="btn primary" id="btnImport">＋ 导入私调</button>
          </div>
        </div>
        <div class="stats-bar" id="statsBar"></div>
        <div class="move-bar" id="moveBar">
          <div class="mt" id="moveTip">① 点选要移动的色卡</div>
          <button id="moveCancel">取消</button>
          <button class="ok" id="moveOk" style="display:none">确定</button>
        </div>
        <div class="grid" id="grid"></div>
      </div>

      <!-- 导入页 -->
      <div class="page" id="pageImport">
        <div class="page-head">
          <button class="back-btn" id="backFromImport">‹</button>
          <h2 id="importTitle">导入私调</h2>
        </div>
        <div class="surface" style="padding:14px">
          <div class="dropzone" id="dropzone">
            <div class="dz-inner" id="dzInner">
              <div class="ic">＋</div>
              <div>点击选择 / 拖拽图片到这里</div>
              <div style="font-size:11px;margin-top:6px;opacity:.8">也可直接 Ctrl+V 粘贴截图</div>
            </div>
          </div>
          <input type="file" id="importFiles" accept="image/*" multiple hidden>
          <div class="form-row" style="margin-top:12px">
            <label>归入</label>
            <select id="fExisting">
              <option value="">＋ 新建色卡（下方填写名称）</option>
            </select>
          </div>
          <div class="form-row">
            <label id="lCardName">色卡名</label>
            <input type="text" id="fCardName" autocomplete="off" placeholder="给这组图起个名字">
          </div>
          <div class="form-row" id="rowMeet">
            <label id="lMeet">会名</label>
            <input type="text" id="fMeet" autocomplete="off" placeholder="如：BWxx">
          </div>
          <div class="form-row" id="rowType" style="display:none">
            <label>类别</label>
            <div class="type-chip-wrap" id="typeChips">
              <button type="button" class="chip" data-v="永会">永会</button>
              <button type="button" class="chip" data-v="年会">年会</button>
              <button type="button" class="chip" data-v="套会">套会</button>
              <button type="button" class="chip" data-v="免费会">免费会</button>
            </div>
            <input type="hidden" id="fType">
          </div>
          <div class="form-row">
            <label id="lPrice">价格</label>
            <input type="text" id="fPrice" inputmode="decimal" placeholder="可留空">
          </div>
          <div class="form-row" id="rowHelper">
            <label id="lHelper">助手</label>
            <input type="text" id="fHelper" autocomplete="off" placeholder="可留空">
          </div>
          <button class="btn primary" id="btnSaveImport" style="width:100%;margin-top:4px">保存导入</button>
          <div class="hint" id="importHint">支持一次选多张图，全部归入同一色卡；封面取第一张。</div>
        </div>
      </div>

      <!-- 详情页 -->
      <div class="page" id="pageDetail">
        <div class="page-head">
          <button class="back-btn" id="backFromDetail">‹</button>
          <h2 id="detailTitle">色卡详情</h2>
        </div>
        <div id="detailBody"></div>
      </div>
    </div>
  </div>
</div>

<!-- 筛选弹窗 -->
<div class="mask" id="filterModal">
  <div class="modal">
    <h3>筛选</h3>
    <div class="sec"><label>状态</label><div class="chips" id="fChipsStatus"></div></div>
    <div class="sec" id="fSecMeet"><label id="fLabelMeet">会名</label><div class="chips" id="fChipsMeet"></div></div>
    <div class="sec" id="fSecHelper"><label id="fLabelHelper">助手</label><div class="chips" id="fChipsHelper"></div></div>
    <div class="modal-actions">
      <button class="cancel" id="fReset">重置</button>
      <button class="ok" id="fApply">确定</button>
    </div>
  </div>
</div>

<!-- 设置弹窗 -->
<div class="mask" id="settingsModal">
  <div class="modal sheet">
    <button class="modal-x" id="settingsCloseX" aria-label="关闭">×</button>
    <div class="sheet-scroll">
    <h3>设置</h3>

    <label class="set-label">用户昵称</label>
    <input class="set-field" type="text" id="nicknameInput" maxlength="20" placeholder="你的圈名">

    <label class="set-label">标题下方文案</label>
    <input class="set-field" type="text" id="subtitleInput" value="本机保存 · 可备份">

    <label class="set-label">头像与图标</label>
    <div class="set-grid2">
      <button class="set-pill" id="btnPickAvatar">换头像</button>
      <button class="set-pill" id="btnPickIcon">换设置图标</button>
    </div>

    <label class="set-label">背景色 1（顶部）</label>
    <div class="set-color-row">
      <input class="set-swatch" type="color" id="cBg1" value="#f7f9fc">
      <input class="set-field" type="text" id="cBg1Hex" value="#f7f9fc">
    </div>

    <label class="set-label">背景色 2（底部）</label>
    <div class="set-color-row">
      <input class="set-swatch" type="color" id="cBg2" value="#e9edf4">
      <input class="set-field" type="text" id="cBg2Hex" value="#e9edf4">
    </div>

    <label class="set-label">文字颜色</label>
    <div class="set-color-row">
      <input class="set-swatch" type="color" id="cText" value="#2a2f38">
      <input class="set-field" type="text" id="cTextHex" value="#2a2f38">
    </div>

    <div class="set-stack">
      <button class="set-pill" id="btnResetTheme">恢复默认外观</button>
      <button class="set-pill" id="btnExportJson">导出备份（JSON）</button>
      <button class="set-pill" id="btnImportJson">导入备份文件</button>
      <button class="set-pill" id="btnExportCsv">导出记账表格（CSV）</button>
      <button class="set-pill" id="btnSwitchMode">切换为门槛记录模式</button>
      <button class="set-pill danger" id="btnClearAll">清空所有内容</button>
      <button class="set-pill" id="settingsClose" style="font-weight:700">关闭</button>
    </div>
    </div>
  </div>
</div>

<!-- 色卡操作弹窗 -->
<div class="mask" id="folderActionModal">
  <div class="modal" style="max-width:300px">
    <h3>色卡操作</h3>
    <div class="set-actions">
      <button id="faRename">重命名</button>
      <button id="faUp">上移</button>
      <button id="faDown">下移</button>
      <button id="faSold">已出</button>
      <button id="faPending">待出</button>
      <button id="faRefund" style="display:none">已退款</button>
      <button id="faDelete" class="danger">删除</button>
      <button id="faCancel">取消</button>
    </div>
  </div>
</div>

<!-- 重命名弹窗 -->
<div class="mask" id="renameModal">
  <div class="modal" style="max-width:320px">
    <h3>重命名</h3>
    <div class="form-row"><input type="text" id="renameInput" maxlength="30"></div>
    <div class="modal-actions">
      <button class="cancel" id="renameCancel">取消</button>
      <button class="ok" id="renameOk">保存</button>
    </div>
  </div>
</div>

<!-- 编辑记录弹窗 -->
<div class="mask" id="editModal">
  <div class="modal" style="max-width:340px">
    <h3 id="editTitle">编辑私调</h3>
    <input type="hidden" id="eRecId"><input type="hidden" id="eFolderId">
    <div class="form-row"><label>价格</label><input type="text" id="ePrice" inputmode="decimal"></div>
    <div class="form-row"><label id="eMeetLabel">会名</label><input type="text" id="eMeet"></div>
    <div class="form-row"><label id="eHelperLabel">助手</label><input type="text" id="eHelper"></div>
    <div class="form-row"><label>备注</label><input type="text" id="eNote"></div>
    <div class="set-actions" style="flex-direction:row">
      <button id="eSetCover" style="flex:1">设为封面</button>
    </div>
    <div class="modal-actions">
      <button class="cancel" id="eCancel">取消</button>
      <button class="ok" id="eSave">保存</button>
    </div>
  </div>
</div>

<!-- 详情内会名筛选 -->
<div class="mask" id="folderMeetModal">
  <div class="modal" style="max-width:340px">
    <h3>筛选会名</h3>
    <div class="chips" id="folderMeetChips"></div>
    <div class="modal-actions" style="margin-top:16px">
      <button class="cancel" id="fmReset">重置</button>
      <button class="ok" id="fmApply">确定</button>
    </div>
  </div>
</div>

<!-- 金额 / 风格弹窗 -->
<div class="mask" id="cardPriceModal">
  <div class="modal" style="max-width:300px">
    <h3>裸卡价格</h3>
    <div class="form-row"><input type="text" id="cardPriceInput" inputmode="decimal"></div>
    <div class="modal-actions"><button class="cancel" id="cpCancel">取消</button><button class="ok" id="cpOk">保存</button></div>
  </div>
</div>
<div class="mask" id="cardStyleModal">
  <div class="modal" style="max-width:300px">
    <h3>色卡风格</h3>
    <div class="form-row"><input type="text" id="cardStyleInput" maxlength="30"></div>
    <div class="modal-actions"><button class="cancel" id="csCancel">取消</button><button class="ok" id="csOk">保存</button></div>

<script>
"use strict";
/* ================= 数据层（与旧版同库，数据无缝升级） ================= */
const DB_NAME = "privateRecordDB_v5", DB_VERSION = 2;
const STORE_FOLDERS = "folders", STORE_RECORDS = "records", STORE_PROFILE = "profile";
let db = null;

const $ = id => document.getElementById(id);
const esc = s => String(s == null ? "" : s).replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;").replace(/"/g,"&quot;");

function openDB(){
  if (db) return Promise.resolve(db);
  return new Promise((resolve,reject)=>{
    const req = indexedDB.open(DB_NAME, DB_VERSION);
    req.onupgradeneeded = e => {
      const d = e.target.result;
      if (!d.objectStoreNames.contains(STORE_FOLDERS)) d.createObjectStore(STORE_FOLDERS,{keyPath:"id",autoIncrement:true});
      if (!d.objectStoreNames.contains(STORE_RECORDS)) {
        const rs = d.createObjectStore(STORE_RECORDS,{keyPath:"id",autoIncrement:true});
        rs.createIndex("folderId","folderId",{unique:false});
      }
      if (!d.objectStoreNames.contains(STORE_PROFILE)) d.createObjectStore(STORE_PROFILE,{keyPath:"key"});
    };
    req.onsuccess = e => { db = e.target.result; resolve(db); };
    req.onerror = () => reject(req.error);
  });
}
const req = r => new Promise((res,rej)=>{ r.onsuccess=()=>res(r.result); r.onerror=()=>rej(r.error); });
const txDone = t => new Promise((res,rej)=>{ t.oncomplete=()=>res(); t.onerror=()=>rej(t.error); t.onabort=()=>rej(t.error); });

/* ================= 全局状态 ================= */
let currentName = "";
let appMode = "private";       // private | threshold
let pendingImages = [];
let pendingType = "";
let moveStep = 0, moveSrc = null;
let searchQuery = "";
let sortMode = "recent";
let filterState = { statuses:new Set(), meets:new Set(), helpers:new Set() };
let folderMeetFilter = new Set();
let multiSelect = false;
let selectedIds = new Set();
let coverPickMode = false;
let allFoldersCache = [];
let allRecordsCache = [];
let amountFilter = "all";   // all | yearForever（门槛模式：全部 / 年永）

const isThreshold = () => appMode === "threshold";
function labels(){
  if (isThreshold()) return {
    titleSuffix:"の门槛记录", importBtn:"＋ 入会记录", importTitle:"入会记录",
    cardNameLabel:"会名", meetLabel:"类别", helperLabel:"备注",
    hint:"支持一次选多张图，全部归入同一会名；封面取第一张。类别请点选。",
    sold:"已完结", pending:"待退款", refunded:"已退款", none:"在更",
    empty:'暂无入会记录<br>点击「入会记录」开始'
  };
  return {
    titleSuffix:"の私调记录", importBtn:"＋ 导入私调", importTitle:"导入私调",
    cardNameLabel:"色卡名", meetLabel:"会名", helperLabel:"助手",
    hint:"支持一次选多张图，全部归入同一色卡；封面取第一张。",
    sold:"已出", pending:"待出", refunded:"", none:"未出",
    empty:'暂无色卡<br>点击「导入私调」开始'
  };
}

/* ================= 工具 ================= */
function parsePrice(v){ const n = parseFloat(String(v==null?"":v).replace(/[^\d.]/g,"")); return isNaN(n)?0:Math.round(n*100)/100; }
function fmtMoney(n){ return "¥" + (Math.round(n*100)/100).toLocaleString("zh-CN"); }
function vibrate(ms){ try{ navigator.vibrate && navigator.vibrate(ms||8); }catch(e){} }

function compressImage(file, maxSize, q){
  maxSize = maxSize||1200; q = q||0.8;
  return new Promise((res,rej)=>{
    const fr = new FileReader();
    fr.onload = () => {
      const img = new Image();
      img.onload = () => {
        let w=img.width,h=img.height;
        if (w>maxSize||h>maxSize){ const r=Math.min(maxSize/w,maxSize/h); w=Math.round(w*r); h=Math.round(h*r); }
        const c=document.createElement("canvas"); c.width=w; c.height=h;
        c.getContext("2d").drawImage(img,0,0,w,h);
        res(c.toDataURL("image/jpeg",q));
      };
      img.onerror = rej; img.src = fr.result;
    };
    fr.onerror = rej; fr.readAsDataURL(file);
  });
}
function makeThumb(dataUrl, size){
  size = size||110;
  return new Promise((res,rej)=>{
    const img = new Image();
    img.onload = () => {
      let w=img.width,h=img.height; const r=Math.min(size/w,size/h,1);
      w=Math.round(w*r); h=Math.round(h*r);
      const c=document.createElement("canvas"); c.width=w; c.height=h;
      c.getContext("2d").drawImage(img,0,0,w,h);
      res(c.toDataURL("image/jpeg",0.55));
    };
    img.onerror = rej; img.src = dataUrl;
  });
}

/* ================= 弹窗 / Toast / Loading ================= */
function showLoading(t,s){ $("loadingText").textContent=t||"处理中…"; $("loadingSub").textContent=s||"请勿关闭页面"; $("loading").classList.add("show"); document.body.classList.add("lock"); }
function hideLoading(){ $("loading").classList.remove("show"); refreshLock(); }
function refreshLock(){ const open = document.querySelector(".mask.show,.lightbox.show,#loading.show,#toastMask.show"); document.body.classList.toggle("lock", !!open); }
function openMask(id){ $(id).classList.add("show"); refreshLock(); }
function closeMask(id){ $(id).classList.remove("show"); refreshLock(); }

function appAlert(msg){
  return new Promise(res=>{
    $("toastMsg").textContent = String(msg||"");
    $("toastCancel").style.display="none";
    $("toastOk").textContent="关闭";
    $("toastCard").classList.add("only");
    $("toastMask").classList.add("show"); refreshLock();
    const done=()=>{ $("toastMask").classList.remove("show"); refreshLock(); $("toastOk").onclick=null; res(); };
    $("toastOk").onclick=done;
  });
}
function appConfirm(msg){
  return new Promise(res=>{
    $("toastMsg").textContent = String(msg||"");
    $("toastCancel").style.display="";
    $("toastOk").textContent="确定";
    $("toastCard").classList.remove("only");
    $("toastMask").classList.add("show"); refreshLock();
    const done=v=>{ $("toastMask").classList.remove("show"); refreshLock(); $("toastOk").onclick=null; $("toastCancel").onclick=null; res(v); };
    $("toastOk").onclick=()=>done(true);
    $("toastCancel").onclick=()=>done(false);
  });
}

/* ================= Profile ================= */
async function saveProfile(data){
  const d = await openDB();
  const tx = d.transaction(STORE_PROFILE,"readwrite");
  const prev = (await req(tx.objectStore(STORE_PROFILE).get("user")))||{};
  tx.objectStore(STORE_PROFILE).put({key:"user",...prev,...data});
  await txDone(tx);
}
async function loadProfile(){
  const d = await openDB();
  return (await req(d.transaction(STORE_PROFILE,"readonly").objectStore(STORE_PROFILE).get("user")))||{};
}

/* ================= Folder / Record CRUD ================= */
async function loadFolders(){
  const d = await openDB();
  let all = (await req(d.transaction(STORE_FOLDERS,"readonly").objectStore(STORE_FOLDERS).getAll()))||[];
  const want = isThreshold() ? "threshold" : "private";
  all = all.filter(f => (f.mode||"private") === want);
  all.sort((a,b)=>{
    const oa = a.sortOrder!=null?a.sortOrder:(a.createdAt||a.id||0);
    const ob = b.sortOrder!=null?b.sortOrder:(b.createdAt||b.id||0);
    return oa-ob;
  });
  allFoldersCache = all;
  return all;
}
async function loadRecords(){
  const d = await openDB();
  allRecordsCache = (await req(d.transaction(STORE_RECORDS,"readonly").objectStore(STORE_RECORDS).getAll()))||[];
  return allRecordsCache;
}
async function allRecords(){
  if (!allRecordsCache.length) await loadRecords();
  return allRecordsCache;
}
async function addFolder(folder){
  const d = await openDB();
  if (!folder.mode) folder.mode = isThreshold()?"threshold":"private";
  if (folder.sortOrder==null){
    const fs = await loadFolders();
    folder.sortOrder = fs.reduce((m,f)=>Math.max(m,f.sortOrder!=null?f.sortOrder:0),0)+1;
  }
  const tx = d.transaction(STORE_FOLDERS,"readwrite");
  const id = await req(tx.objectStore(STORE_FOLDERS).add(folder));
  await txDone(tx);
  return id;
}
async function putFolder(f){
  const d = await openDB();
  const tx = d.transaction(STORE_FOLDERS,"readwrite");
  f.updatedAt = Date.now();
  tx.objectStore(STORE_FOLDERS).put(f);
  await txDone(tx);
}
async function addRecord(r){
  const d = await openDB();
  const tx = d.transaction(STORE_RECORDS,"readwrite");
  await req(tx.objectStore(STORE_RECORDS).add(r));
  await txDone(tx);
}
async function delRecord(id){
  const d = await openDB();
  const tx = d.transaction(STORE_RECORDS,"readwrite");
  tx.objectStore(STORE_RECORDS).delete(id);
  await txDone(tx);
}
async function updateRecord(id,patch){
  const d = await openDB();
  const tx = d.transaction(STORE_RECORDS,"readwrite");
  const s = tx.objectStore(STORE_RECORDS);
  const r = await req(s.get(id));
  if (!r) return;
  Object.assign(r,patch);
  if (patch.price!=null) r.price = patch.price==="" ? "" : String(parsePrice(patch.price));
  s.put(r);
  await txDone(tx);
}
async function getFolder(id){
  const d = await openDB();
  return await req(d.transaction(STORE_FOLDERS,"readonly").objectStore(STORE_FOLDERS).get(id));
}
async function getRecord(id){
  const d = await openDB();
  return await req(d.transaction(STORE_RECORDS,"readonly").objectStore(STORE_RECORDS).get(id));
}
async function deleteFolder(id){
  const d = await openDB();
  const tx = d.transaction([STORE_FOLDERS,STORE_RECORDS],"readwrite");
  tx.objectStore(STORE_FOLDERS).delete(id);
  const cur = tx.objectStore(STORE_RECORDS).index("folderId").openCursor(IDBKeyRange.only(id));
  cur.onsuccess = e => { const c=e.target.result; if(c){c.delete(); c.continue();} };
  await txDone(tx);
}
async function reorder(list){
  const d = await openDB();
  const tx = d.transaction(STORE_FOLDERS,"readwrite");
  const s = tx.objectStore(STORE_FOLDERS);
  for (let i=0;i<list.length;i++){ list[i].sortOrder=i; list[i].updatedAt=Date.now(); s.put(list[i]); }
  await txDone(tx);
}

/* ================= 主题 ================= */
function applyTheme(t){
  t = t||{};
  const bg1=t.bg1||"#f7f9fc", bg2=t.bg2||"#e9edf4", text=t.text||"#2a2f38";
  document.documentElement.style.setProperty("--bg1",bg1);
  document.documentElement.style.setProperty("--bg2",bg2);
  document.documentElement.style.setProperty("--ink",text);
  $("subtitle").textContent = t.subtitle||"本机保存 · 可备份";
  const set=(a,b)=>{ if($(a)) $(a).value=$(b); };
  set("cBg1","cBg1Hex"); $("cBg1").value=bg1; $("cBg1Hex").value=bg1;
  $("cBg2").value=bg2; $("cBg2Hex").value=bg2;
  $("cText").value=text; $("cTextHex").value=text;
  $("subtitleInput").value=t.subtitle||"本机保存 · 可备份";
}
function hexNorm(v){
  v=String(v||"").trim(); if(!v) return null; if(v[0]!=="#") v="#"+v;
  if(/^#[0-9a-fA-F]{6}$/.test(v)) return v.toLowerCase();
  if(/^#[0-9a-fA-F]{3}$/.test(v)) return ("#"+v[1]+v[1]+v[2]+v[2]+v[3]+v[3]).toLowerCase();
  return null;
}

/* ================= 渲染：主页 ================= */
let _lock=false, _queued=false;
async function renderHome(){
  if (_lock){ _queued=true; return; }
  _lock=true;
  try{
    await loadRecords();
    let folders = await loadFolders();
    const recs = allRecordsCache;

    // 状态筛选
    if (filterState.statuses.size){
      const keys = [...filterState.statuses];
      folders = folders.filter(f => keys.includes(f.status||""));
    }
    // 搜索
    const q = searchQuery.trim().toLowerCase();
    if (q){
      folders = folders.filter(f =>
        (f.cardName||"").toLowerCase().includes(q) ||
        (f.meetName||"").toLowerCase().includes(q) ||
        (f.helper||"").toLowerCase().includes(q) ||
        (f.status||"").toLowerCase().includes(q));
    }
    // 排序
    if (sortMode==="name") folders.sort((a,b)=>(a.cardName||"").localeCompare(b.cardName||"","zh"));
    else if (sortMode==="price") folders.sort((a,b)=>parsePrice(b.cardPrice||"")-parsePrice(a.cardPrice||""));
    else if (sortMode==="status") folders.sort((a,b)=>String(a.status||"未出").localeCompare(String(b.status||"未出")));
    else folders.sort((a,b)=>{ const oa=a.sortOrder!=null?a.sortOrder:(a.createdAt||0); const ob=b.sortOrder!=null?b.sortOrder:(b.createdAt||0); return oa-ob; });

    // 助手/会名 高级筛选（基于记录）
    const grid = $("grid");
    grid.innerHTML = "";
    renderStats(folders, recs);

    if (!folders.length){
      grid.innerHTML = '<div class="empty"><div class="big">◌</div>'+(q||filterState.statuses.size?'没有匹配的色卡':labels().empty)+'</div>';
      recalcTotal();
      return;
    }
    const countMap = {};
    recs.forEach(r=>{ countMap[r.folderId]=(countMap[r.folderId]||0)+1; });

    folders.forEach(f=>{
      const card = document.createElement("div");
      card.className="folder-card";
      if (moveStep===2 && f.id===moveSrc) card.classList.add("pick-src");
      const cover = f.coverBase64
        ? `<img class="cover" src="${f.coverBase64}" alt="" loading="lazy">`
        : `<div class="cover-empty"><svg viewBox="0 0 24 24" width="26" height="26" fill="none" stroke="currentColor" stroke-width="1.5"><rect x="3" y="3" width="18" height="18" rx="3"/><circle cx="9" cy="9" r="2"/><path d="M21 15l-5-5L5 21"/></svg></div>`;
      let statusHtml = "";
      if (f.status) statusHtml = `<div class="fstatus" data-id="${f.id}">${esc(f.status)}</div>`;
      card.innerHTML = cover + statusHtml +
        `<div class="dot" data-act="more" data-id="${f.id}">⋯</div>` +
        `<div class="name">${esc(f.cardName)}</div>` +
        `<div class="count">${countMap[f.id]||0} 图</div>`;
      const moreBtn = card.querySelector("[data-act=more]");
      if (moreBtn) moreBtn.onclick = e => { e.stopPropagation(); openFolderActions(f.id); };
      const stTag = card.querySelector(".fstatus");
      if (stTag) stTag.onclick = e => {
        e.stopPropagation();
        $("statusCancelText").textContent = `是否取消「${f.status}」状态？`;
        window._scid = f.id; openMask("statusCancelModal");
      };
      card.onclick = () => {
        if (moveStep===1){ moveSrc=f.id; moveStep=2; renderHome(); }
        else if (moveStep===2){ if (f.id===moveSrc){ appAlert("请选另一张目标卡片"); return; } window._dstId=f.id; $("moveOk").style.display=""; setMoveTip("已选好两张，点确定互换位置"); }
        else openFolder(f.id);
      };
      grid.appendChild(card);
    });
    recalcTotal();
  } finally {
    _lock=false; if (_queued){ _queued=false; requestAnimationFrame(renderHome); }
  }
}

function renderStats(folders, recs){
  const bar = $("statsBar");
  const ids = new Set(folders.map(f=>f.id));
  const cnt = recs.filter(r=>ids.has(r.folderId)).length;
  const sold = folders.filter(f=>f.status===labels().sold||f.status==="已完结").length;
  const pending = folders.filter(f=>f.status===labels().pending||f.status==="待退款").length;
  if (isThreshold()){
    const refund = folders.filter(f=>f.status==="待退款"||f.status==="已退款").length;
    bar.innerHTML = `<div class="stat"><div class="v">${folders.length}</div><div class="l">入会总数</div></div>
      <div class="stat"><div class="v warn">${refund}</div><div class="l">退款数</div></div>
      <div class="stat"><div class="v ok">${sold}</div><div class="l">完结数</div></div>`;
  } else {
    bar.innerHTML = `<div class="stat"><div class="v">${folders.length}</div><div class="l">色卡</div></div>
      <div class="stat"><div class="v">${cnt}</div><div class="l">图片</div></div>
      <div class="stat"><div class="v ok">${sold}</div><div class="l">已出</div></div>
      <div class="stat"><div class="v warn">${pending}</div><div class="l">待出</div></div>`;
  }
}

async function recalcTotal(){
  await loadFolders();
  await loadRecords();
  let folders = allFoldersCache;
  const ids = new Set(folders.map(f=>f.id));
  const recs = allRecordsCache.filter(r=>ids.has(r.folderId));
  if (isThreshold() && amountFilter==="yearForever"){
    folders = folders.filter(f=>f.meetName==="年会"||f.meetName==="永会");
  }
  let total;
  if (isThreshold()){
    total = folders.reduce((s,f)=> s + parsePrice(f.price || recs.filter(r=>r.folderId===f.id).reduce((a,r)=>a+parsePrice(r.price),0)),0);
  } else {
    total = recs.reduce((s,r)=>s+parsePrice(r.price),0) + folders.reduce((s,f)=>s+parsePrice(f.cardPrice),0);
  }
  $("totalValue").textContent = fmtMoney(total);
  $("totalLabel").textContent = (isThreshold()&&amountFilter==="yearForever")?"年永金额":"总金额";
}

/* ================= 移动排序 ================= */
function setMoveTip(t){ $("moveTip").textContent=t; }
function exitMove(){ moveStep=0; moveSrc=null; window._dstId=null; $("moveOk").style.display="none"; $("moveBar").classList.remove("show"); renderHome(); }

/* ================= 详情页 ================= */
async function openFolder(folderId){
  const f = await getFolder(folderId);
  if (!f) return;
  window._curFolder = folderId;
  multiSelect=false; selectedIds.clear(); coverPickMode=false;
  $("detailTitle").textContent = f.cardName||"色卡详情";
  const recs = (await allRecords()).filter(r=>r.folderId===folderId).sort((a,b)=>(b.time||0)-(a.time||0));
  let filtered = recs;
  if (folderMeetFilter.size) filtered = filtered.filter(r=>folderMeetFilter.has(r.meetName||f.meetName||""));
  const meets = [...new Set(recs.map(r=>r.meetName||f.meetName||"").filter(Boolean))];
  const total = Math.round(filtered.reduce((s,r)=>s+parsePrice(r.price),0)*100)/100;
  const cardPrice = parsePrice(f.cardPrice);

  let html = `<div class="dt-title">${esc(f.cardName)}</div>
    <div>
      <span class="muted-action" id="btnMeetFilter">筛选会名（${meets.length}）</span>
      <span class="muted-action" id="btnMulti">${multiSelect?"退出多选":"多选"}</span>
    </div>
    <div class="multi-bar" id="multiBar">
      <button id="mSave">保存图</button><button id="mEdit">编辑</button><button id="mDel" class="danger">删除</button><button id="mCancel">取消</button>
    </div>
    <div class="surface meta-card"><span class="k">会名</span>${esc(meets.join("、")||f.meetName||"—")}</div>
    <div class="surface meta-card"><span class="k">张数</span>${filtered.length} 张</div>
    <div class="surface meta-card row"><span><span class="k">裸卡价格</span></span><span class="val" id="cvPrice">${cardPrice?fmtMoney(cardPrice):"点击填写"}</span></div>
    <div class="surface meta-card row"><span><span class="k">色卡风格</span></span><span class="val" id="cvStyle">${esc(f.cardStyle||"点击填写")}</span></div>
    <div class="surface meta-card row"><span><span class="k">本页合计</span></span><span class="val">${fmtMoney(total)}</span></div>
    <div class="sec-label">私调图片</div><div class="rec-list">`;
  if (!filtered.length) html += `<div class="empty" style="padding:30px 0">暂无图片</div>`;
  filtered.forEach(r=>{
    html += `<div class="rec-wrap">
      <input type="checkbox" class="cb" data-id="${r.id}" ${selectedIds.has(r.id)?"checked":""}>
      <div class="rec">
        <img class="thumb" src="${r.thumbBase64||r.imgBase64}" data-id="${r.id}" data-folder="${r.folderId}" data-cover="${f.id}" data-coverpic="${r.imgBase64?'1':''}">
        <div class="body"><div class="n">${r.price?fmtMoney(parsePrice(r.price)):"私调图"}</div>

async function handleFiles(files){
  const imgs = [...files].filter(f=>f.type.startsWith("image/"));
  if (!imgs.length) return;
  showLoading("正在处理图片…","共 "+imgs.length+" 张，请稍候");
  try{
    pendingImages=[];
    for (let i=0;i<imgs.length;i++){
      const orig = await compressImage(imgs[i],1280,0.78);
      const thumb = await makeThumb(orig,110);
      pendingImages.push({orig,thumb,cover:thumb});
      if (i%2===1) await new Promise(r=>setTimeout(r,0));
    }
    const dz = $("dropzone");
    dz.classList.add("grid"); $("dzInner").style.display="none";
    dz.innerHTML = pendingImages.map(p=>`<img src="${p.thumb}">`).join("");
  } finally { hideLoading(); }
}

async function saveImport(){
  let cardName = $("fCardName").value.trim();
  let meetName = $("fMeet").value.trim();
  const priceRaw = $("fPrice").value.trim();
  const helper = $("fHelper").value.trim();
  const price = parsePrice(priceRaw);
  const existingId = $("fExisting").value;

  if (isThreshold()){
    meetName = $("fType").value||pendingType||"";
    if (!existingId && !cardName){ appAlert("请填写会名"); return; }
    if (!meetName){ appAlert("请选择类别"); return; }
  } else {
    if (!existingId && !cardName){ appAlert("请填写色卡名"); return; }
  }
  if (!pendingImages.length){ appAlert("请先选择图片"); return; }

  $("btnSaveImport").disabled = true;
  showLoading(isThreshold()?"正在保存入会…":"正在保存私调…", pendingImages.length+" 张图");
  try{
    let folderId;
    let noteName = cardName;
    if (existingId){
      folderId = Number(existingId);
      const f = await getFolder(folderId);
      if (f){
        noteName = f.cardName || noteName;
        if (!f.coverBase64 && pendingImages[0]) f.coverBase64 = pendingImages[0].cover;
        if (meetName && isThreshold()) f.meetName = meetName;
        await putFolder(f);
      }
    } else {
      folderId = await addFolder({
        cardName, meetName, price:String(price), helper,
        coverBase64: pendingImages[0]?pendingImages[0].cover:"",
        createdAt:Date.now(), updatedAt:Date.now()
      });
    }
    for (const p of pendingImages){
      await addRecord({
        folderId, imgBase64:p.orig, thumbBase64:p.thumb,
        note:noteName, price:String(price), meetName, helper, time:Date.now()
      });
    }
    vibrate();
    resetImport(); showPage("pageHome"); renderHome();
  } catch(e){ console.error(e); appAlert("保存失败，请重试"); }
  finally { hideLoading(); $("btnSaveImport").disabled=false; }
}

async function doExport(){
  const ids = [...document.querySelectorAll(".exp-cb:checked")].map(c=>Number(c.dataset.id));
  closeMask("exportModal");
  if (!ids.length){ appAlert("请至少选一个"); return; }
  showLoading("正在打包备份…","数据较多请耐心等待");
  try{
    await loadFolders(); await loadRecords();
    const idSet = new Set(ids);
    const folders = allFoldersCache.filter(f=>idSet.has(f.id));
    const records = allRecordsCache.filter(r=>idSet.has(r.folderId));
    const profile = await loadProfile();
    const payload = { version:2, app:"私调记录", exportedAt:new Date().toISOString(),
      profile:{name:profile.name,theme:profile.theme,avatar:profile.avatar,settingsIcon:profile.settingsIcon,appMode:profile.appMode},
      folders, records };
    const blob = new Blob([JSON.stringify(payload)],{type:"application/json;charset=utf-8"});
    const name = "私调记录备份_"+(profile.name||"backup")+".json";
    hideLoading();
    await saveImage(blob, name, true);
  } catch(e){ console.error(e); hideLoading(); appAlert("导出失败："+(e.message||e)); }
}
async function doImportFile(file){
  showLoading("正在读取备份…","请稍候");
  try{
    const data = JSON.parse(await file.text());
    if (!data || !Array.isArray(data.folders) || !Array.isArray(data.records)){ hideLoading(); appAlert("备份文件格式不正确"); return; }
    const mode = await appConfirm(`备份包含 ${data.folders.length} 个色卡、${data.records.length} 张图。\n\n确定 = 完全替换（清空本机现有数据后导入）\n取消 = 追加导入（保留现有，重复色卡名跳过）`);
    if (mode){
      // 完全替换
      const d = await openDB();
      const tx = d.transaction([STORE_FOLDERS,STORE_RECORDS],"readwrite");
      tx.objectStore(STORE_FOLDERS).clear(); tx.objectStore(STORE_RECORDS).clear();
      await txDone(tx);
    }
    // 追加 / 写入
    const existing = await loadFolders();
    const existingNames = new Set(existing.map(f=>f.cardName+"|"+(f.mode||"private")));
    const d = await openDB();
    const tx = d.transaction([STORE_FOLDERS,STORE_RECORDS],"readwrite");
    const fs = tx.objectStore(STORE_FOLDERS), rs = tx.objectStore(STORE_RECORDS);
    const idMap = {};
    for (const f of data.folders){
      const key = (f.cardName||"")+"|"+(f.mode||"private");
      if (!mode && existingNames.has(key)) continue; // 追加模式跳过重复
      const copy = {...f}; delete copy.id;
      const nid = await req(fs.add(copy));
      idMap[f.id] = nid;
    }
    for (const r of data.records){
      if (idMap[r.folderId]==null) continue;
      const copy = {...r}; delete copy.id; copy.folderId = idMap[r.folderId];
      await req(rs.add(copy));
    }
    await txDone(tx);
    if (data.profile){
      await saveProfile({name:data.profile.name, avatar:data.profile.avatar||"", theme:data.profile.theme||null, settingsIcon:data.profile.settingsIcon||"", appMode:data.profile.appMode});
      if (data.profile.name) currentName = data.profile.name;
      if (data.profile.appMode) appMode = data.profile.appMode;
    }
    hideLoading();
    applyModeLabels(); await renderHome();
    appAlert("导入成功");
  } catch(e){ console.error(e); hideLoading(); appAlert("导入失败，请检查文件"); }
}

/* CSV 导出（记账） */
async function exportCsv(){
  await loadFolders(); await loadRecords();
  const rows = [["色卡名","会名/类别","助手/备注","单张价格","状态","图片张数","更新时间"]];
  allFoldersCache.forEach(f=>{
    const cnt = allRecordsCache.filter(r=>r.folderId===f.id).length;
    rows.push([f.cardName||"", f.meetName||"", f.helper||"", f.cardPrice||"", f.status||"", cnt, new Date(f.updatedAt||Date.now()).toLocaleDateString("zh-CN")]);
  });
  const csv = "\uFEFF" + rows.map(r=>r.map(c=>`"${String(c).replace(/"/g,'""')}"`).join(",")).join("\r\n");
  const blob = new Blob([csv],{type:"text/csv;charset=utf-8"});
  await saveImage(blob,"私调记录记账.csv",true);
}

/* 保存图片/文件到设备 */
async function saveImage(source, filename, isBlob){
  let blob;
  if (isBlob) blob = source;
  else { const res = await fetch(source); blob = await res.blob(); }
  if (navigator.canShare){
    try{
      const file = new File([blob], filename, {type:blob.type||"application/octet-stream"});
      if (navigator.canShare({files:[file]})){ await navigator.share({files:[file]}); return; }
    }catch(e){ if(e&&e.name==="AbortError") return; }
  }
  const url = URL.createObjectURL(blob);
  const a = document.createElement("a"); a.href=url; a.download=filename;
  document.body.appendChild(a); a.click(); a.remove();
  setTimeout(()=>URL.revokeObjectURL(url),4000);
}

  $("searchInput").oninput = ()=>{ searchQuery=$("searchInput").value; renderHome(); };
  $("sortSelect").onchange = ()=>{ sortMode=$("sortSelect").value; renderHome(); };
  $("totalLabel").style.cursor="pointer";
  $("totalLabel").title="门槛模式下点击切换：全部 / 年永";
  $("totalLabel").onclick = ()=>{ if(!isThreshold()) return; amountFilter = amountFilter==="all"?"yearForever":"all"; recalcTotal(); };
  $("btnFilter").onclick = ()=>openFilter();
  $("fReset").onclick = ()=>{ filterState={statuses:new Set(),meets:new Set(),helpers:new Set()}; closeMask("filterModal"); renderHome(); };
  $("fApply").onclick = ()=>{ closeMask("filterModal"); renderHome(); };
  $("btnImport").onclick = ()=>enterImport();
  $("btnMove").onclick = ()=>{ if(moveStep>0){exitMove();return;} moveStep=1; $("moveBar").classList.add("show"); setMoveTip("① 点选要移动的色卡"); renderHome(); };
  $("moveCancel").onclick = ()=>exitMove();
  $("moveOk").onclick = async ()=>{
    if (moveSrc==null || window._dstId==null){ appAlert("请选择两张卡片"); return; }
    const fs = await loadFolders();
    const i=fs.findIndex(f=>f.id===moveSrc), j=fs.findIndex(f=>f.id===window._dstId);
    if (i<0||j<0){ appAlert("未找到卡片"); return; }
    [fs[i],fs[j]]=[fs[j],fs[i]];
    await reorder(fs); moveStep=0; moveSrc=null; window._dstId=null; $("moveOk").style.display="none"; $("moveBar").classList.remove("show"); renderHome();
  };

  // 导入
  $("backFromImport").onclick = ()=>showPage("pageHome");
  $("dropzone").onclick = ()=>$("importFiles").click();
  $("importFiles").onchange = e=>handleFiles(e.target.files);
  ["dragover","dragleave","drop"].forEach(ev=>{
    const dz=$("dropzone");
    dz.addEventListener(ev, e=>{
      e.preventDefault();
      if (ev==="dragover") dz.classList.add("drag");
      else { dz.classList.remove("drag"); if(ev==="drop") handleFiles(e.dataTransfer.files); }
    });
  });
  document.addEventListener("paste", e=>{
    if (!$("pageImport").classList.contains("active")) return;
    const files=[...(e.clipboardData&&e.clipboardData.files||[])].filter(f=>f.type.startsWith("image/"));
    if (files.length) handleFiles(files);
  });
  $("btnSaveImport").onclick = ()=>saveImport();

  // 详情
  $("backFromDetail").onclick = ()=>{ showPage("pageHome"); renderHome(); };

  // 色卡操作
  $("faCancel").onclick = ()=>closeMask("folderActionModal");
  $("faUp").onclick = async ()=>{ const fs=await loadFolders(); const i=fs.findIndex(f=>f.id===window._afid); if(i>0){[fs[i-1],fs[i]]=[fs[i],fs[i-1]]; await reorder(fs);} closeMask("folderActionModal"); renderHome(); };
  $("faDown").onclick = async ()=>{ const fs=await loadFolders(); const i=fs.findIndex(f=>f.id===window._afid); if(i>=0&&i<fs.length-1){[fs[i+1],fs[i]]=[fs[i],fs[i+1]]; await reorder(fs);} closeMask("folderActionModal"); renderHome(); };
  $("faSold").onclick = async ()=>{ const f=await getFolder(window._afid); if(f){f.status=labels().sold; await putFolder(f);} closeMask("folderActionModal"); renderHome(); };
  $("faPending").onclick = async ()=>{ const f=await getFolder(window._afid); if(f){f.status=labels().pending; await putFolder(f);} closeMask("folderActionModal"); renderHome(); };
  $("faRefund").onclick = async ()=>{ const f=await getFolder(window._afid); if(f){f.status="已退款"; await putFolder(f);} closeMask("folderActionModal"); renderHome(); };
  $("faDelete").onclick = async ()=>{ closeMask("folderActionModal"); if(!await appConfirm("删除该色卡？里面图片一并删除。"))return; await deleteFolder(window._afid); renderHome(); };
  $("faRename").onclick = async ()=>{ const f=await getFolder(window._afid); closeMask("folderActionModal"); $("renameInput").value=f?f.cardName:""; openMask("renameModal"); };
  $("renameCancel").onclick = ()=>closeMask("renameModal");
  $("renameOk").onclick = async ()=>{ const v=$("renameInput").value.trim(); if(!v){appAlert("名称不能为空");return;} const f=await getFolder(window._afid); if(f){f.cardName=v; await putFolder(f);} closeMask("renameModal"); renderHome(); };

  // 状态取消
  $("scNo").onclick = ()=>closeMask("statusCancelModal");
  $("scYes").onclick = async ()=>{ const f=await getFolder(window._scid); if(f){f.status=""; await putFolder(f);} closeMask("statusCancelModal"); renderHome(); };

  // 金额 / 风格
  $("cpCancel").onclick = ()=>closeMask("cardPriceModal");
  $("cpOk").onclick = async ()=>{ const f=await getFolder(window._cpf); if(f){f.cardPrice=$("cardPriceInput").value.trim(); await putFolder(f);} closeMask("cardPriceModal"); openFolder(window._cpf); };
  $("csCancel").onclick = ()=>closeMask("cardStyleModal");
  $("csOk").onclick = async ()=>{ const f=await getFolder(window._csf); if(f){f.cardStyle=$("cardStyleInput").value.trim(); await putFolder(f);} closeMask("cardStyleModal"); openFolder(window._csf); };

  // 详情内会名筛选
  $("fmReset").onclick = ()=>{ folderMeetFilter=new Set(); closeMask("folderMeetModal"); if(window._curFolder) openFolder(window._curFolder); };
  $("fmApply").onclick = ()=>{ closeMask("folderMeetModal"); if(window._curFolder) openFolder(window._curFolder); };

  // 编辑
  $("eCancel").onclick = ()=>{ closeMask("editModal"); };
  $("eSave").onclick = async ()=>{
    const folderId = Number($("eFolderId").value);
    const price=$("ePrice").value.trim(), meet=$("eMeet").value.trim(), helper=$("eHelper").value.trim(), note=$("eNote").value.trim();
    if ($("eRecId").value){
      await updateRecord(Number($("eRecId").value),{price,meetName:meet,helper,note});
    } else {
      for (const id of selectedIds){
        const patch={};
        if(price!=="")patch.price=price; if(meet!=="")patch.meetName=meet; if(helper!=="")patch.helper=helper; if(note!=="")patch.note=note;
        if(Object.keys(patch).length) await updateRecord(id,patch);
      }
      selectedIds.clear(); multiSelect=false;
    }
    closeMask("editModal"); openFolder(folderId); renderHome();
  };
  $("eSetCover").onclick = async ()=>{
    const rid=Number($("eRecId").value); if(!rid)return;
    const r=await getRecord(rid); if(!r||!r.imgBase64){appAlert("无图片");return;}
    await putFolderCover(Number($("eFolderId").value), r.imgBase64);
    closeMask("editModal"); appAlert("已设为封面"); openFolder(Number($("eFolderId").value)); renderHome();
  };

  // 灯箱
  $("lbClose").onclick = ()=>{ $("lightbox").classList.remove("show"); refreshLock(); };
  $("lightbox").onclick = e=>{ if(e.target.id==="lightbox"){ $("lightbox").classList.remove("show"); refreshLock(); } };
  $("lbSave").onclick = async ()=>{ const src=$("lbImg").src; if(!src)return; await saveImage(src,"私调图.jpg"); };

  // 点遮罩关闭
  document.querySelectorAll(".mask").forEach(m=>{
    m.addEventListener("click", e=>{ if(e.target===m) m.classList.remove("show"); refreshLock(); });
  });
  // 禁止图片长按/拖拽
  document.addEventListener("contextmenu", e=>{ if(e.target.tagName==="IMG") e.preventDefault(); });
}

async function saveTheme(){
  await saveProfile({theme:{bg1:$("cBg1").value,bg2:$("cBg2").value,text:$("cText").value,subtitle:$("subtitleInput").value.trim()||"本机保存 · 可备份"}});
  applyTheme(await (await loadProfile()).theme||{});
}

function renderAvatar(b64){
  const im=$("avatarImg"), ph=$("avatarBox").querySelector("svg");
  if (b64){ im.src=b64; im.style.display="block"; if(ph) ph.style.display="none"; }
  else { im.style.display="none"; if(ph) ph.style.display=""; }
}
function renderIcon(b64){
  const im=$("settingsIconImg");
  if (b64){ im.src=b64; im.style.display="block"; } else im.style.display="none";
}

function enterShell(){
  $("nameScreen").style.display="none";
  $("shell").classList.add("show");
  applyModeLabels();
  renderHome();
}

/* ================= 初始化 ================= */
(async function init(){
  bind();
  try{
    await openDB();
    const p = await loadProfile();
    if (p.theme) applyTheme(p.theme);
    if (p.avatar) renderAvatar(p.avatar);
    if (p.settingsIcon) renderIcon(p.settingsIcon);
    if (p.appMode) appMode = p.appMode;
    if (p.name){
      currentName = p.name;
      $("nameInput").style.display="none";
      $("screenTitle").textContent = currentName + labels().titleSuffix;
      $("screenTip").textContent = "欢迎回来";
      $("confirmName").textContent = "进入";
    }
    applyModeLabels();
  }catch(e){ console.error(e); $("screenTip").textContent="本地存储初始化失败"; }
})();

/* PWA：仅在 http(s) 下注册 manifest / SW */
(function(){
  if (/^https?:$/.test(location.protocol)){
    try{
      const l=document.createElement("link"); l.rel="manifest"; l.href="manifest.webmanifest"; document.head.appendChild(l);
      if ("serviceWorker" in navigator) window.addEventListener("load", ()=>navigator.serviceWorker.register("sw.js").catch(()=>{}));
    }catch(e){}
  }
})();
</script>
</body>
</html>
