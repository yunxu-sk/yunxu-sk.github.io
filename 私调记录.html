<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="referrer" content="no-referrer">
<meta name="theme-color" content="#5c6f9e">
<meta name="description" content="色卡/私调图管理：图集展示、导入、筛选、编辑、备份">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="私调记录">
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="icon-180.png">
<title>私调记录</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Cdefs%3E%3ClinearGradient id='g' x1='0' y1='0' x2='1' y2='1'%3E%3Cstop offset='0' stop-color='%239fb0d4'/%3E%3Cstop offset='1' stop-color='%235c6f9e'/%3E%3C/linearGradient%3E%3C/defs%3E%3Crect width='64' height='64' rx='16' fill='url(%23g)'/%3E%3Crect x='12' y='16' width='40' height='32' rx='6' fill='rgba(255,255,255,0.92)'/%3E%3Ccircle cx='22' cy='26' r='3.5' fill='%235c6f9e'/%3E%3Cpath d='M12 42l12-12 8 8 6-6 14 14v4a4 4 0 0 1-4 4H16a4 4 0 0 1-4-4z' fill='%23a9b8d8'/%3E%3C/svg%3E">
<style>
/* ============ 基础 ============ */
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
:root{
  --bg1:#eef0f4; --bg2:#e2e6ec;
  --glass:rgba(255,255,255,0.5);
  --glass-strong:rgba(255,255,255,0.66);
  --glass-border:rgba(255,255,255,0.72);
  --text:#333a47; --muted:#8a919d;
  --btn:#ffffff; --btn-text:#465064;
  --accent:#5c6f9e; --accent-soft:rgba(92,111,158,0.16);
  --danger:#cf4a45; --danger-soft:rgba(207,74,69,0.12);
  --ok:#2e8b68; --ok-soft:rgba(46,139,104,0.14);
  --warn:#a9711e; --warn-soft:rgba(169,113,30,0.14);
  --shadow-sm:0 2px 10px rgba(60,70,90,0.08), inset 0 1px 0 rgba(255,255,255,0.6);
  --shadow:0 14px 40px rgba(60,70,90,0.14), inset 0 1px 0 rgba(255,255,255,0.55);
  --shadow-lg:0 24px 60px rgba(40,55,90,0.24), inset 0 1px 0 rgba(255,255,255,0.65);
  --radius:20px; --blur:26px;
}
html{-webkit-text-size-adjust:100%}
html,body{
  width:100%;min-height:100%;
  overscroll-behavior:none;
  background:
    radial-gradient(ellipse 80% 50% at 10% -10%, rgba(255,255,255,0.95) 0%, transparent 55%),
    radial-gradient(ellipse 70% 45% at 95% 5%, rgba(200,214,235,0.5) 0%, transparent 50%),
    radial-gradient(ellipse 60% 40% at 50% 100%, rgba(178,190,210,0.35) 0%, transparent 45%),
    linear-gradient(165deg, var(--bg1) 0%, var(--bg2) 55%, #d9dde4 100%);
  color:var(--text);
  font-family:-apple-system,BlinkMacSystemFont,"PingFang SC","HarmonyOS Sans SC","Microsoft YaHei",sans-serif;
  overflow-x:hidden;
  touch-action:manipulation;
}
body.modal-lock{overflow:hidden;touch-action:none}
button,input,textarea{font:inherit;color:inherit}
button{cursor:pointer;border:none;background:none}
input,textarea{outline:none}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px;border-radius:6px}
[hidden]{display:none !important}
svg{display:block}
.num{font-variant-numeric:tabular-nums}

/* ============ 图标 ============ */
.icon{width:20px;height:20px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round;flex-shrink:0}
.icon-sm{width:16px;height:16px}
.icon-lg{width:26px;height:26px}
.icon-fill{fill:currentColor;stroke:none}

/* ============ 布局壳 ============ */
.app{min-height:100vh;min-height:100dvh;display:flex;align-items:stretch;justify-content:center;padding:0}
.shell-wrap{width:100%;max-width:480px;min-height:100vh;min-height:100dvh;display:flex;flex-direction:column}
.glass{
  background:linear-gradient(145deg, rgba(255,255,255,0.5) 0%, rgba(255,255,255,0.2) 45%, rgba(255,255,255,0.32) 100%);
  border:1px solid rgba(255,255,255,0.55);
  backdrop-filter:blur(var(--blur)) saturate(1.35);
  -webkit-backdrop-filter:blur(var(--blur)) saturate(1.35);
  box-shadow:0 18px 50px rgba(60,65,75,0.14), 0 4px 12px rgba(60,65,75,0.07), inset 0 1px 0 rgba(255,255,255,0.65);
  flex:1;display:flex;flex-direction:column;min-height:100vh;min-height:100dvh;position:relative;
}
.glass::before{
  content:"";pointer-events:none;position:absolute;inset:0;border-radius:inherit;
  background:linear-gradient(180deg, rgba(255,255,255,0.35) 0%, transparent 30%);
  opacity:.65;z-index:0;
}
.glass > *{position:relative;z-index:1}

@media (min-width:500px){
  .app{padding:18px 14px}
  .shell-wrap{min-height:calc(100vh - 36px);border-radius:30px;overflow:hidden}
  .glass{min-height:calc(100vh - 36px);border-radius:30px}
}

/* ============ 通用控件 ============ */
.btn{
  display:inline-flex;align-items:center;justify-content:center;gap:6px;
  border:1px solid var(--glass-border);
  background:linear-gradient(160deg, var(--btn) 0%, rgba(255,255,255,0.35) 100%);
  color:var(--btn-text);
  font-size:13px;font-weight:600;
  padding:11px 14px;border-radius:14px;min-height:42px;
  backdrop-filter:blur(14px) saturate(1.2);-webkit-backdrop-filter:blur(14px) saturate(1.2);
  box-shadow:0 6px 18px rgba(60,80,120,0.1), inset 0 1px 0 rgba(255,255,255,0.7);
  transition:transform .12s ease, box-shadow .2s ease, opacity .2s ease;
  user-select:none;-webkit-user-select:none;
}
.btn:active{transform:scale(.97);opacity:.9}
.btn:disabled{opacity:.45;cursor:not-allowed}
.btn-block{width:100%}
.btn-primary{
  background:linear-gradient(160deg, var(--btn) 0%, rgba(255,255,255,0.72) 100%);
  border-color:rgba(255,255,255,0.85);
}
.btn-ghost{background:rgba(255,255,255,0.35);border-color:rgba(255,255,255,0.5)}
.btn-danger{color:var(--danger)}
.btn-ok{color:var(--ok)}

.chip{
  display:inline-flex;align-items:center;gap:5px;
  font-size:12.5px;padding:8px 13px;border-radius:999px;min-height:36px;
  background:rgba(255,255,255,0.72);border:1px solid var(--glass-border);
  color:var(--text);cursor:pointer;transition:all .18s ease;
}
.chip:active{transform:scale(.96)}
.chip.on{
  background:var(--accent-soft);border-color:rgba(92,111,158,0.4);
  color:var(--accent);font-weight:600;
}

/* ============ 圈名页 ============ */
.name-screen{
  padding:48px 28px 32px;text-align:center;flex:1;
  display:flex;flex-direction:column;align-items:center;justify-content:center;
  min-height:100vh;min-height:100dvh;
}
.name-logo{
  width:76px;height:76px;border-radius:24px;margin-bottom:22px;
  display:flex;align-items:center;justify-content:center;
  background:linear-gradient(160deg, rgba(255,255,255,0.75), rgba(255,255,255,0.35));
  border:1px solid rgba(255,255,255,0.7);
  box-shadow:var(--shadow), inset 0 1px 0 rgba(255,255,255,0.8);
  color:var(--accent);
}
.name-logo svg{width:36px;height:36px}
.name-screen h1{font-size:clamp(21px,5.5vw,25px);font-weight:700;margin-bottom:8px;letter-spacing:.02em}
.name-screen .tip{color:var(--muted);font-size:13px;margin-bottom:24px;line-height:1.6}
.name-field{
  width:100%;display:flex;align-items:center;gap:10px;
  border:1px solid var(--glass-border);
  background:var(--glass-strong);border-radius:16px;
  padding:4px 14px;margin-bottom:14px;
  box-shadow:var(--shadow-sm);
}
.name-field .icon{color:var(--muted)}
.name-field input{
  flex:1;min-width:0;border:none;background:transparent;
  padding:12px 0;font-size:16px;min-height:46px;color:var(--text);
}
.name-field:focus-within{border-color:rgba(92,111,158,0.45);box-shadow:0 0 0 3px var(--accent-soft)}

/* ============ 主壳 ============ */
.shell{display:none;overflow:hidden;flex:1;min-height:100vh;min-height:100dvh;flex-direction:column}
.shell.show{display:flex;flex-direction:column}

.topbar{
  display:flex;align-items:center;gap:11px;
  padding:14px 14px 12px;
  padding-top:max(14px, env(safe-area-inset-top));
  border-bottom:1px solid rgba(255,255,255,0.28);
  background:linear-gradient(180deg, rgba(255,255,255,0.24), transparent);
}
.avatar-wrap{
  width:44px;height:44px;border-radius:50%;overflow:hidden;
  background:rgba(255,255,255,0.55);border:1.5px solid var(--glass-border);
  flex-shrink:0;cursor:pointer;display:flex;align-items:center;justify-content:center;
  color:var(--muted);
}
.avatar-wrap img{width:100%;height:100%;object-fit:cover;display:block}
.upload-input{display:none}
.title-area{flex:1;min-width:0}
.main-title{font-size:15px;font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.subtitle{font-size:11px;color:var(--muted);margin-top:2px}
.topbar-total{text-align:right;margin-right:2px;flex-shrink:0}
.topbar-total .t-label{font-size:10px;color:var(--muted);line-height:1.2}
.topbar-total .t-value{font-size:14px;font-weight:700;line-height:1.3}
.icon-btn{
  width:40px;height:40px;border-radius:14px;
  background:linear-gradient(160deg, rgba(255,255,255,0.55), rgba(255,255,255,0.22));
  border:1px solid rgba(255,255,255,0.6);
  display:flex;align-items:center;justify-content:center;
  color:var(--btn-text);flex-shrink:0;position:relative;overflow:hidden;
  backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);
  box-shadow:0 6px 16px rgba(60,80,120,0.1), inset 0 1px 0 rgba(255,255,255,0.65);
  transition:transform .12s ease;
}
.icon-btn:active{transform:scale(.94)}
.settings-icon-img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;display:block}

/* 统计条 */
.stats-strip{
  display:grid;grid-template-columns:repeat(4,1fr);gap:8px;
  padding:12px 14px 4px;
}
.stat-tile{
  background:linear-gradient(160deg, rgba(255,255,255,0.55), rgba(255,255,255,0.22));
  border:1px solid rgba(255,255,255,0.6);
  border-radius:16px;padding:10px 6px;text-align:center;
  box-shadow:var(--shadow-sm);
  backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px);
}
.stat-tile .s-label{font-size:10.5px;color:var(--muted);margin-bottom:3px;letter-spacing:.03em}
.stat-tile .s-value{font-size:17px;font-weight:700;line-height:1.2}
.stat-tile .s-value small{font-size:11px;font-weight:600;color:var(--muted);margin-left:1px}

/* 搜索 */
.search-bar{padding:8px 14px 2px}
.search-field{
  display:flex;align-items:center;gap:9px;
  background:rgba(255,255,255,0.55);border:1px solid var(--glass-border);
  border-radius:14px;padding:2px 12px;
  box-shadow:var(--shadow-sm);
  transition:border-color .18s ease, box-shadow .18s ease;
}
.search-field:focus-within{border-color:rgba(92,111,158,0.45);box-shadow:0 0 0 3px var(--accent-soft)}
.search-field .icon{color:var(--muted)}
.search-field input{
  flex:1;min-width:0;border:none;background:transparent;
  padding:11px 0;font-size:15px;min-height:42px;color:var(--text);
}
.search-clear{
  width:22px;height:22px;border-radius:50%;flex-shrink:0;
  display:flex;align-items:center;justify-content:center;
  color:var(--muted);background:rgba(140,150,170,0.18);
}
.search-clear .icon{width:13px;height:13px}

/* 工具栏 */
.toolbar{
  display:flex;align-items:center;gap:9px;
  padding:10px 14px 8px;
  position:sticky;top:0;z-index:6;
}
.tool-btn{flex:1;min-height:42px;font-size:13px}
.import-btn{flex-shrink:0;min-height:42px;font-size:13px}

/* 状态筛选行 */
.status-row{display:flex;gap:8px;padding:2px 14px 4px;overflow-x:auto;scrollbar-width:none}
.status-row::-webkit-scrollbar{display:none}
.status-row .chip{flex-shrink:0}

/* 页面切换 */
.page{display:none;padding:4px 14px calc(20px + env(safe-area-inset-bottom));flex:1;overflow-y:auto;-webkit-overflow-scrolling:touch}
.page.active{display:block;animation:pageIn .26s ease both}
@keyframes pageIn{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}

.page-head{display:flex;align-items:center;gap:10px;padding:6px 0 14px}
.back-btn{
  width:40px;height:40px;border-radius:13px;flex-shrink:0;
  background:linear-gradient(160deg, rgba(255,255,255,0.55), rgba(255,255,255,0.22));
  border:1px solid var(--glass-border);
  display:flex;align-items:center;justify-content:center;color:var(--btn-text);
  box-shadow:var(--shadow-sm);
}
.page-head h2{font-size:15px;font-weight:700}
.page-head h2:empty{display:none}
.page-head .spacer{flex:1}

/* ============ 文件夹网格 ============ */
.folder-grid{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.folder-card{
  position:relative;
  background:linear-gradient(160deg, rgba(255,255,255,0.55), rgba(255,255,255,0.2));
  border:1px solid rgba(255,255,255,0.62);
  border-radius:20px;overflow:hidden;cursor:pointer;
  box-shadow:var(--shadow);
  backdrop-filter:blur(20px) saturate(1.3);-webkit-backdrop-filter:blur(20px) saturate(1.3);
  transform:translateZ(0);transition:transform .16s ease, box-shadow .2s ease;
}
.folder-card:active{transform:scale(.975)}
.folder-cover{width:100%;aspect-ratio:1;object-fit:cover;display:block;background:rgba(225,230,238,0.65)}
.folder-cover-empty{
  width:100%;aspect-ratio:1;display:flex;flex-direction:column;gap:6px;
  align-items:center;justify-content:center;color:var(--muted);
  background:linear-gradient(160deg, rgba(235,239,245,0.7), rgba(220,226,236,0.5));
}
.folder-cover-empty svg{width:30px;height:30px;opacity:.7}
.folder-cover-empty span{font-size:11px;opacity:.75}
.folder-name-tag{
  position:absolute;left:8px;bottom:8px;z-index:2;
  max-width:calc(100% - 16px);
  padding:6px 10px;border-radius:12px;
  background:linear-gradient(160deg, rgba(255,255,255,0.72), rgba(255,255,255,0.38));
  border:1px solid rgba(255,255,255,0.75);
  backdrop-filter:blur(14px) saturate(1.2);-webkit-backdrop-filter:blur(14px) saturate(1.2);
  box-shadow:0 4px 12px rgba(50,70,110,0.1), inset 0 1px 0 rgba(255,255,255,0.8);
  font-size:13.5px;font-weight:700;letter-spacing:.02em;
  color:var(--text);line-height:1.25;
  white-space:nowrap;overflow:hidden;text-overflow:ellipsis;
}
.folder-status-tag{
  position:absolute;top:50%;left:50%;transform:translate(-50%,-50%);z-index:3;
  padding:7px 16px;border-radius:999px;
  backdrop-filter:blur(12px) saturate(1.2);-webkit-backdrop-filter:blur(12px) saturate(1.2);
  box-shadow:0 4px 10px rgba(50,70,110,0.16), inset 0 1px 0 rgba(255,255,255,0.75);
  font-size:12px;font-weight:700;letter-spacing:.08em;cursor:pointer;
  border:1px solid rgba(255,255,255,0.75);
}
.folder-status-tag.st-sold{background:linear-gradient(160deg, rgba(235,247,241,0.92), rgba(208,236,223,0.8));color:var(--ok)}
.folder-status-tag.st-pending{background:linear-gradient(160deg, rgba(252,244,227,0.94), rgba(243,229,197,0.82));color:var(--warn)}
.folder-edit-btn{
  position:absolute;top:8px;right:8px;z-index:3;
  width:28px;height:28px;border-radius:50%;
  background:linear-gradient(160deg, rgba(255,255,255,0.7), rgba(255,255,255,0.36));
  border:1px solid rgba(255,255,255,0.75);
  backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);
  box-shadow:0 4px 10px rgba(50,70,110,0.14);
  display:flex;align-items:center;justify-content:center;color:var(--text);
}
.folder-edit-btn .icon{width:15px;height:15px}
.empty-tip{
  text-align:center;color:var(--muted);font-size:13px;
  padding:52px 16px;grid-column:1/-1;line-height:1.9;
}
.empty-tip svg{width:44px;height:44px;margin:0 auto 12px;opacity:.55}

/* ============ 详情页 ============ */
.detail-card-title{
  font-size:clamp(23px,7vw,29px);font-weight:800;letter-spacing:.04em;
  color:var(--text);line-height:1.25;margin:4px 0 12px;padding:0 2px;
}
.detail-actions{display:flex;gap:8px;flex-wrap:wrap;margin:0 0 12px}
.detail-actions .btn{padding:6px 12px;min-height:34px;font-size:11.5px;border-radius:999px}
.detail-meta{
  background:var(--glass-strong);border:1px solid var(--glass-border);
  border-radius:14px;padding:12px 14px;margin-bottom:12px;
  font-size:12.5px;font-weight:600;line-height:1.8;color:var(--text);
}
.detail-meta span{color:var(--muted);font-weight:600;margin-right:4px}
.detail-meta .st{display:inline-flex;align-items:center;padding:1px 8px;border-radius:999px;font-size:11px;font-weight:700;margin-left:4px}
.detail-meta .st.st-sold{background:var(--ok-soft);color:var(--ok)}
.detail-meta .st.st-pending{background:var(--warn-soft);color:var(--warn)}
.multi-bar{display:none;gap:8px;margin-bottom:12px}
.multi-bar.show{display:flex}
.multi-bar .btn{flex:1;padding:9px 4px;font-size:12px;min-height:40px;border-radius:12px}
.card-price-row{
  display:flex;align-items:center;justify-content:space-between;
  background:var(--glass-strong);border:1px solid var(--glass-border);
  border-radius:14px;padding:11px 14px;margin-bottom:12px;cursor:pointer;
  transition:transform .12s ease;
}
.card-price-row:active{transform:scale(.985)}
.card-price-row .label{font-size:12px;font-weight:700;color:var(--muted);display:flex;align-items:center;gap:6px}
.card-price-row .label .icon{width:14px;height:14px}
.card-price-row .value{font-size:14px;font-weight:700;color:var(--text)}
.total-bar{
  background:rgba(255,255,255,0.72);border:1px solid var(--glass-border);
  border-radius:14px;padding:12px 14px;margin-bottom:14px;
  display:flex;align-items:center;justify-content:space-between;
}
.total-bar .label{font-size:13px;color:var(--muted)}
.total-bar .value{font-size:18px;font-weight:800;color:var(--accent)}
.section-label{font-size:12px;color:var(--muted);margin-bottom:9px;font-weight:600;letter-spacing:.04em}

/* ============ 记录列表 ============ */
.record-list{display:flex;flex-direction:column;gap:10px}
.record-wrap{position:relative}
.record-checkbox{
  position:absolute;top:12px;left:12px;width:22px;height:22px;z-index:3;
  accent-color:var(--accent);display:none;
}
.record-checkbox.show{display:block}
.record-item{
  display:flex;flex-direction:column;gap:10px;
  background:linear-gradient(160deg, rgba(255,255,255,0.52), rgba(255,255,255,0.22));
  border:1px solid rgba(255,255,255,0.6);
  border-radius:18px;padding:12px;
  backdrop-filter:blur(16px);-webkit-backdrop-filter:blur(16px);
  box-shadow:var(--shadow-sm);
  transition:transform .14s ease;
}
.record-item:active{transform:scale(.99)}
.record-wrap .record-item.multi-on{padding-left:46px}
.record-main{display:flex;gap:11px;align-items:flex-start;min-width:0}
.record-thumb{
  width:58px;height:58px;border-radius:13px;object-fit:cover;
  background:rgba(225,230,238,0.7);flex-shrink:0;cursor:zoom-in;
  border:1px solid rgba(255,255,255,0.5);
}
.record-thumb-empty{
  width:58px;height:58px;border-radius:13px;flex-shrink:0;
  background:rgba(225,230,238,0.55);display:flex;align-items:center;justify-content:center;
  color:var(--muted);
}
.record-thumb-empty .icon{width:22px;height:22px;opacity:.6}
.record-body{flex:1;min-width:0;padding-top:1px}
.record-body .n{font-size:15px;font-weight:700;margin-bottom:3px}
.record-body .m{font-size:12px;color:var(--muted);line-height:1.6}
.record-body .note{font-size:12px;color:var(--muted);margin-top:2px;line-height:1.5;display:flex;align-items:center;gap:4px}
.record-body .note .icon{width:13px;height:13px;opacity:.8}
.record-actions{display:flex;gap:8px}
.record-actions .btn{flex:1;padding:8px 4px;min-height:36px;font-size:12px;border-radius:12px}

/* ============ 导入页 ============ */
.form-card{
  background:linear-gradient(160deg, rgba(255,255,255,0.52), rgba(255,255,255,0.24));
  border:1px solid rgba(255,255,255,0.6);
  border-radius:20px;padding:16px;
  backdrop-filter:blur(18px) saturate(1.2);-webkit-backdrop-filter:blur(18px) saturate(1.2);
  box-shadow:var(--shadow);
}
.form-row{margin-bottom:13px}
.form-row:last-child{margin-bottom:0}
.form-row label{display:block;font-size:12.5px;color:var(--text);margin-bottom:8px;font-weight:700;letter-spacing:.03em}
.form-row input[type="text"]{
  width:100%;
  border:1px solid rgba(255,255,255,0.65);
  border-radius:14px;
  background:linear-gradient(160deg, rgba(255,255,255,0.6), rgba(255,255,255,0.28));
  backdrop-filter:blur(16px) saturate(1.2);-webkit-backdrop-filter:blur(16px) saturate(1.2);
  box-shadow:var(--shadow-sm);
  padding:12px 14px;font-size:16px;min-height:46px;color:var(--text);
  transition:border-color .18s ease, box-shadow .18s ease;
}
.form-row input[type="text"]:focus{
  border-color:rgba(92,111,158,0.45);
  box-shadow:0 0 0 3px var(--accent-soft);
}
.preview-box{
  width:100%;aspect-ratio:1.35;border-radius:14px;
  background:rgba(228,233,240,0.55);border:1.5px dashed rgba(160,172,192,0.55);
  overflow:hidden;display:flex;align-items:center;justify-content:center;
  color:var(--muted);font-size:13px;cursor:pointer;
  transition:border-color .18s ease;
}
.preview-box:active{border-color:var(--accent)}
.preview-box .icon{width:30px;height:30px;margin-bottom:6px;opacity:.65}
.preview-box .p-hint{display:flex;flex-direction:column;align-items:center;gap:2px}
.preview-box img{width:100%;height:100%;object-fit:cover;display:block}
.preview-box.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:6px;padding:6px;align-content:start;overflow-y:auto;aspect-ratio:auto;min-height:140px;max-height:300px}
.preview-box.grid img{width:100%;aspect-ratio:1;object-fit:cover;border-radius:9px}
.hint{font-size:11.5px;color:var(--muted);margin-top:11px;line-height:1.6}

/* ============ 弹层 ============ */
.modal-mask{
  position:fixed;inset:0;z-index:60;
  background:rgba(40,48,60,0.32);
  backdrop-filter:blur(6px);-webkit-backdrop-filter:blur(6px);
  display:flex;align-items:center;justify-content:center;padding:16px;
  opacity:0;visibility:hidden;pointer-events:none;
  transition:opacity .22s ease, visibility .22s;
}
.modal-mask.show{opacity:1;visibility:visible;pointer-events:auto}
.modal{
  width:100%;max-width:420px;max-height:min(80vh,80dvh);overflow:auto;
  background:linear-gradient(160deg, rgba(255,255,255,0.78), rgba(255,255,255,0.44));
  border:1px solid rgba(255,255,255,0.65);
  backdrop-filter:blur(28px) saturate(1.35);-webkit-backdrop-filter:blur(28px) saturate(1.35);
  border-radius:24px;padding:18px 16px;
  box-shadow:var(--shadow-lg);
  transform:translateY(12px) scale(.97);
  transition:transform .26s cubic-bezier(.2,.85,.25,1);
}
.modal-mask.show .modal{transform:none}
.modal h3{font-size:15.5px;font-weight:700;margin-bottom:14px}
.modal-section{margin-bottom:15px}
.modal-section .label{font-size:13px;color:var(--text);margin-bottom:9px;font-weight:700;letter-spacing:.03em}
.chip-wrap{display:flex;flex-wrap:wrap;gap:8px}
.modal-actions{display:flex;gap:8px;margin-top:10px}
.modal-actions .btn{flex:1;min-height:46px;font-size:14px;border-radius:14px}
.modal-actions .cancel{background:rgba(255,255,255,0.75);color:var(--muted)}
.modal-actions .ok{background:rgba(255,255,255,0.95);color:var(--accent);font-weight:700}
.modal-actions .ok.danger{color:var(--danger)}

/* 设置 */
.setting-row{margin-bottom:13px}
.setting-row > label{display:block;font-size:12px;color:var(--muted);margin-bottom:7px;font-weight:600}
.setting-row input[type="text"]{
  width:100%;border:1px solid var(--glass-border);
  background:rgba(255,255,255,0.75);border-radius:12px;
  padding:11px 12px;font-size:16px;min-height:44px;color:var(--text);
}
.setting-row input[type="color"]{
  width:48px;height:38px;border:1px solid var(--glass-border);
  border-radius:10px;background:transparent;padding:2px;flex-shrink:0;
}
.setting-row input[type="checkbox"]{width:22px;height:22px;accent-color:var(--accent)}
.color-pair{display:flex;gap:8px;align-items:center}
.color-pair input[type="text"]{flex:1;font-size:13px;min-height:38px;padding:8px 10px}
.setting-actions{display:flex;flex-direction:column;gap:9px;margin-top:10px}
.setting-actions .btn{width:100%;padding:12px;font-size:13px;min-height:44px}

/* 确认弹窗 */
.confirm-modal{max-width:320px;text-align:center}
.confirm-title{font-size:16px;font-weight:700;margin-bottom:8px}
.confirm-msg{font-size:13px;color:var(--muted);line-height:1.7;margin-bottom:6px;white-space:pre-line;text-align:left}
.confirm-modal .modal-actions{margin-top:16px}

/* 文件夹操作 */
.folder-action-modal{max-width:270px;display:flex;flex-direction:column;gap:10px;align-items:stretch}
.folder-action-modal h3{text-align:center;margin-bottom:2px}
.folder-action-chip{
  width:100%;padding:13px;border-radius:999px;
  background:rgba(255,255,255,0.75);border:1px solid var(--glass-border);
  font-size:14px;font-weight:600;color:var(--text);min-height:46px;
  backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);
  transition:transform .12s ease;
}
.folder-action-chip:active{transform:scale(.97)}
.folder-action-chip.danger{color:var(--danger)}

/* 导出选择 */
.export-list{max-height:42vh;overflow-y:auto;display:flex;flex-direction:column;gap:8px;margin-bottom:14px}
.export-row{
  display:flex;align-items:center;gap:10px;padding:11px 12px;border-radius:13px;
  background:rgba(255,255,255,0.58);border:1px solid rgba(255,255,255,0.65);
  cursor:pointer;
}
.export-row input[type="checkbox"]{width:19px;height:19px;flex-shrink:0;accent-color:var(--accent)}
.export-row .e-name{flex:1;font-size:13px;font-weight:600;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.export-count{font-size:12px;color:var(--muted)}

/* ============ 灯箱 ============ */
.lightbox{
  position:fixed;inset:0;z-index:80;
  background:rgba(15,20,30,0.82);
  display:flex;flex-direction:column;align-items:center;justify-content:center;
  padding:18px;
  opacity:0;visibility:hidden;pointer-events:none;
  transition:opacity .24s ease, visibility .24s;
}
.lightbox.show{opacity:1;visibility:visible;pointer-events:auto}
.lb-top{position:absolute;top:max(14px, env(safe-area-inset-top));left:0;right:0;display:flex;align-items:center;justify-content:space-between;padding:0 14px;z-index:2}
.lb-count{color:rgba(255,255,255,0.85);font-size:13px;font-weight:600;padding:7px 13px;border-radius:999px;background:rgba(255,255,255,0.14);backdrop-filter:blur(8px)}
.lb-close{
  width:42px;height:42px;border-radius:50%;
  background:rgba(255,255,255,0.16);color:#fff;
  display:flex;align-items:center;justify-content:center;
  border:1px solid rgba(255,255,255,0.2);
}
.lb-close .icon{width:18px;height:18px}
.lb-img{max-width:100%;max-height:82vh;border-radius:14px;box-shadow:0 20px 60px rgba(0,0,0,0.4)}
.lb-nav{
  position:absolute;top:50%;transform:translateY(-50%);
  width:44px;height:44px;border-radius:50%;
  background:rgba(255,255,255,0.16);color:#fff;
  display:flex;align-items:center;justify-content:center;
  border:1px solid rgba(255,255,255,0.2);
}
.lb-nav.prev{left:10px}
.lb-nav.next{right:10px}
.lb-nav:disabled{opacity:.25;cursor:default}

/* ============ Toast ============ */
#toastWrap{
  position:fixed;left:0;right:0;bottom:calc(30px + env(safe-area-inset-bottom));z-index:130;
  display:flex;flex-direction:column;align-items:center;gap:8px;pointer-events:none;padding:0 20px;
}
.toast{
  display:flex;align-items:center;gap:8px;
  max-width:88%;padding:11px 18px;border-radius:999px;
  background:rgba(35,42,55,0.82);color:#fff;font-size:13px;font-weight:600;
  box-shadow:0 10px 30px rgba(20,25,40,0.3);
  backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);
  opacity:0;transform:translateY(14px) scale(.96);
  transition:opacity .25s ease, transform .25s ease;
  text-align:center;line-height:1.5;
}
.toast.show{opacity:1;transform:none}
.toast .icon{width:16px;height:16px;flex-shrink:0}
.toast.t-success{background:rgba(38,96,74,0.92)}
.toast.t-danger{background:rgba(158,54,50,0.94)}

/* ============ 加载遮罩 ============ */
#loadingOverlay{
  position:fixed;inset:0;z-index:110;
  background:rgba(40,48,60,0.42);
  backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px);
  display:none;align-items:center;justify-content:center;flex-direction:column;
  padding:20px;
}
#loadingOverlay.show{display:flex}
.loading-box{
  background:linear-gradient(160deg, rgba(255,255,255,0.94), rgba(255,255,255,0.8));
  border:1px solid rgba(255,255,255,0.75);
  border-radius:20px;padding:24px 30px;text-align:center;
  box-shadow:var(--shadow-lg);
  max-width:290px;width:100%;
}
.loading-box .lt{font-size:15px;font-weight:700;color:var(--text);margin-bottom:7px}
.loading-box .ls{font-size:12px;color:var(--muted);line-height:1.6}
.loading-spinner{
  width:34px;height:34px;margin:0 auto 14px;border-radius:50%;
  border:3px solid rgba(92,111,158,0.18);border-top-color:var(--accent);
  animation:spin .9s linear infinite;
}
@keyframes spin{to{transform:rotate(360deg)}}

/* ============ 动效降级 ============ */
@media (prefers-reduced-motion: reduce){
  *,*::before,*::after{animation-duration:.01ms !important;transition-duration:.01ms !important}
  .loading-spinner{animation:none;border-top-color:var(--accent)}
}

/* ============ 桌面端微调 ============ */
@media (min-width:500px){
  .name-screen{min-height:calc(100vh - 36px)}
  .modal{max-width:420px;border-radius:24px}
  .folder-grid{gap:14px}
}
</style>
</head>

<div class="app">
  <div class="shell-wrap">

        <input type="text" id="nameInput" maxlength="20" autocomplete="nickname" placeholder="圈名">
      </div>
      <button class="btn btn-primary btn-block" id="confirmName" style="min-height:48px;font-size:15px">确定</button>
    </div>

    <!-- ===== 主壳 ===== -->
    <div class="glass shell" id="shell">
      <div class="topbar">
        <label class="avatar-wrap" for="avatarInput" title="点击上传头像">

      <!-- ===== 主页 ===== -->

    </div>
    <div class="setting-row">
      <label>背景色 2（渐变时使用）</label>
      <div class="color-pair"><input type="color" id="colorBg2" value="#e8ecf1"><input type="text" id="colorBg2Hex" value="#e8ecf1"></div>

<script>
/* ============ 常量与状态 ============ */
const DB_NAME = "privateRecordDB_v5";
const DB_VERSION = 1;
const STORE_FOLDERS = "folders";
const STORE_RECORDS = "records";
const STORE_PROFILE = "profile";
let db = null;
let currentName = "";
let pendingImages = [];
let multiSelect = false;
let selectedRecordIds = new Set();
let batchEditMode = false;
let filterState = { meets: new Set(), helpers: new Set() };

let searchQuery = "";

/* ============ 加载遮罩 ============ */
function showLoading(text, sub) {
  const el = document.getElementById("loadingOverlay");
  if (!el) return;
  document.getElementById("loadingText").textContent = text || "处理中...";
  document.getElementById("loadingSub").textContent = sub || "请勿关闭或刷新页面";
  el.classList.add("show");
  document.body.classList.add("modal-lock");
}
function hideLoading() {
  const el = document.getElementById("loadingOverlay");
  if (el) el.classList.remove("show");
  const anyOpen = document.querySelector(".modal-mask.show, .lightbox.show");
  if (!anyOpen) document.body.classList.remove("modal-lock");
}

/* ============ IndexedDB ============ */
function openDB() {
  return new Promise((resolve, reject) => {
    if (db) return resolve(db);
    const req = indexedDB.open(DB_NAME, DB_VERSION);
    req.onupgradeneeded = e => {
      const d = e.target.result;
      if (!d.objectStoreNames.contains(STORE_FOLDERS)) {
        const fs = d.createObjectStore(STORE_FOLDERS, { keyPath: "id", autoIncrement: true });
        fs.createIndex("cardName", "cardName", { unique: true });
      }
      if (!d.objectStoreNames.contains(STORE_RECORDS)) {
        const rs = d.createObjectStore(STORE_RECORDS, { keyPath: "id", autoIncrement: true });
        rs.createIndex("folderId", "folderId", { unique: false });
      }
      if (!d.objectStoreNames.contains(STORE_PROFILE)) {
        d.createObjectStore(STORE_PROFILE, { keyPath: "key" });
      }
    };
    req.onsuccess = e => { db = e.target.result; resolve(db); };
    req.onerror = () => reject(req.error || new Error("DB open fail"));
  });
}
function idbReq(request) {
  return new Promise((resolve, reject) => {
    request.onsuccess = () => resolve(request.result);
    request.onerror = () => reject(request.error);
  });
}
function txDone(tx) {
  return new Promise((resolve, reject) => {
    tx.oncomplete = () => resolve();
    tx.onerror = () => reject(tx.error);
    tx.onabort = () => reject(tx.error || new Error("aborted"));
  });
}

/* ============ 工具函数 ============ */
function fileToBase64(file) {
  return new Promise((resolve, reject) => {
    const r = new FileReader();
    r.onload = () => resolve(r.result);
    r.onerror = reject;
    r.readAsDataURL(file);
  });
}
function compressImage(file, maxSize, quality) {
  maxSize = maxSize || 1200;
  quality = quality || 0.82;
  return new Promise((resolve, reject) => {
    const reader = new FileReader();
    reader.onload = () => {
      const img = new Image();
      img.onload = () => {
        let w = img.width, h = img.height;
        if (w > maxSize || h > maxSize) {
          const ratio = Math.min(maxSize / w, maxSize / h);
          w = Math.round(w * ratio);
          h = Math.round(h * ratio);
        }
        const canvas = document.createElement("canvas");
        canvas.width = w; canvas.height = h;
        const ctx = canvas.getContext("2d");
        ctx.drawImage(img, 0, 0, w, h);
        resolve(canvas.toDataURL("image/jpeg", quality));
      };
      img.onerror = reject;
      img.src = reader.result;
    };
    reader.onerror = reject;
    reader.readAsDataURL(file);
  });
}
function makeThumb(dataUrl, maxSize) {
  maxSize = maxSize || 120;
  return new Promise((resolve, reject) => {
    const img = new Image();
    img.onload = () => {
      let w = img.width, h = img.height;
      const ratio = Math.min(maxSize / w, maxSize / h, 1);
      w = Math.round(w * ratio); h = Math.round(h * ratio);
      const canvas = document.createElement("canvas");
      canvas.width = w; canvas.height = h;
      const ctx = canvas.getContext("2d");
      ctx.drawImage(img, 0, 0, w, h);
      resolve(canvas.toDataURL("image/jpeg", 0.5));
    };
    img.onerror = reject;
    img.src = dataUrl;
  });
}
async function saveImageToDevice(dataUrl, filename) {
  filename = filename || "私调图.png";
  const res = await fetch(dataUrl);
  const blob = await res.blob();
  if (navigator.canShare) {
    try {
      const file = new File([blob], filename, { type: blob.type || "image/png" });
      if (navigator.canShare({ files: [file] })) {
        await navigator.share({ files: [file], title: filename });
        return;
      }
    } catch (e) {
      if (e && e.name === "AbortError") return;
    }
  }
  const url = URL.createObjectURL(blob);
  const a = document.createElement("a");
  a.href = url;
  a.download = filename;
  a.rel = "noopener";
  document.body.appendChild(a);
  a.click();
  a.remove();
  setTimeout(() => URL.revokeObjectURL(url), 2000);
}
function escapeHtml(s) {
  return String(s || "")
    .replace(/&/g, "&amp;").replace(/</g, "&lt;")
    .replace(/>/g, "&gt;").replace(/"/g, "&quot;");
}
function parsePrice(v) {
  const n = parseFloat(String(v || "").replace(/[^\d.]/g, ""));
  return isNaN(n) ? 0 : n;
}
function hasPrice(r) {
  return r && r.price !== undefined && r.price !== null && String(r.price).trim() !== "";
}
function icon(name, cls) {
  return '<svg class="icon ' + (cls || "") + '" aria-hidden="true"><use href="#i-' + name + '" xlink:href="#i-' + name + '"/></svg>';
}
function qMatch(s, q) {
  return !q || String(s || "").toLowerCase().indexOf(q) !== -1;
}

/* ============ Profile / 数据操作 ============ */
async function saveProfile(data) {
  const database = await openDB();
  const tx = database.transaction(STORE_PROFILE, "readwrite");
  const prev = (await idbReq(tx.objectStore(STORE_PROFILE).get("user"))) || {};
  tx.objectStore(STORE_PROFILE).put({ key: "user", ...prev, ...data });
  await txDone(tx);
}
async function loadProfile() {
  const database = await openDB();
  const tx = database.transaction(STORE_PROFILE, "readonly");
  return (await idbReq(tx.objectStore(STORE_PROFILE).get("user"))) || {};
}
async function getAllFolders() {
  const database = await openDB();
  const tx = database.transaction(STORE_FOLDERS, "readonly");
  const all = await idbReq(tx.objectStore(STORE_FOLDERS).getAll());
  return (all || []).sort((a, b) => {
    const oa = a.sortOrder != null ? a.sortOrder : (a.createdAt || a.id || 0);
    const ob = b.sortOrder != null ? b.sortOrder : (b.createdAt || b.id || 0);
    return oa - ob;
  });
}
async function getFolderByCardName(cardName) {
  const database = await openDB();
  const tx = database.transaction(STORE_FOLDERS, "readonly");
  return await idbReq(tx.objectStore(STORE_FOLDERS).index("cardName").get(cardName));
}
async function addFolder(folder) {
  const database = await openDB();
  if (folder.sortOrder == null) {
    const existing = await getAllFolders();
    const maxOrder = existing.reduce((m, f) => Math.max(m, f.sortOrder != null ? f.sortOrder : 0), 0);
    folder.sortOrder = maxOrder + 1;
  }
  const tx = database.transaction(STORE_FOLDERS, "readwrite");
  const id = await idbReq(tx.objectStore(STORE_FOLDERS).add(folder));
  await txDone(tx);
  return id;
}
async function moveFolder(folderId, direction) {
  const folders = await getAllFolders();
  const idx = folders.findIndex(f => f.id === folderId);
  if (idx < 0) return false;
  const newIdx = idx + direction;
  if (newIdx < 0 || newIdx >= folders.length) return false;
  const arr = folders.slice();
  const tmp = arr[idx];
  arr[idx] = arr[newIdx];
  arr[newIdx] = tmp;
  const database = await openDB();
  const tx = database.transaction(STORE_FOLDERS, "readwrite");
  const store = tx.objectStore(STORE_FOLDERS);
  for (let i = 0; i < arr.length; i++) {
    const f = arr[i];
    f.sortOrder = i;
    f.updatedAt = Date.now();
    store.put(f);
  }
  await txDone(tx);
  return true;
}
async function touchFolder(id) {
  const database = await openDB();
  const tx = database.transaction(STORE_FOLDERS, "readwrite");
  const store = tx.objectStore(STORE_FOLDERS);
  const f = await idbReq(store.get(id));
  if (f) { f.updatedAt = Date.now(); store.put(f); }
  await txDone(tx);
}
async function addRecord(rec) {
  const database = await openDB();
  const tx = database.transaction(STORE_RECORDS, "readwrite");
  await idbReq(tx.objectStore(STORE_RECORDS).add(rec));
  await txDone(tx);
}
async function getRecordsByFolder(folderId) {
  const database = await openDB();
  const tx = database.transaction(STORE_RECORDS, "readonly");
  const all = await idbReq(tx.objectStore(STORE_RECORDS).index("folderId").getAll(folderId));
  return (all || []).sort((a, b) => (b.time || 0) - (a.time || 0));
}
async function getRecordById(id) {
  const database = await openDB();
  const tx = database.transaction(STORE_RECORDS, "readonly");
  return await idbReq(tx.objectStore(STORE_RECORDS).get(id));
}
async function getAllRecords() {
  const database = await openDB();
  const tx = database.transaction(STORE_RECORDS, "readonly");
  return (await idbReq(tx.objectStore(STORE_RECORDS).getAll())) || [];
}
async function delRecord(id) {
  const database = await openDB();
  const tx = database.transaction(STORE_RECORDS, "readwrite");
  tx.objectStore(STORE_RECORDS).delete(id);
  await txDone(tx);
}
async function clearAllData() {
  const database = await openDB();
  const tx = database.transaction([STORE_FOLDERS, STORE_RECORDS], "readwrite");
  tx.objectStore(STORE_FOLDERS).clear();
  tx.objectStore(STORE_RECORDS).clear();
  await txDone(tx);
}
async function updateRecord(id, patch) {
  const database = await openDB();
  const tx = database.transaction(STORE_RECORDS, "readwrite");
  const store = tx.objectStore(STORE_RECORDS);
  const rec = await idbReq(store.get(id));
  if (!rec) return;
  Object.assign(rec, patch);
  store.put(rec);
  await txDone(tx);
}
async function setFolderCover(folderId, coverBase64) {
  const database = await openDB();
  const tx = database.transaction(STORE_FOLDERS, "readwrite");
  const store = tx.objectStore(STORE_FOLDERS);
  const f = await idbReq(store.get(folderId));
  if (!f) return;
  f.coverBase64 = coverBase64;
  f.updatedAt = Date.now();
  store.put(f);
  await txDone(tx);
}
async function setFolderStatus(folderId, status) {
  const database = await openDB();
  const tx = database.transaction(STORE_FOLDERS, "readwrite");
  const store = tx.objectStore(STORE_FOLDERS);
  const f = await idbReq(store.get(folderId));
  if (!f) return;
  f.status = status;
  f.updatedAt = Date.now();
  store.put(f);
  await txDone(tx);
  await renderFolders();
}
async function deleteFolder(folderId) {
  const database = await openDB();
  const tx = database.transaction([STORE_FOLDERS, STORE_RECORDS], "readwrite");
  tx.objectStore(STORE_FOLDERS).delete(folderId);
  const idx = tx.objectStore(STORE_RECORDS).index("folderId");
  const req = idx.openCursor(IDBKeyRange.only(folderId));
  req.onsuccess = (e) => {
    const cur = e.target.result;
    if (cur) { cur.delete(); cur.continue(); }
  };
  await txDone(tx);
  await renderFolders();
  showPage(pageFolders);
}

/* ============ Toast / 确认弹窗 ============ */
function showToast(msg, type) {
  const wrap = document.getElementById("toastWrap");
  if (!wrap) return;
  const el = document.createElement("div");
  el.className = "toast" + (type === "success" ? " t-success" : type === "danger" ? " t-danger" : "");
  el.innerHTML = (type === "success" ? icon("check", "icon-sm") : type === "danger" ? icon("alert", "icon-sm") : "") +
    "<span>" + escapeHtml(msg) + "</span>";
  wrap.appendChild(el);
  requestAnimationFrame(() => el.classList.add("show"));
  setTimeout(() => {
    el.classList.remove("show");
    setTimeout(() => el.remove(), 320);
  }, 2400);
}
function askConfirm(opts) {
  opts = opts || {};
  return new Promise(resolve => {
    const modal = document.getElementById("confirmModal");
    document.getElementById("confirmTitle").textContent = opts.title || "提示";
    document.getElementById("confirmMsg").textContent = opts.msg || "";
    const okBtn = document.getElementById("confirmOk");
    okBtn.textContent = opts.okText || "确定";
    okBtn.classList.toggle("danger", !!opts.danger);
    const cancelBtn = document.getElementById("confirmCancel");
    cancelBtn.textContent = opts.cancelText || "取消";
    cancelBtn.style.display = "";
    let done = false;
    const finish = (val) => { if (done) return; done = true; modal.classList.remove("show"); resolve(val); };
    okBtn.onclick = () => finish(true);
    cancelBtn.onclick = () => finish(false);
    modal.onclick = (e) => { if (e.target === modal) finish(false); };
    modal.classList.add("show");
  });
}
function showAlert(msg, title) {
  return new Promise(resolve => {
    const modal = document.getElementById("confirmModal");
    document.getElementById("confirmTitle").textContent = title || "提示";
    document.getElementById("confirmMsg").textContent = msg || "";
    const okBtn = document.getElementById("confirmOk");
    okBtn.textContent = "知道了";
    okBtn.classList.remove("danger");
    const cancelBtn = document.getElementById("confirmCancel");
    cancelBtn.style.display = "none";
    let done = false;
    const finish = () => { if (done) return; done = true; modal.classList.remove("show"); cancelBtn.style.display = ""; resolve(); };
    okBtn.onclick = finish;
    modal.onclick = (e) => { if (e.target === modal) finish(); };
    modal.classList.add("show");
  });
}

/* ============ 灯箱 ============ */
function openLightbox(recs, idx) {
  lightboxList = recs || [];
  lightboxIndex = Math.max(0, Math.min(idx || 0, lightboxList.length - 1));
  updateLightbox();
  lightbox.classList.add("show");
}
function updateLightbox() {
  const rec = lightboxList[lightboxIndex];
  if (!rec) return;
  lbImg.src = rec.imgBase64 || "";
  lbCount.textContent = (lightboxIndex + 1) + " / " + lightboxList.length;
  lbPrev.disabled = lightboxIndex <= 0;
  lbNext.disabled = lightboxIndex >= lightboxList.length - 1;
}
function lbNav(dir) {
  const ni = lightboxIndex + dir;
  if (ni < 0 || ni >= lightboxList.length) return;
  lightboxIndex = ni;
  updateLightbox();
}

/* ============ 主题 ============ */
function hexToRgba(hex, a) {
  const h = String(hex || "#ffffff").replace("#", "");
  if (h.length !== 6) return "rgba(255,255,255," + a + ")";
  const r = parseInt(h.slice(0,2), 16);
  const g = parseInt(h.slice(2,4), 16);
  const b = parseInt(h.slice(4,6), 16);
  return "rgba(" + r + "," + g + "," + b + "," + a + ")";
}
function normalizeHex(v) {
  v = String(v || "").trim();
  if (!v) return null;
  if (v[0] !== "#") v = "#" + v;
  if (/^#[0-9a-fA-F]{6}$/.test(v)) return v.toLowerCase();
  if (/^#[0-9a-fA-F]{3}$/.test(v)) {
    return ("#" + v[1]+v[1]+v[2]+v[2]+v[3]+v[3]).toLowerCase();
  }
  return null;
}
function applyTheme(theme) {
  theme = theme || {};
  const bg1 = theme.bg1 || "#eef0f4";
  const bg2 = theme.bg2 || "#e2e6ec";
  const text = theme.text || "#333a47";
  const btn = theme.btn || "#ffffff";
  const btnText = theme.btnText || "#465064";
  const useGradient = theme.gradient !== false;
  const subtitle = theme.subtitle || "本机保存 · 可备份";

  document.documentElement.style.setProperty("--bg1", bg1);
  document.documentElement.style.setProperty("--bg2", bg2);
  document.documentElement.style.setProperty("--text", text);
  document.documentElement.style.setProperty("--btn", btn.length === 7 ? hexToRgba(btn, 0.8) : btn);
  document.documentElement.style.setProperty("--btn-text", btnText);

  if (useGradient) {
    document.body.style.background =
      "radial-gradient(ellipse 80% 50% at 10% -10%, rgba(255,255,255,0.95) 0%, transparent 55%)," +
      "radial-gradient(ellipse 70% 45% at 95% 5%, rgba(200,214,235,0.5) 0%, transparent 50%)," +
      "radial-gradient(ellipse 60% 40% at 50% 100%, rgba(178,190,210,0.35) 0%, transparent 45%)," +
      "linear-gradient(165deg, " + bg1 + " 0%, " + bg2 + " 55%, " + bg2 + " 100%)";
  } else {
    document.body.style.background = bg1;
  }

  const el = id => document.getElementById(id);
  if (el("colorBg1")) el("colorBg1").value = bg1;
  if (el("colorBg2")) el("colorBg2").value = bg2;
  if (el("colorText")) el("colorText").value = text;
  if (el("colorBtn")) el("colorBtn").value = (btn && btn[0] === "#") ? btn : "#ffffff";
  if (el("colorBtnText")) el("colorBtnText").value = btnText;
  if (el("colorGradient")) el("colorGradient").checked = useGradient;
  if (el("colorBg1Hex")) el("colorBg1Hex").value = bg1;

  if (el("colorBtnTextHex")) el("colorBtnTextHex").value = btnText;
  if (el("subtitleInput")) el("subtitleInput").value = subtitle;

}

async function renderFolders() {
  let folders = [];
  try { folders = await getAllFolders(); } catch (e) { console.error(e); }
  const hasMeet = filterState.meets.size > 0;
  const hasHelper = filterState.helpers.size > 0;
  const filtering = hasMeet || hasHelper;
  const q = searchQuery.trim().toLowerCase();

  renderStats();
  renderStatusChips();
  folderGrid.innerHTML = "";

  if (filtering) {
    const records = await getAllRecords();
    const folderMap = {};
    folders.forEach(f => folderMap[f.id] = f);
    const matched = records.filter(r => {
      const f = folderMap[r.folderId] || {};
      const m = recordMeet(r, f);
      const h = recordHelper(r, f);
      const cn = f.cardName || "";
      const okMeet = !hasMeet || filterState.meets.has(m);
      const okHelper = !hasHelper || filterState.helpers.has(h);
      const okQ = qMatch(cn, q) || qMatch(m, q) || qMatch(h, q);
      return okMeet && okHelper && okQ;
    });
    if (!matched.length) {
      folderGrid.innerHTML = emptyTip("暂无匹配的私调条目", '<div>点「重置」或清除筛选查看全部</div>');
      recalcTotalAll();
      return;
    }
    folderGrid.classList.remove("folder-grid");
    const list = document.createElement("div");
    list.className = "record-list";
    matched.forEach(r => list.appendChild(buildRecordRow(r, folderMap[r.folderId] || {})));
    folderGrid.appendChild(list);
    bindRecordList(list);
    recalcTotalAll();
    return;
  }

  folderGrid.classList.add("folder-grid");
  let shown = folders;
  if (statusFilter) shown = shown.filter(f => f.status === statusFilter);
  if (q) shown = shown.filter(f => qMatch(f.cardName, q) || qMatch(f.meetName, q) || qMatch(f.helper, q));

  if (!shown.length) {
    const emptyMsg = !folders.length ? "暂无色卡" : (q ? "未找到匹配的色卡" : "该状态下暂无色卡");
    folderGrid.innerHTML = emptyTip(emptyMsg, '<div>' + (q ? "换个关键词试试" : "点击「导入私调」开始") + '</div>');
    recalcTotalAll();
    return;
  }
  shown.forEach(f => folderGrid.appendChild(buildFolderCard(f)));
  recalcTotalAll();
}

function openFolderMeetFilter(folderId, allMeets) {
  const modal = document.getElementById("folderMeetModal");
  const wrap = document.getElementById("folderMeetChips");
  if (!modal || !wrap) return;
  wrap.innerHTML = "";
  if (!allMeets.length) {
    wrap.innerHTML = '<span style="font-size:12px;color:var(--muted)">暂无可筛选会名</span>';
  } else {
    allMeets.forEach(v => {
      const chip = document.createElement("button");
      chip.type = "button";
      chip.className = "chip" + (folderMeetFilter.has(v) ? " on" : "");
      chip.textContent = v;
      chip.onclick = () => {
        if (folderMeetFilter.has(v)) folderMeetFilter.delete(v); else folderMeetFilter.add(v);
        chip.classList.toggle("on");
      };
      wrap.appendChild(chip);
    });
  }
  modal.classList.add("show");
  document.getElementById("folderMeetApply").onclick = () => {
    modal.classList.remove("show");
    openFolder(folderId, folderMeetFilter);
  };
  document.getElementById("folderMeetReset").onclick = () => {
    folderMeetFilter = new Set();
    modal.classList.remove("show");
    openFolder(folderId, new Set());
  };
}

async function openEditRecord(recordId, folderId) {
  const database = await openDB();

async function doExportBackup(selectedIds) {
  const btn = document.getElementById("btnExportJson");
  const originalText = btn.textContent;
  btn.disabled = true;
  await new Promise(r => setTimeout(r, 30));
  showLoading("正在打包备份…", "数据较多时请耐心等待，勿关闭页面");
  try {
    const allFolders = await getAllFolders();
    const idSet = new Set(selectedIds.map(Number));
    const folders = allFolders.filter(f => idSet.has(f.id));
    const allRecords = await getAllRecords();
    const records = allRecords.filter(r => idSet.has(r.folderId));
    const profile = await loadProfile();
    const totalPics = records.length;
    const totalFolders = folders.length;

    if (totalPics > 60) {
      hideLoading();
      const ok = await askConfirm({
        title: "数据量较大",
        msg: "本次将导出 " + totalFolders + " 个色卡、" + totalPics + " 张图片。\n\n数据量较大，手机上可能仍会因内存不足失败。\n\n建议：\n1. 少选几个色卡再导出\n2. 或在电脑浏览器打开此页面导出\n\n是否继续？",
        okText: "继续导出",
        cancelText: "取消"
      });
      if (!ok) { btn.disabled = false; btn.textContent = originalText; return; }
      showLoading("正在打包备份…", "共 " + totalPics + " 张图片，请耐心等待");
      await new Promise(r => setTimeout(r, 40));
    }

    showLoading("正在生成备份文件…", "共 " + totalFolders + " 个色卡 · " + totalPics + " 张图片");
    const payload = {
      version: 1,
      exportedAt: new Date().toISOString(),
      profile: {
        name: profile.name || currentName,
        theme: profile.theme || null,
        avatar: profile.avatar || "",
        settingsIcon: profile.settingsIcon || ""
      },
      folders: folders,
      records: records
    };
    await new Promise(r => setTimeout(r, 20));
    const jsonStr = JSON.stringify(payload);
    const blob = new Blob([jsonStr], { type: "application/json;charset=utf-8" });
    const filename = "私调记录备份_" + (profile.name || currentName || "backup") + ".json";

    hideLoading();
    showLoading("准备保存…", "即将唤起系统分享或下载");
    let shared = false;
    if (navigator.canShare) {
      try {
        const file = new File([blob], filename, { type: "application/json" });
        if (navigator.canShare({ files: [file] })) {
          await navigator.share({ files: [file], title: filename });
          shared = true;
        }
      } catch (e) {
        if (e && e.name === "AbortError") {
          hideLoading(); btn.disabled = false; btn.textContent = originalText;
          return;
        }
      }
    }
    if (!shared) {
      const url = URL.createObjectURL(blob);
      const a = document.createElement("a");
      a.href = url;
      a.download = filename;
      a.style.display = "none";
      document.body.appendChild(a);
      a.click();
      setTimeout(() => { a.remove(); URL.revokeObjectURL(url); }, 5000);
      hideLoading();
      showToast("已触发下载，请在「下载」中查找", "success");
    }
  } catch (err) {
    console.error(err);
    hideLoading();
    if (err && err.name === "AbortError") return;
    let tip = "导出失败。";
    const msg = String((err && err.message) || err || "");
    if (/out of memory|内存|allocation|Maximum call stack|QuotaExceeded/i.test(msg)) {
      tip = "内存不足，无法一次导出这么多图片。";
    }
    await showAlert(tip + "\n\n建议：\n1. 少选几个色卡再导出\n2. 用电脑浏览器打开此页面导出\n3. 平时分批备份\n\n" + (msg ? "错误信息：" + msg.slice(0, 120) : ""), "导出失败");
  } finally {
    hideLoading();
    btn.disabled = false;
    btn.textContent = originalText;
  }
}

document.getElementById("jsonFileInput").onchange = async e => {
  const file = e.target.files[0];
  e.target.value = "";
  if (!file) return;
  try {
    showLoading("正在读取备份文件…", "请稍候");
    const text = await file.text();
    const data = JSON.parse(text);
    hideLoading();
    if (!data || !Array.isArray(data.folders) || !Array.isArray(data.records)) {
      await showAlert("备份文件格式不正确，请确认选择的是「私调记录备份」JSON 文件。", "导入失败");
      return;
    }
    const ok = await askConfirm({
      title: "导入将覆盖现有数据",
      msg: "导入将覆盖当前全部色卡与记录，确定继续？\n\n色卡：" + data.folders.length + " 个\n图片：" + data.records.length + " 张",
      okText: "覆盖导入", danger: true
    });
    if (!ok) return;
    showLoading("正在导入数据…", "共 " + data.records.length + " 张图片，请勿关闭");
    await clearAllData();
    const database = await openDB();
    const tx = database.transaction([STORE_FOLDERS, STORE_RECORDS], "readwrite");
    const fs = tx.objectStore(STORE_FOLDERS);
    const rs = tx.objectStore(STORE_RECORDS);
    const idMap = {};
    for (const f of data.folders) {
      const oldId = f.id;
      const copy = { ...f };
      delete copy.id;
      const newId = await idbReq(fs.add(copy));
      idMap[oldId] = newId;
    }
    for (const r of data.records) {
      const copy = { ...r };
      delete copy.id;
      if (copy.folderId != null && idMap[copy.folderId] != null) {
        copy.folderId = idMap[copy.folderId];
      }
      await idbReq(rs.add(copy));
    }
    await txDone(tx);
    if (data.profile) {
      await saveProfile({
        name: data.profile.name || currentName,
        avatar: data.profile.avatar || "",
        theme: data.profile.theme || null,
        settingsIcon: data.profile.settingsIcon || ""
      });
      if (data.profile.name) {
        currentName = data.profile.name;
        mainTitle.textContent = currentName + "の私调记录";
      }
      if (data.profile.avatar) renderAvatar(data.profile.avatar);
      if (data.profile.theme) applyTheme(data.profile.theme);
      if (data.profile.settingsIcon) renderSettingsIcon(data.profile.settingsIcon);
    }
    settingsModal.classList.remove("show");
    showPage(pageFolders);
    await renderFolders();
    hideLoading();
    showToast("导入成功", "success");
  } catch (err) {
    console.error(err);
    hideLoading();
    await showAlert("导入失败，请检查文件是否为有效的备份 JSON。", "导入失败");
  }
};

  const tx = database.transaction(STORE_FOLDERS, "readwrite");
  const f = await idbReq(tx.objectStore(STORE_FOLDERS).get(id));
  if (f) {
    f.cardPrice = val;
    tx.objectStore(STORE_FOLDERS).put(f);
    await txDone(tx);
    openFolder(id, folderMeetFilter);
    recalcTotalAll();
    showToast("已保存裸卡价格", "success");
  }
};

/* —— 取消状态 —— */
document.getElementById("statusCancelNo").onclick = () => document.getElementById("statusCancelModal").classList.remove("show");
document.getElementById("statusCancelModal").onclick = e => { if (e.target.id === "statusCancelModal") e.target.classList.remove("show"); };
document.getElementById("statusCancelYes").onclick = async () => {
  const id = cancelStatusFolderId;
  document.getElementById("statusCancelModal").classList.remove("show");
  if (id != null) { await setFolderStatus(id, ""); showToast("已取消状态", "success"); }
};

/* —— 色卡风格 —— */
document.getElementById("cardStyleCancel").onclick = () => document.getElementById("cardStyleModal").classList.remove("show");
document.getElementById("cardStyleModal").onclick = e => { if (e.target.id === "cardStyleModal") e.target.classList.remove("show"); };
document.getElementById("cardStyleOk").onclick = async () => {
  const id = styleFolderId;
  const val = document.getElementById("cardStyleInput").value.trim();
  document.getElementById("cardStyleModal").classList.remove("show");
  if (id == null) return;
  const database = await openDB();
  const tx = database.transaction(STORE_FOLDERS, "readwrite");
  const f = await idbReq(tx.objectStore(STORE_FOLDERS).get(id));
  if (f) {
    f.cardStyle = val;
    tx.objectStore(STORE_FOLDERS).put(f);
    await txDone(tx);
    openFolder(id, folderMeetFilter);
    showToast("已保存色卡风格", "success");
  }
};

/* —— 编辑私调 —— */
document.getElementById("editCancel").onclick = () => resetEditModalState();
document.getElementById("editModal").onclick = e => { if (e.target && e.target.id === "editModal") resetEditModalState(); };
document.getElementById("editSave").onclick = async () => {
  const folderId = Number(document.getElementById("editFolderId").value);
  const priceVal = document.getElementById("editPrice").value.trim();
  const meetVal = document.getElementById("editMeet").value.trim();
  const helperVal = document.getElementById("editHelper").value.trim();
  const noteVal = document.getElementById("editNote").value.trim();
  if (batchEditMode) {
    for (const rid of selectedRecordIds) {
      const patch = {};
      if (priceVal !== "") patch.price = priceVal;
      if (meetVal !== "") patch.meetName = meetVal;
      if (helperVal !== "") patch.helper = helperVal;
      if (noteVal !== "") patch.note = noteVal;
      if (Object.keys(patch).length) await updateRecord(rid, patch);
    }
    selectedRecordIds.clear();
    multiSelect = false;
    resetEditModalState();
    openFolder(folderId, folderMeetFilter);
    renderFolders();
    showToast("已批量更新", "success");
    return;
  }
  const id = Number(document.getElementById("editRecId").value);
  await updateRecord(id, { price: priceVal, meetName: meetVal, helper: helperVal, note: noteVal });
  resetEditModalState();
  openFolder(folderId, folderMeetFilter);
  renderFolders();
  showToast("已保存", "success");
};
document.getElementById("editSetCover").onclick = async () => {
  const id = Number(document.getElementById("editRecId").value);
  const folderId = Number(document.getElementById("editFolderId").value);
  const database = await openDB();
  const tx = database.transaction(STORE_RECORDS, "readonly");
  const rec = await idbReq(tx.objectStore(STORE_RECORDS).get(id));
  if (!rec || !rec.imgBase64) { showToast("该条目没有图片", "danger"); return; }
  await setFolderCover(folderId, rec.imgBase64);
  resetEditModalState();
  showToast("已设为色卡封面", "success");
  renderFolders();
  openFolder(folderId, folderMeetFilter);
};

/* —— 圈名确认 —— */
confirmName.onclick = async () => {
  if (nameInput.style.display === "none" && currentName) {
    mainTitle.textContent = currentName + "の私调记录";
    enterShell();
    return;
  }
  const val = nameInput.value.trim();
  if (!val) { showToast("请输入圈名", "danger"); return; }
  currentName = val;
  mainTitle.textContent = currentName + "の私调记录";
  const profile = await loadProfile();
  await saveProfile({ name: currentName, avatar: profile.avatar || "" });
  enterShell();
};

/* —— 搜索 —— */
searchInput.oninput = () => {
  searchQuery = searchInput.value;
  searchClear.hidden = !searchQuery;
  renderFolders();
};
searchClear.onclick = () => {
  searchInput.value = "";
  searchQuery = "";
  searchClear.hidden = true;
  renderFolders();
};

/* —— 键盘操作 —— */
document.addEventListener("keydown", e => {
  const lbOpen = lightbox.classList.contains("show");
  if (e.key === "Escape") {
    if (lbOpen) { lightbox.classList.remove("show"); return; }
    const modals = [...document.querySelectorAll(".modal-mask.show")];
    if (modals.length) {
      const top = modals[modals.length - 1];
      if (top.id === "editModal") resetEditModalState();
      else top.classList.remove("show");
    }
    return;
  }
  if (lbOpen && e.key === "ArrowLeft") lbNav(-1);
  if (lbOpen && e.key === "ArrowRight") lbNav(1);
});

/* —— 弹窗/遮罩打开时锁定背景滚动 —— */
new MutationObserver(() => {
  const anyOpen = document.querySelector(".modal-mask.show, .lightbox.show, #loadingOverlay.show");
  document.body.classList.toggle("modal-lock", !!anyOpen);
}).observe(document.body, { attributes: true, childList: true, subtree: true, attributeFilter: ["class"] });

/* ============ 初始化 ============ */
(async function init() {
  try {
    await openDB();
    const profile = await loadProfile();
    if (profile.theme) applyTheme(profile.theme);
    if (profile.settingsIcon) renderSettingsIcon(profile.settingsIcon);
    if (profile.name) {
      currentName = profile.name;
      nameInput.value = currentName;
      nameInput.style.display = "none";
      screenTitle.textContent = currentName + "の私调记录";
      screenTip.textContent = "欢迎回来";
      confirmName.textContent = "登陆";
      mainTitle.textContent = currentName + "の私调记录";
      if (profile.avatar) renderAvatar(profile.avatar);
    }
  } catch (e) {
    console.error(e);
    screenTip.textContent = "本地存储初始化失败";
  }
})();
</script>
<script>
/* PWA：注册 Service Worker（需 https 或 localhost；本地 file:// 打开时静默跳过） */
if ("serviceWorker" in navigator) {
  window.addEventListener("load", function () {
    navigator.serviceWorker.register("sw.js").catch(function () {});
  });
}
</script>
</body>
</html>
